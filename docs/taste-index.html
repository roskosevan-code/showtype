takes pitch it above naturalism, though Hiddleston's cool restraint keeps it from full operatic heightening."}],"values":[7,6,4,4,6,5,4,6]},"The Night Of":{"genres":["Crime"],"scores":[{"axis":"Propulsion","code":"Prop","value":6,"confidence":"medium","justification":"The procedural march from Naz's arrest through arraignment, Rikers, and trial keeps tightening, but the show favors deliberate accumulation (John Stone's plodding casework, the slow corruption inside jail) over scene-to-scene detonation."},{"axis":"Scope","code":"Scope","value":4,"confidence":"high","justification":"Confined to one New York case across a few locales — the precinct, Rikers Island, the courthouse — though it touches several social strata of the city's justice apparatus."},{"axis":"Institutional Sweep","code":"Swp","value":7,"confidence":"medium","justification":"The criminal-justice machine is genuinely a subject: it traces how arrest procedure, bail, plea pressure, and Rikers itself process and reshape Naz regardless of guilt, with the system's own grinding logic foregrounded alongside the character drama."},{"axis":"Interiority","code":"Int","value":4,"confidence":"medium","justification":"We watch Naz's hardening from the outside — his drift toward Freddy's protection and drug use is observed behaviorally rather than narrated from within his consciousness."},{"axis":"Authorial Signature","code":"Auth","value":6,"confidence":"medium","justification":"Zaillian's controlled, precise direction is recognizable — the lingering detail shots, the recurring eczema-and-feet motif on John Stone, the measured framing — a strong hand applied quietly."},{"axis":"Verisimilitude","code":"Ver","value":9,"confidence":"high","justification":"Meticulously researched texture — the booking and evidence procedure, the economics of a storefront defense lawyer, the social order of Rikers, and Stone's clinical eczema all feel reported and lived-in."},{"axis":"Density","code":"Den","value":6,"confidence":"medium","justification":"The forensic detail of the case and the parallel legal/jail threads reward attention, but the narrative is clearly tracked and never deliberately withholds the way a maximally dense show does."},{"axis":"Register","code":"Reg","value":3,"confidence":"high","justification":"Played cool and naturalistic — muted performances, sparse score, and a flat documentary calm even as a life hangs on the verdict; the heightening is emotional restraint, not melodrama."}],"values":[6,4,7,4,6,9,6,3]},"The OA":{"genres":["Sci-Fi","Mystery"],"scores":[{"axis":"Propulsion","code":"Prop","value":5,"confidence":"medium","justification":"Prairie's framed narration to the five listeners builds a mystery-box pull, but long flashback digressions and the deliberately delayed reveals make momentum more atmospheric than scene-to-scene."},{"axis":"Scope","code":"Scope","value":6,"confidence":"medium","justification":"Spans a suburban Michigan town, Russia, captivity in Hap's basement, and multiple dimensions across Part II, stretching the canvas geographically and metaphysically beyond its small core cast."},{"axis":"Institutional Sweep","code":"Swp","value":2,"confidence":"medium","justification":"Hap's captivity operation is a personal enterprise, not a self-perpetuating system the show traces; the drama is the captives' bonds and Prairie's mission, not any machine."},{"axis":"Interiority","code":"Int","value":8,"confidence":"medium","justification":"The entire structure is Prairie's first-person account of her near-death experiences and inner mythology, staging the show inside her possibly-unreliable consciousness."},{"axis":"Authorial Signature","code":"Auth","value":8,"confidence":"medium","justification":"Brit Marling and Zal Batmanglij impose a distinctive hushed, ritualistic style — the interpretive-movement sequences and dimension-hopping conceits are unmistakably their hand."},{"axis":"Verisimilitude","code":"Ver","value":3,"confidence":"medium","justification":"The grounded suburban texture is undercut by frankly mythologized elements — angelic NDEs, the five movements that open portals — that prioritize metaphysical wonder over researched authenticity."},{"axis":"Density","code":"Den","value":6,"confidence":"medium","justification":"Nested timelines, multiple captives' backstories, and the ambiguity over whether Prairie is telling the truth demand active tracking, though the central narration guides the viewer."},{"axis":"Register","code":"Reg","value":7,"confidence":"medium","justification":"Earnest, swelling emotional pitch — the reverent movement rituals and pronouncements about death and dimensions are played with heightened sincerity rather than cool restraint."}],"values":[5,6,2,8,8,3,6,7]},"The Office":{"genres":["Comedy"],"scores":[{"axis":"Propulsion","code":"Prop","value":3,"confidence":"high","justification":"Largely episodic sitcom where most installments reset to office equilibrium; the only real scene-to-scene pull is the slow-burn Jim/Pam romance, while plots like the Dundies or a fire drill don't compound."},{"axis":"Scope","code":"Scope","value":2,"confidence":"high","justification":"Confined almost entirely to the Scranton branch of Dunder Mifflin, with occasional trips to corporate or a client; one small workplace and its staff is the whole canvas."},{"axis":"Institutional Sweep","code":"Swp","value":3,"confidence":"medium","justification":"Dunder Mifflin exerts real pressure—downsizing, the corporate hierarchy, the dying paper-in-a-digital-age premise—but the show is about Michael, Jim, Pam and Dwight's relationships, not the company's self-perpetuating machinery."},{"axis":"Interiority","code":"Int","value":5,"confidence":"medium","justification":"The mockumentary talking-head confessionals give direct access to characters' private thoughts and motives (Jim's exasperation, Michael's need to be liked), though it's comedic disclosure rather than deep psychological staging."},{"axis":"Authorial Signature","code":"Auth","value":6,"confidence":"high","justification":"The mockumentary conceit is a strong, instantly recognizable formal device—handheld zooms, talking heads, and Jim's knowing glances to camera define the look and grammar of the show."},{"axis":"Verisimilitude","code":"Ver","value":7,"confidence":"medium","justification":"The drudgery of paper sales, fluorescent break rooms, HR meetings and petty desk politics feel meticulously observed and authentically mundane despite the comedic exaggeration of characters."},{"axis":"Density","code":"Den","value":2,"confidence":"high","justification":"Self-contained episodes with no threads to track and broadly legible character dynamics; it asks almost nothing of the viewer per minute by design."},{"axis":"Register","code":"Reg","value":4,"confidence":"medium","justification":"The deadpan, naturalistic cringe-comedy documentary tone keeps emotions cool, though Michael Scott's broad antics and the occasional swelling earnest beat push it above flat."}],"values":[3,2,3,5,6,7,2,4]},"The Office (UK)":{"genres":["Comedy"],"scores":[{"axis":"Propulsion","code":"Prop","value":3,"confidence":"medium","justification":"The mockumentary structure idles deliberately — episodes turn on cringe set-pieces like the redundancy meetings or Brent's training day, with the Tim-Dawn flirtation as the only slowly advancing thread; little compounds scene-to-scene."},{"axis":"Scope","code":"Scope","value":1,"confidence":"high","justification":"Almost entirely confined to the Wernham Hogg Slough office floor and occasional pub, with a small fixed cast over a short timeframe."},{"axis":"Institutional Sweep","code":"Swp","value":3,"confidence":"medium","justification":"The paper company and its redundancy/merger pressures are real and shape the comedy, but the show is about Brent's vanity and the Tim-Dawn longing, not about how the corporate machine perpetuates itself."},{"axis":"Interiority","code":"Int","value":4,"confidence":"medium","justification":"The to-camera glances and talking-head asides give fleeting access to Tim's resignation and Dawn's stifled hopes, but the documentary frame mostly keeps us watching behavior from outside."},{"axis":"Authorial Signature","code":"Auth","value":6,"confidence":"high","justification":"The faux-documentary grammar — handheld observation, awkward held silences, characters catching the lens — is a distinct, recognizable formal device that defines the show's voice."},{"axis":"Verisimilitude","code":"Ver","value":9,"confidence":"high","justification":"The drab Slough office, the petty stationery politics, the forced jollity and dead air of real workplace banality feel painstakingly observed and entirely unglamorized."},{"axis":"Density","code":"Den","value":3,"confidence":"medium","justification":"Self-contained episodic situations with no tangle of names or threads to track; the comedy is fully legible without active effort."},{"axis":"Register","code":"Reg","value":2,"confidence":"high","justification":"Pitched deliberately flat and naturalistic — no score, mumbled understatement, awkward pauses left to hang; the cringe works precisely because nothing is heightened."}],"values":[3,1,3,4,6,9,3,2]},"The Plot Against America":{"genres":["Historical"],"scores":[{"axis":"Propulsion","code":"Prop","value":6,"confidence":"medium","justification":"The creeping ascent of Lindbergh's regime and the Office of American Absorption's relocation program steadily tightens the noose around the Levin family, building dread that compounds rather than idles—but the pacing is deliberate, not scene-detonating."},{"axis":"Scope","code":"Scope","value":6,"confidence":"medium","justification":"An alternate-history national political upheaval—a Lindbergh presidency reshaping America—is filtered almost entirely through one Jewish family in Newark, giving social/temporal reach but a tight observational vantage."},{"axis":"Institutional Sweep","code":"Swp","value":5,"confidence":"medium","justification":"Government machinery like the Office of American Absorption and Just Folks resettlement functions as a real, self-perpetuating apparatus of soft fascism, but the show stays anchored to the Levins' lived experience rather than tracing the system as its own subject the way Simon's The Wire does."},{"axis":"Interiority","code":"Int","value":5,"confidence":"medium","justification":"The fracturing family—Herman's defiance, Bess's fear, young Philip's confusion and Sandy's seduction by the regime—is rendered with emotional access, though the mode leans toward observed behavior over deep inner staging."},{"axis":"Authorial Signature","code":"Auth","value":4,"confidence":"medium","justification":"David Simon and Ed Burns apply their characteristic restrained, period-faithful naturalism; the hand is controlled and assured but deliberately unshowy, with no formal tricks calling attention to themselves."},{"axis":"Verisimilitude","code":"Ver","value":8,"confidence":"high","justification":"Meticulously researched 1940s Newark—the Jewish working-class household, radio broadcasts, period speech and bureaucratic antisemitic policy—feels reported and lived-in down to the dinner-table textures."},{"axis":"Density","code":"Den","value":6,"confidence":"medium","justification":"Viewers must track interlocking political developments, the Winchell campaign, and shifting family allegiances, but the storytelling remains followable without heavy withholding."},{"axis":"Register","code":"Reg","value":4,"confidence":"medium","justification":"Largely played in a grounded, naturalistic key with cool performances, though the family's mounting terror and the climactic violence push toward heightened emotional pitch at moments."}],"values":[6,6,5,5,4,8,6,4]},"The Responder":{"genres":["Crime"],"scores":[{"axis":"Propulsion","code":"Prop","value":7,"confidence":"medium","justification":"Each night shift pushes Chris Carson deeper into debt, desperation and compromise, with the stolen-drugs plot tightening the noose episode to episode, though it sometimes circles his breakdown rather than escalating cleanly."},{"axis":"Scope","code":"Scope","value":2,"confidence":"high","justification":"Confined to Chris's night-shift beat across a few Liverpool streets and a handful of lives in his orbit, with a tight timeframe and no wider canvas."},{"axis":"Institutional Sweep","code":"Swp","value":3,"confidence":"medium","justification":"The police force exerts real pressure — superiors, the patrol-car partnership, internal scrutiny — but the show is about one officer's moral and mental collapse, not the machine's self-perpetuating logic."},{"axis":"Interiority","code":"Int","value":7,"confidence":"medium","justification":"The series stages Chris's psychological disintegration from the inside — his panic, rage, and self-justifying lies in therapy sessions and to himself drive the drama."},{"axis":"Authorial Signature","code":"Auth","value":4,"confidence":"medium","justification":"Grounded, handheld night-shift naturalism with some atmospheric Liverpool grime, but no showy formal hand that would mark it as instantly recognizable."},{"axis":"Verisimilitude","code":"Ver","value":8,"confidence":"medium","justification":"Written by former response officer Tony Schumacher, the grind of night patrol, the petty crime, and the bureaucratic exhaustion feel reported and lived-in."},{"axis":"Density","code":"Den","value":5,"confidence":"medium","justification":"Several intersecting threads — Casey, the drugs, Chris's marriage and partner Rachel — but the plotting is followable without heavy tracking."},{"axis":"Register","code":"Reg","value":6,"confidence":"medium","justification":"Martin Freeman's raw, shouting, fraying performance pitches the emotional key high above flat realism, even as the world stays grounded and naturalistic."}],"values":[7,2,3,7,4,8,5,6]},"The Returned (Les Revenants)":{"genres":["Horror","Mystery"],"scores":[{"axis":"Propulsion","code":"Prop","value":3,"confidence":"medium","justification":"The show deliberately withholds answers about why the dead return, lingering in mood and grief rather than escalating; mysteries drift forward in atmospheric drips rather than each scene detonating the next."},{"axis":"Scope","code":"Scope","value":2,"confidence":"high","justification":"Confined almost entirely to one small Alpine town and its dam, with a tight cluster of returned characters and their families; no geographic or social sprawl."},{"axis":"Institutional Sweep","code":"Swp","value":2,"confidence":"medium","justification":"The dam, the local clinic, and the Helping Hand support group exist as backdrops, but the show never traces an institution's self-perpetuating logic — it is about individuals and families facing the uncanny."},{"axis":"Interiority","code":"Int","value":6,"confidence":"medium","justification":"The drama lives inside the disorientation of the returned (Camille's confusion, Simon's longing) and the grief of the living, staging emotional inner states more than external action."},{"axis":"Authorial Signature","code":"Auth","value":7,"confidence":"medium","justification":"A strongly recognizable hand — Fabrice Gobert's eerie stillness, the cool Alpine palette, lingering compositions, and the distinctive Mogwai score give it an unmistakable signature."},{"axis":"Verisimilitude","code":"Ver","value":6,"confidence":"medium","justification":"Despite the supernatural premise, the small-town texture, the awkwardness of reunions with the dead, and the grounded grief feel emotionally researched and lived-in rather than mythologized."},{"axis":"Density","code":"Den","value":6,"confidence":"medium","justification":"Multiple intertwined returned characters and timelines must be tracked with little exposition, and the show trusts viewers to sit with unexplained ambiguity (the receding water, the murders)."},{"axis":"Register","code":"Reg","value":3,"confidence":"medium","justification":"Performances and tone are muted and hushed, the horror played through quiet dread rather than melodrama, keeping the emotional pitch deliberately restrained even amid eerie stakes."}],"values":[3,2,2,6,7,6,6,3]},"The Shield":{"genres":["Crime"],"scores":[{"axis":"Propulsion","code":"Prop","value":9,"confidence":"high","justification":"Vic's murder of Terry Crowley in the pilot sets off a chain of cover-ups where each lie and killing forces the next; the Strike Team's escalating crimes (the Armenian money train, the betrayals) detonate one problem after another with almost no idling."},{"axis":"Scope","code":"Scope","value":4,"confidence":"medium","justification":"Almost entirely confined to the Farmington district and the Barn precinct, though it touches LA gang turf, immigrant communities, and city politics through Aceveda's mayoral ambitions."},{"axis":"Institutional Sweep","code":"Swp","value":5,"confidence":"medium","justification":"The LAPD's internal politics, IA investigations, and Aceveda's careerism are genuinely tracked as a machine that pressures and corrupts, but the show's real subject is Vic and the Strike Team's personal survival rather than the department's self-perpetuating logic."},{"axis":"Interiority","code":"Int","value":4,"confidence":"medium","justification":"Largely observes Vic's behavior and improvised schemes from the outside, with little staging inside his consciousness, though Shane's guilt and Vic's rationalizations occasionally surface."},{"axis":"Authorial Signature","code":"Auth","value":5,"confidence":"medium","justification":"The restless handheld camera, fluorescent-lit Barn interiors, and verite immediacy give it a recognizable look, but the technique serves immersion rather than foregrounding an auteur's hand."},{"axis":"Verisimilitude","code":"Ver","value":7,"confidence":"medium","justification":"Drawn from the real Rampart scandal, the squad-room procedure, gang dynamics, and grimy precinct texture feel reported and lived-in rather than glamorized."} spair and Goodsir's tormented conscience, but much is still observed externally as men deteriorate physically."},{"axis":"Authorial Signature","code":"Auth","value":6,"confidence":"medium","justification":"A strong, quiet hand in the suffocating cold-blue cinematography, oppressive sound design, and the restrained handling of the Tuunbaq horror—recognizably composed without showy tricks."},{"axis":"Verisimilitude","code":"Ver","value":8,"confidence":"high","justification":"Meticulously researched period detail—the Erebus and Terror, naval ritual, scurvy, lead poisoning from tinned food, Inuit culture—gives it a reported, homework-done texture even alongside the supernatural creature."},{"axis":"Density","code":"Den","value":6,"confidence":"medium","justification":"Demands tracking a large crew across two ships, period naval terminology, and slow-accreting medical and survival details without much hand-holding."},{"axis":"Register","code":"Reg","value":4,"confidence":"medium","justification":"Largely restrained and naturalistic—muted, weary performances and mounting quiet dread—with occasional heightened bursts in the mutiny and horror set-pieces."}],"values":[7,3,4,5,6,8,6,4]},"The Tunnel":{"genres":["Crime"],"scores":[{"axis":"Propulsion","code":"Prop","value":7,"confidence":"medium","justification":"The Truth Terrorist's escalating, staged 'truths' and episode-ending reveals keep the cross-border hunt charging forward, though procedural stretches between killings occasionally idle the engine."},{"axis":"Scope","code":"Scope","value":4,"confidence":"medium","justification":"The Anglo-French setup spans Kent, Calais and the Channel Tunnel and two police jurisdictions, but the canvas stays tight on the investigation and a handful of linked victims rather than a broad world."},{"axis":"Institutional Sweep","code":"Swp","value":3,"confidence":"medium","justification":"The friction between the British and French forces is mostly a source of pressure and culture-clash texture; the show follows Karl and Elise's partnership and the killer, not the self-perpetuating logic of either police system."},{"axis":"Interiority","code":"Int","value":4,"confidence":"medium","justification":"Elise's literal-minded, affect-flat manner and Karl's family wounds are mostly read from the outside through behavior; we observe more than we are staged inside either mind."},{"axis":"Authorial Signature","code":"Auth","value":4,"confidence":"medium","justification":"Cool grey-blue palette and the tunnel-border imagery give it a recognizable noir surface, but the direction is largely transparent genre craft rather than a foregrounded hand."},{"axis":"Verisimilitude","code":"Ver","value":6,"confidence":"medium","justification":"Cross-Channel jurisdiction wrangling, mundane station procedure and Karl's domestic life feel grounded, though the elaborate themed serial-killer conceit pulls it toward genre contrivance."},{"axis":"Density","code":"Den","value":5,"confidence":"medium","justification":"Several victim strands and the killer's social-issue 'truths' must be tracked, but the storytelling parcels out exposition cleanly and stays followable."},{"axis":"Register","code":"Reg","value":4,"confidence":"medium","justification":"Performances and tone are largely restrained and naturalistic in the Nordic-noir mode, with only the killer's theatrical set-pieces nudging the pitch upward."}],"values":[7,4,3,4,4,6,5,4]},"The Twilight Zone":{"genres":["Sci-Fi"],"scores":[{"axis":"Propulsion","code":"Prop","value":6,"confidence":"medium","justification":"Each standalone episode is a tight build toward its twist ending—'Time Enough at Last' or 'To Serve Man' tighten relentlessly toward the reveal—but the anthology resets every week with no cross-episode escalation."},{"axis":"Scope","code":"Scope","value":5,"confidence":"low","justification":"Any single episode is confined to a small group and place, but across the run the canvas ranges from suburban streets to deep spac rounded."},{"axis":"Density","code":"Den","value":5,"confidence":"medium","justification":"There are many names, channeling rules, and factions to track, but the show leans on exposition and dialogue to explain its lore rather than trusting the viewer to keep up unaided."},{"axis":"Register","code":"Reg","value":6,"confidence":"medium","justification":"Swelling score, prophecy-laden dialogue, and heightened magical set-pieces push it toward the operatic, though it pulls back into earnest naturalism in quieter character scenes."}],"values":[5,9,5,4,4,4,5,6]},"The Wire":{"genres":["Crime"],"scores":[{"axis":"Propulsion","code":"Prop","value":3,"confidence":"high","justification":"Deliberately withholds momentum; a season assembles disconnected pieces — wiretaps, corner crews, dockworkers — before they cohere, so the pull is structural rather than scene-to-scene cliffhangers."},{"axis":"Scope","code":"Scope","value":9,"confidence":"high","justification":"Spans every layer of Baltimore — the corners, the docks, City Hall, the schools, and the newsroom — each season widening to another stratum."},{"axis":"Institutional Sweep","code":"Swp","value":10,"confidence":"high","justification":"The definitional case: the real subject is how the police department, drug trade, port union, and city government perpetuate themselves regardless of who occupies them."},{"axis":"Interiority","code":"Int","value":1,"confidence":"high","justification":"Almost purely sociological; we watch what McNulty, Avon, or Stringer do and are rarely taken inside their consciousness or given soliloquy-style inner access."},{"axis":"Authorial Signature","code":"Auth","value":2,"confidence":"high","justification":"Aggressively plain and anti-stylish — flat coverage, no showy camera or musical heightening (save the diegetic season-end montages); the craft is hidden by design."},{"axis":"Verisimilitude","code":"Ver","value":10,"confidence":"high","justification":"Reads as reported journalism — the procedur const AXES=DATA.axes, GENRES=DATA.genres, SHOWS=DATA.shows;
const TITLES=Object.keys(SHOWS).sort();
const liked=[], disliked=[];
const $=s=>document.querySelector(s);

const dist=(a,b)=>Math.sqrt(a.reduce((s,v,i)=>s+(v-b[i])**2,0));
const genresOf=t=>(SHOWS[t]?SHOWS[t].genres:[]);
const showsWithGenre=g=>TITLES.filter(t=>genresOf(t).includes(g));
const centroid=ts=>AXES.map((_,i)=>ts.reduce((s,t)=>s+SHOWS[t].values[i],0)/ts.length);
const gbadges=gs=>(gs||[]).map(g=>`<span class="badge">${g}</span>`).join('');

function bars(values){
  return '<div class="axes">'+AXES.map((a,i)=>{const v=values[i];
    return `<div class="ax"><span class="lbl">${a.name}</span><span class="bar"><span style="width:${v*10}%"></span></span><span class="v">${v}</span></div>`;}).join('')+'</div>';
}
function neighborList(items){
  if(!items.length) return '<div class="dist">No matches.</div>';
  return '<ul class="list">'+items.map(it=>`<li><span><button class="lk" data-t="${encodeURIComponent(it.title)}">${it.title}</button>${gbadges(it.genres)}</span><span class="dist">${it.distance}</span></li>`).join('')+'</ul>';
}
function nearestTo(vec,n,exclude,allowed){
  return TITLES.filter(t=>!exclude.has(t)&&(!allowed||allowed.has(t)))
    .map(t=>({title:t,distance:+dist(vec,SHOWS[t].values).toFixed(2),genres:genresOf(t)}))
    .sort((a,b)=>a.distance-b.distance).slice(0,n);
}
function loadShow(title){
  if(!SHOWS[title]){ $('#profile').innerHTML='<div class="err">Unknown show.</div>'; return; }
  $('#pick').value=title;
  const s=SHOWS[title];
  let allowed=null;
  if($('#simSameGenre').checked){ allowed=new Set(); genresOf(title).forEach(g=>showsWithGenre(g).forEach(t=>allowed.add(t))); }
  const neighbors=nearestTo(s.values,8,new Set([title]),allowed);
  let html=`<div style="margin:8px 0 2px">${gbadges(s.genres)}</div>`+bars(s.values);
  html+=s.scores.map(x=>`<div class="just"><b>${x.axis} ${x.value}</b> &middot; ${x.justification} <i>(${x.confidence})</i></div>`).join('');
  html+='<h2 style="margin-top:16px">Nearest in taste-space</h2>'+neighborList(neighbors);
  $('#profile').innerHTML=html;
}

const chipHtml=(arr,list)=>arr.map((t,i)=>`<span class="chip">${t}<b data-list="${list}" data-i="${i}">&times;</b></span>`).join('');
function renderChips(){
  $('#chips').innerHTML=chipHtml(liked,'like')||'<span class="dist">No likes yet.</span>';
  $('#dchips').innerHTML=chipHtml(disliked,'dislike');
}
function recommend(){
  const present=liked.filter(t=>SHOWS[t]);
  if(!present.length){ $('#recs').innerHTML='<div class="dist">Add a few shows you like first.</div>'; return; }
  const neg=disliked.filter(t=>SHOWS[t]);
  const cl=centroid(present);
  let target=cl;
  if(neg.length){ const cd=centroid(neg); target=cl.map((v,i)=>Math.min(10,Math.max(0,v+0.5*(v-cd[i])))); }
  const g=$('#recGenre').value;
  const allowed=g?new Set(showsWithGenre(g)):null;
  const recs=nearestTo(target,12,new Set([...liked,...disliked]),allowed);
  let head='Recommended'; if(g) head+=' &middot; '+g; if(neg.length) head+=' &middot; away from '+neg.length+' disliked';
  $('#recs').innerHTML=`<h2 style="margin-top:14px">${head}</h2>`+neighborList(recs);
}

function buildFilters(){
  $('#filters').innerHTML=AXES.map(a=>`<div class="frow" data-axis="${a.id}"><span class="lbl">${a.name}</span><input type="range" min="0" max="10" value="0" data-kind="min"><input type="range" min="0" max="10" value="10" data-kind="max"><span class="frd" id="frd-${a.id}">0&ndash;10</span></div>`).join('');
}
function syncPair(el){
  const row=el.closest('.frow'); const mn=row.querySelector('[data-kind=min]'),mx=row.querySelector('[data-kind=max]');
  if(+mn.value>+mx.value){ if(el.dataset.kind==='min') mx.value=mn.value; else mn.value=mx.value; }
  $('#frd-'+row.dataset.axis).innerHTML=mn.value+'&ndash;'+mx.value;
}
function runQuery(){
  const fs=[...document.querySelectorAll('.frow')].map(r=>({id:+r.dataset.axis,min:+r.querySelector('[data-kind=min]').value,max:+r.querySelector('[data-kind=max]').value})).filter(s=>s.min>0||s.max<10);
  const matches=TITLES.filter(t=>fs.every(s=>{const v=SHOWS[t].values[s.id-1]; return v>=s.min&&v<=s.max;}));
  const shown=matches.slice(0,60);
  const head=`${matches.length} show${matches.length===1?'':'s'} match`+(fs.length?'':' (no filter)');
  let html=`<h2 style="margin-top:14px">${head}</h2><ul class="list">`+shown.map(t=>`<li><span><button class="lk" data-t="${encodeURIComponent(t)}">${t}</button>${gbadges(genresOf(t))}</span></li>`).join('')+'</ul>';
  if(matches.length>shown.length) html+=`<div class="dist">showing first ${shown.length}</div>`;
  $('#filterResults').innerHTML=html;
}

document.addEventListener('click',e=>{
  const lk=e.target.closest('.lk'); if(lk){ loadShow(decodeURIComponent(lk.dataset.t)); }
  const x=e.target.closest('.chip b'); if(x){ (x.dataset.list==='dislike'?disliked:liked).splice(+x.dataset.i,1); renderChips(); }
});
$('#pick').addEventListener('change',e=>{ if(e.target.value) loadShow(e.target.value); });
$('#simSameGenre').addEventListener('change',()=>{ if($('#pick').value) loadShow($('#pick').value); });
$('#addLike').addEventListener('click',()=>{ const v=$('#likeInput').value.trim(); if(v&&!liked.includes(v)){ liked.push(v); renderChips(); } $('#likeInput').value=''; });
$('#likeInput').addEventListener('keydown',e=>{ if(e.key==='Enter') $('#addLike').click(); });
$('#addDislike').addEventListener('click',()=>{ const v=$('#dislikeInput').value.trim(); if(v&&!disliked.includes(v)){ disliked.push(v); renderChips(); } $('#dislikeInput').value=''; });
$('#dislikeInput').addEventListener('keydown',e=>{ if(e.key==='Enter') $('#addDislike').click(); });
$('#recBtn').addEventListener('click',recommend);
$('#clearBtn').addEventListener('click',()=>{ liked.length=0; disliked.length=0; renderChips(); $('#recs').innerHTML=''; });
$('#filters').addEventListener('input',e=>{ if(e.target.type==='range') syncPair(e.target); });
$('#applyFilter').addEventListener('click',runQuery);
$('#resetFilter').addEventListener('click',()=>{ document.querySelectorAll('.frow').forEach(r=>{ r.querySelector('[data-kind=min]').value=0; r.querySelector('[data-kind=max]').value=10; $('#frd-'+r.dataset.axis).innerHTML='0&ndash;10'; }); $('#filterResults').innerHTML=''; });

$('#shows').innerHTML=TITLES.map(s=>`<option value="${s.replace(/"/g,'&quot;')}">`).join('');
$('#recGenre').innerHTML='<option value="">All genres</option>'+GENRES.map(g=>`<option value="${g}">${g}</option>`).join('');
renderChips(); buildFilters();

</script>
</body></html>
