<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Taste Index</title>
<style>
  :root { --bg:#14110f; --card:#1d1916; --ink:#efe9e1; --mut:#9c9389; --acc:#c97b4a; --line:#332c26; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; }
  header { padding:22px 24px; border-bottom:1px solid var(--line); }
  h1 { margin:0; font:600 22px/1 Georgia,serif; letter-spacing:.2px; }
  .sub { color:var(--mut); font-size:13px; margin-top:4px; }
  .wrap { display:grid; grid-template-columns:1fr 1fr; gap:18px; padding:20px 24px; max-width:1100px; }
  @media (max-width:820px){ .wrap{ grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px; }
  .card h2 { margin:0 0 12px; font:600 13px/1 sans-serif; text-transform:uppercase; letter-spacing:.08em; color:var(--mut); }
  input, button { font:inherit; }
  input[type=text]{ width:100%; background:#0f0d0b; border:1px solid var(--line); color:var(--ink); padding:9px 11px; border-radius:7px; }
  button { background:var(--acc); color:#1a120c; border:0; padding:9px 13px; border-radius:7px; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; color:var(--mut); border:1px solid var(--line); }
  .row { display:flex; gap:8px; }
  .axes { margin-top:14px; }
  .ax { display:grid; grid-template-columns:120px 1fr 28px; align-items:center; gap:10px; margin:6px 0; }
  .ax .lbl { color:var(--mut); font-size:13px; }
  .bar { height:9px; background:#0f0d0b; border-radius:5px; overflow:hidden; }
  .bar > span { display:block; height:100%; background:var(--acc); }
  .ax .v { text-align:right; font-variant-numeric:tabular-nums; color:var(--ink); }
  .just { color:var(--mut); font-size:12.5px; margin:2px 0 10px 130px; }
  ul.list { list-style:none; margin:0; padding:0; }
  ul.list li { display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px solid var(--line); }
  ul.list li:last-child { border-bottom:0; }
  .lk { background:none; border:0; color:var(--acc); cursor:pointer; padding:0; font:inherit; text-align:left; }
  .dist { color:var(--mut); font-variant-numeric:tabular-nums; font-size:12.5px; }
  .badge { background:#0f0d0b; border:1px solid var(--line); color:var(--mut); border-radius:5px; padding:1px 7px; font-size:11.5px; margin-left:8px; }
  select { background:#0f0d0b; border:1px solid var(--line); color:var(--ink); padding:8px 10px; border-radius:7px; }
  label.chk { color:var(--mut); font-size:13px; display:flex; align-items:center; gap:6px; margin:10px 0 0; cursor:pointer; }
  .grid-full { grid-column:1 / -1; }
  .frow { display:grid; grid-template-columns:130px 1fr 1fr 62px; align-items:center; gap:12px; margin:5px 0; }
  .frow .lbl { color:var(--mut); font-size:13px; }
  .frow input[type=range]{ width:100%; accent-color:var(--acc); }
  .frd { text-align:right; color:var(--ink); font-variant-numeric:tabular-nums; font-size:12.5px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 10px; }
  .chip { background:#0f0d0b; border:1px solid var(--line); color:var(--ink); border-radius:20px; padding:3px 10px; font-size:12.5px; }
  .chip b { cursor:pointer; color:var(--mut); margin-left:6px; }
  .err { color:#e0795b; font-size:13px; }
</style></head>
<body>
<header><h1>The Taste Index</h1><div class="sub">Eight descriptive axes &middot; similarity and recommendation in taste-space</div></header>
<div class="wrap">
  <section class="card">
    <h2>Explore a show</h2>
    <input id="pick" type="text" list="shows" placeholder="Type a show&hellip;" autocomplete="off">
    <datalist id="shows"></datalist>
    <label class="chk"><input type="checkbox" id="simSameGenre"> Same genre only</label>
    <div id="profile"></div>
  </section>
  <section class="card">
    <h2>Recommend from shows you like</h2>
    <div class="row"><input id="likeInput" type="text" list="shows" placeholder="Add a show you like&hellip;" autocomplete="off"><button id="addLike">+ Like</button></div>
    <div id="chips" class="chips"></div>
    <div class="row"><input id="dislikeInput" type="text" list="shows" placeholder="Add a show you don&rsquo;t like&hellip;" autocomplete="off"><button id="addDislike" class="ghost">&minus; Dislike</button></div>
    <div id="dchips" class="chips"></div>
    <div class="row"><button id="recBtn">Recommend</button><select id="recGenre"></select><button id="clearBtn" class="ghost">Clear</button></div>
    <div id="recs"></div>
  </section>
  <section class="card grid-full">
    <h2>Filter by axis profile</h2>
    <div id="filters"></div>
    <div class="row" style="margin-top:12px"><button id="applyFilter">Apply filter</button><button id="resetFilter" class="ghost">Reset</button></div>
    <div id="filterResults"></div>
  </section>
</div>
<script>
const DATA={"axes":[{"id":1,"name":"Propulsion","code":"Prop"},{"id":2,"name":"Scope","code":"Scope"},{"id":3,"name":"Institutional Sweep","code":"Swp"},{"id":4,"name":"Interiority","code":"Int"},{"id":5,"name":"Authorial Signature","code":"Auth"},{"id":6,"name":"Verisimilitude","code":"Ver"},{"id":7,"name":"Density","code":"Den"},{"id":8,"name":"Register","code":"Reg"}],"genres":["Crime","Comedy","Sci-Fi","Drama","Thriller","Mystery","Horror","Fantasy","Historical","Western","War","Political"],"shows":{"1899":{"genres":["Sci-Fi"],"scores":[{"axis":"Propulsion","code":"Prop","value":6,"confidence":"medium","justification":"The mounting mysteries aboard the Kerberos and the recurring 'reset' shocks pull the viewer forward, but the show also withholds and circles, doling out cryptic crumbs rather than letting each scene cleanly detonate the next."},{"axis":"Scope","code":"Scope","value":6,"confidence":"medium","justification":"A single migrant steamship is the physical stage, but the simulation/multiverse reveal and the passengers drawn from across Europe (and the nested layers of reality) expand the canvas socially and temporally well beyond one location."},{"axis":"Institutional Sweep","code":"Swp","value":2,"confidence":"medium","justification":"The shipping line and the simulation's controllers exist, but the show is about individual trauma and the puppet-master family, not the self-perpetuating logic of any institution."},{"axis":"Interiority","code":"Int","value":7,"confidence":"medium","justification":"The series stages much of itself inside Maura's fractured memory and the passengers' guilt-ridden flashbacks, repeatedly entering minds rather than observing behavior externally."},{"axis":"Authorial Signature","code":"Auth","value":8,"confidence":"high","justification":"The Dark creators' signature is unmistakable: the pyramid/staircase motifs, multilingual ensemble, eerie symmetrical compositions, and the recurring 'wake up' refrain mark a strong, recognizable hand."},{"axis":"Verisimilitude","code":"Ver","value":4,"confidence":"medium","justification":"The 1899 steamship period detail and multilingual casting feel researched, but the deliberately uncanny, dreamlike artificiality (and eventual simulation reveal) keeps it mythologized rather than lived-in."},{"axis":"Density","code":"Den","value":7,"confidence":"medium","justification":"A large multilingual ensemble with hidden connections, recurring symbols, and nested-reality twists demands active tracking with little hand-holding."},{"axis":"Register","code":"Reg","value":6,"confidence":"medium","justification":"The swelling score, ominous tableaux, and heightened revelations push toward operatic, though performances are often held in a cool, mournful key rather than full melodrama."}],"values":[6,6,2,7,8,4,7,6]},"3 Body Problem":{"genres":["Sci-Fi"],"scores":[{"axis":"Propulsion","code":"Prop","value":7,"confidence":"medium","justification":"The countdown ticking behind the scientists' eyes, the suicides, and the unfolding VR game each pull toward the next reveal, though some mid-season threads (the historical interludes) slow the engine."},{"axis":"Scope","code":"Scope","value":9,"confidence":"high","justification":"It stretches from the 1960s Cultural Revolution to the present, across London, China, and a space station, and frames a 400-year cosmic invasion from the San-Ti — temporal and geographic canvas at near-maximum."},{"axis":"Institutional Sweep","code":"Swp","value":4,"confidence":"medium","justification":"Wade's Strategic Defense Agency and the ETO cult exert real pressure, but the show follows the Oxford Five and Ye Wenjie's choices rather than tracing any institution's self-perpetuating logic."},{"axis":"Interiority","code":"Int","value":4,"confidence":"medium","justification":"Ye Wenjie's grief and betrayal get genuine inner staging, but the present-day Oxford Five are mostly observed externally as they react to the threat."},{"axis":"Authorial Signature","code":"Auth","value":5,"confidence":"medium","justification":"The photoreal VR-game sequences (the pyramid, the dehydration, the human computer) are a distinctive visual set-piece, but the surrounding prestige-Netflix grammar is fairly conventional."},{"axis":"Verisimilitude","code":"Ver","value":6,"confidence":"medium","justification":"Real physics (the sophon, the flickering universe) and the meticulously staged Cultural Revolution struggle session feel researched, but the glossy contemporary scenes and tidy ensemble lean less lived-in."},{"axis":"Density","code":"Den","value":6,"confidence":"medium","justification":"It demands tracking of concepts like sophons and the dark forest plus dual timelines, but it streamlines and over-explains much of the source novel's hardest material."},{"axis":"Register","code":"Reg","value":5,"confidence":"medium","justification":"Mostly grounded performances, but a swelling score and heightened emotional beats (Jin's grief, Wade's gravelly menace, the Panama 'Judgment Day' set-piece) push the pitch above naturalistic."}],"values":[7,9,4,4,5,6,6,5]},"30 Rock":{"genres":["Comedy"],"scores":[{"axis":"Propulsion","code":"Prop","value":3,"confidence":"high","justification":"It's a reset-button episodic sitcom — each episode's TGS crisis or Jack/Liz scheme resolves by the credits, so little compounds across episodes."},{"axis":"Scope","code":"Scope","value":3,"confidence":"high","justification":"Confined to the GE/NBC building, Liz's apartment, and a few New York locations; the canvas is one studio and its orbit despite occasional corporate-ladder jokes."},{"axis":"Institutional Sweep","code":"Swp","value":4,"confidence":"medium","justification":"GE/Sheinhardt Wig Company corporate absurdity and network politics exert real satirical pressure via Jack, but the show is about the Liz–Jack relationship and the staff, not the machine's self-perpetuating logic."},{"axis":"Interiority","code":"Int","value":3,"confidence":"medium","justification":"Mostly external joke-driven behavior; Liz Lemon's occasional voiced exasperation gives slight access but we rarely live inside any consciousness."},{"axis":"Authorial Signature","code":"Auth","value":7,"confidence":"high","justification":"Instantly recognizable Tina Fey voice — machine-gun cutaway gags, absurdist flashbacks, fourth-wall winks, and a relentless reference-per-second rhythm."},{"axis":"Verisimilitude","code":"Ver","value":2,"confidence":"high","justification":"Deliberately cartoonish — Kenneth's ageless rube persona, Tracy Jordan's surreal antics, and Sheinhardt Wig conspiracies prize absurdity over any lived-in realism."},{"axis":"Density","code":"Den","value":5,"confidence":"medium","justification":"Jokes and callbacks fly faster than the viewer can fully catch, demanding attention, but the plotting itself is self-contained and hand-holding."},{"axis":"Register","code":"Reg","value":8,"confidence":"high","justification":"Broad, heightened performances — Jenna's diva theatrics and Tracy's manic outbursts — pitched at maximal comic volume rather than naturalistic understatement."}],"values":[3,3,4,3,7,2,5,8]},"Abbott Elementary":{"genres":["Comedy"],"scores":[{"axis":"Propulsion","code":"Prop","value":3,"confidence":"high","justification":"As a workplace sitcom, episodes are largely self-contained around a single gag or lesson; the slow-burn Janine-Gregory romance provides mild serialized pull but most episodes reset without escalating consequence."},{"axis":"Scope","code":"Scope","value":2,"confidence":"high","justification":"Confined almost entirely to one underfunded Philadelphia public school, its hallways and classrooms, with the occasional field trip; the canvas is a single building and its small staff."},{"axis":"Institutional Sweep","code":"Swp","value":5,"confidence":"medium","justification":"The chronic dysfunction of an underfunded public school district — broken systems, incompetent principal Ava, lack of resources — is a genuine recurring subject, though the warmth of the teachers' relationships shares the stage equally."},{"axis":"Interiority","code":"Int","value":3,"confidence":"high","justification":"The mockumentary talking-head confessionals give brief access to characters' feelings, especially Janine's, but the show observes behavior and comedy from the outside rather than staging itself inside a mind."},{"axis":"Authorial Signature","code":"Auth","value":4,"confidence":"high","justification":"The Office-style mockumentary grammar — to-camera glances, faux-doc handheld, interview cutaways — is a recognizable but well-worn convention rather than a distinctive personal hand."},{"axis":"Verisimilitude","code":"Ver","value":6,"confidence":"medium","justification":"Quinta Brunson's grounding in real public-school struggles — supply shortages, standardized testing, parent dynamics — lends authentic texture, though the warm sitcom tone smooths the rougher edges."},{"axis":"Density","code":"Den","value":2,"confidence":"high","justification":"Episodes are accessible and self-explanatory with clear setups and payoffs; characters and stakes are spelled out, asking little active tracking from the viewer."},{"axis":"Register","code":"Reg","value":4,"confidence":"medium","justification":"Performances are warm and naturalistic in the mockumentary key, with comedic heightening from Ava and Melissa but no melodramatic swelling; the emotional pitch stays mostly grounded and gentle."}],"values":[3,2,5,3,4,6,2,4]},"Alias":{"genres":["Thriller"],"scores":[{"axis":"Propulsion","code":"Prop","value":8,"confidence":"high","justification":"Each episode ends on a cliffhanger and Sydney's missions, betrayals, and the Rambaldi mystery constantly escalate, with reveals like the SD-6 double-agent setup forcing immediate next moves."},{"axis":"Scope","code":"Scope","value":6,"confidence":"medium","justification":"Globe-trotting missions across countless cities plus dueling spy agencies (CIA, SD-6, K-Directorate) give a wide geographic and factional canvas, though it centers on one family and a tight core cast."},{"axis":"Institutional Sweep","code":"Swp","value":3,"confidence":"medium","justification":"SD-6, the CIA, and the Alliance are constant pressure sources, but the show is about Sydney and the Bristow family's loyalties and betrayals, not the self-perpetuating logic of the spy machine itself."},{"axis":"Interiority","code":"Int","value":4,"confidence":"medium","justification":"Sydney's voiceover and emotional turmoil over her double life and her parents give some inner access, but the mode is largely external action and plot."},{"axis":"Authorial Signature","code":"Auth","value":5,"confidence":"medium","justification":"J.J. Abrams gives it recognizable touches — saturated wig-and-disguise set pieces, pulsing techno scoring, and in-media-res cold opens — but the craft stays within glossy network-action convention."},{"axis":"Verisimilitude","code":"Ver","value":3,"confidence":"high","justification":"The tradecraft is fantastical — instant disguises, Rambaldi prophecy artifacts, implausible gadgetry — prioritizing spy-fantasy spectacle over researched authenticity."},{"axis":"Density","code":"Den","value":4,"confidence":"medium","justification":"There are many factions and a mythology to track, but the show recaps heavily and resets the situation often, keeping it accessible network drama."},{"axis":"Register","code":"Reg","value":7,"confidence":"medium","justification":"Emotions are pitched high — melodramatic family revelations, swelling music, and heightened life-or-death cliffhangers played with operatic urgency rather than naturalistic cool."}],"values":[8,6,3,4,5,3,4,7]},"Altered Carbon":{"genres":["Sci-Fi"],"scores":[{"axis":"Propulsion","code":"Prop","value":6,"confidence":"medium","justification":"The murder-mystery spine (Bancroft hiring Kovacs to solve his own killing) drives season one forward, but the show frequently detours into flashbacks and worldbuilding that slacken the scene-to-scene pull."},{"axis":"Scope","code":"Scope","value":7,"confidence":"medium","justification":"Spans the vertical strata of Bay City from the Meths' cloud-piercing aerie homes to the street-level slums, plus a 250-year timeline enabled by stack immortality and off-world Protectorate references."},{"axis":"Institutional Sweep","code":"Swp","value":4,"confidence":"medium","justification":"The Protectorate, the police, and the religious-coding laws around resleeving exert real pressure and the immortal Meth oligarchy is critiqued as a system, but the drama centers on Kovacs's personal revenge and the Ortega relationship rather than tracing any institution's own logic."},{"axis":"Interiority","code":"Int","value":5,"confidence":"medium","justification":"Voiceover and recurring flashbacks to Quell and the Envoy training give real access to Kovacs's grief and memory, but much of the show is external action and noir investigation."},{"axis":"Authorial Signature","code":"Auth","value":7,"confidence":"medium","justification":"A heavily designed neon cyberpunk aesthetic with rain-slicked vertical cityscapes, AI hotel Poe, and graphic resleeving body-swaps gives it a strongly recognizable visual hand, though it draws openly from Blade Runner."},{"axis":"Verisimilitude","code":"Ver","value":4,"confidence":"medium","justification":"The stack/sleeve technology is worked out with some internal consistency, but the world leans glamorized and pulpy — gleaming penthouses, fight-club excess, and noir archetypes over lived-in granular texture."},{"axis":"Density","code":"Den","value":5,"confidence":"medium","justification":"Viewers must track resleeving rules, multiple bodies for single characters, and the layered conspiracy, but the show repeatedly stops to explain its own jargon and mythology."},{"axis":"Register","code":"Reg","value":6,"confidence":"medium","justification":"Pitched fairly loud — pumping score, extravagant violence, melodramatic doomed romance with Quell — though tempered by Kovacs's hardboiled deadpan noir narration."}],"values":[6,7,4,5,7,4,5,6]},"American Gods":{"genres":["Fantasy"],"scores":[{"axis":"Propulsion","code":"Prop","value":3,"confidence":"medium","justification":"The road-trip structure and frequent 'Coming to America' digressions stall forward drive; Shadow and Wednesday wander and recruit rather than escalate, and plot threads idle for long stretches especially after season one."},{"axis":"Scope","code":"Scope","value":8,"confidence":"medium","justification":"The canvas spans a continent of old and new deities — Anansi, Bilquis, Czernobog, Media, Technical Boy — across America and through mythological history via the vignettes, a vast social and temporal map of belief."},{"axis":"Institutional Sweep","code":"Swp","value":2,"confidence":"medium","justification":"The old-gods/new-gods war forms factions but the show never traces a self-perpetuating institutional machine; it's a mythic quest centered on individual deities, not systems storytelling."},{"axis":"Interiority","code":"Int","value":4,"confidence":"medium","justification":"Shadow Moon and Laura get some inner grief and disorientation, but the dominant mode is external mythologizing and spectacle rather than staging the story inside a consciousness."},{"axis":"Authorial Signature","code":"Auth","value":9,"confidence":"high","justification":"Bryan Fuller's hand is unmistakable — saturated color, surreal slow-motion, Bilquis's devouring sequence, the golden Technical Boy void — a loud, instantly recognizable visual signature."},{"axis":"Verisimilitude","code":"Ver","value":3,"confidence":"high","justification":"The world is overtly mythologized and dreamlike — blood rains, CGI bison, stylized roadside Americana — prioritizing heightened imagery over reported, lived-in texture."},{"axis":"Density","code":"Den","value":5,"confidence":"medium","justification":"Viewers must track a sprawling pantheon and cryptic vignettes whose relevance is withheld, but the self-contained 'Coming to America' shorts and a simple central quest keep it followable."},{"axis":"Register","code":"Reg","value":8,"confidence":"medium","justification":"Ian McShane's grandiose Wednesday speeches, operatic violence, and swelling theatricality pitch the emotional key loud and maximalist throughout."}],"values":[3,8,2,4,9,3,5,8]},"Andor":{"genres":["Sci-Fi"],"scores":[{"axis":"Propulsion","code":"Prop","value":7,"confidence":"high","justification":"The heist arc and the Narkina 5 prison break escalate relentlessly, each tightening the noose, though the show takes deliberate breath-taking pauses (the Ferrix funeral build) that slow the engine."},{"axis":"Scope","code":"Scope","value":8,"confidence":"high","justification":"Spans Ferrix, Coruscant's Senate, the ISB, Aldhani, the Narkina prison and rebel cells across the galaxy, layering imperial bureaucracy against grassroots resistance."},{"axis":"Institutional Sweep","code":"Swp","value":9,"confidence":"high","justification":"The ISB's careerist infighting, the prison's industrial logic, and the Senate are all dramatized as self-perpetuating machines that function independent of any single character."},{"axis":"Interiority","code":"Int","value":4,"confidence":"medium","justification":"We mostly observe Cassian and Luthen from outside; Maarva's recorded eulogy and Luthen's 'sunrise' speech give glimpses of inner conviction, but the mode is largely behavioral."},{"axis":"Authorial Signature","code":"Auth","value":6,"confidence":"medium","justification":"A strong, controlled hand—Tony Gilroy's patient blocking, the brutalist Coruscant design and Nicholas Britell's score—commands quietly without showy formal tricks."},{"axis":"Verisimilitude","code":"Ver","value":7,"confidence":"high","justification":"The granular bureaucratic procedure of the ISB, the labor texture of Ferrix, and the prison's assembly-line cruelty feel researched and lived-in despite the fantastical setting."},{"axis":"Density","code":"Den","value":7,"confidence":"high","justification":"Multiple factions, agents and aliases (Axis, Cassian/Clem, ISB officers) must be tracked across parallel threads with minimal exposition or recap."},{"axis":"Register","code":"Reg","value":4,"confidence":"medium","justification":"Largely restrained and naturalistic in performance, though Luthen's monologue and Maarva's funeral push toward operatic heightening at key moments."}],"values":[7,8,9,4,6,7,7,4]},"Angel":{"genres":["Fantasy","Horror"],"scores":[{"axis":"Propulsion","code":"Prop","value":6,"confidence":"medium","justification":"Early seasons lean on episodic detective-agency cases, but the show builds genuine escalation in arcs like Darla's resurrection, Connor's birth and betrayal, and the Jasmine takeover, where each revelation tightens the noose; momentum is strong in stretches but punctuated by standalones."},{"axis":"Scope","code":"Scope","value":6,"confidence":"medium","justification":"Anchored in noir Los Angeles but stretches across demon dimensions like Pylea and the cosmic reach of Wolfram & Hart's Senior Partners, spanning earthly and otherworldly strata without ever being continent- or century-spanning."},{"axis":"Institutional Sweep","code":"Swp","value":6,"confidence":"medium","justification":"Wolfram & Hart functions as a genuine self-perpetuating machine — an eternal law firm that channels evil through bureaucracy and outlives any individual, and season 5's running of the firm explicitly probes how the institution co-opts and corrupts, sharing the stage as a subject."},{"axis":"Interiority","code":"Int","value":5,"confidence":"medium","justification":"Angel's brooding guilt and redemption obsession get real interior attention (the 'Hyperion' flashbacks, his despair after losing his soul), but the show mostly observes the team's actions rather than staging itself inside a consciousness."},{"axis":"Authorial Signature","code":"Auth","value":4,"confidence":"medium","justification":"The Whedon-house voice — rapid quippy banter and tonal whiplash — is recognizable, but the visual grammar is fairly conventional late-90s/early-2000s genre-TV with few formal flourishes."},{"axis":"Verisimilitude","code":"Ver","value":4,"confidence":"medium","justification":"The world is mythologized supernatural fantasy — prophecies, demon dimensions, magic — though the seedy LA private-eye trappings and office politics of an evil law firm lend some grounded texture."},{"axis":"Density","code":"Den","value":5,"confidence":"medium","justification":"Serialized mythology (the Shanshu prophecy, recurring demons, shifting alliances) rewards tracking, but episodes often recap and self-contain enough that the show doesn't demand constant active holding of threads."},{"axis":"Register","code":"Reg","value":6,"confidence":"medium","justification":"Pitched fairly high — operatic apocalyptic stakes, melodramatic emotional turns like Angel's despair and Fred's death, and broad comic set pieces (the puppet episode, the karaoke demon) — heightened but not as swaggering as full melodrama."}],"values":[6,6,6,5,4,4,5,6]},"Animal Kingdom":{"genres":["Crime"],"scores":[{"axis":"Propulsion","code":"Prop","value":7,"confidence":"medium","justification":"The Cody family's heists and Smurf's manipulations keep escalating, with each robbery and betrayal forcing the next crisis; the engine rarely idles even if some midseason subplots circle."},{"axis":"Scope","code":"Scope","value":4,"confidence":"medium","justification":"Largely confined to the Cody household and the SoCal beach-town milieu of robberies; it stays a family-and-crew story rather than spanning institutions or large social strata."},{"axis":"Institutional Sweep","code":"Swp","value":2,"confidence":"medium","justification":"This is about one criminal family and Smurf's matriarchal grip, not the self-perpetuating logic of any system; the police presence is backdrop pressure, not subject."},{"axis":"Interiority","code":"Int","value":4,"confidence":"medium","justification":"There's real access to J's calculating outsider POV and the brothers' wounds, but the show mostly observes behavior and bravado rather than living inside a mind."},{"axis":"Authorial Signature","code":"Auth","value":5,"confidence":"low","justification":"Sun-bleached surf-and-muscle aesthetic with slick heist photography gives a recognizable look, but it's a polished genre style rather than a singular auteur hand."},{"axis":"Verisimilitude","code":"Ver","value":5,"confidence":"low","justification":"The heist mechanics and SoCal grift texture feel reasonably grounded, but the perpetually shirtless, partying outlaw-family fantasy leans glamorized over reported."},{"axis":"Density","code":"Den","value":4,"confidence":"medium","justification":"The family relationships and heist plotting are followable with modest tracking; it doesn't withhold exposition or demand holding many threads at once."},{"axis":"Register","code":"Reg","value":6,"confidence":"medium","justification":"Smurf's melodramatic family power plays, charged eruptions of violence, and heightened sexual tension push it above naturalism, though it stops short of full operatic pitch."}],"values":[7,4,2,4,5,5,4,6]},"Arrested Development":{"genres":["Comedy"],"scores":[{"axis":"Propulsion","code":"Prop","value":5,"confidence":"medium","justification":"Episodes are intricately plotted with running schemes (the model home, the company's fraud), and gags seed future payoffs, but the engine is comedic recursion rather than escalating consequence, so momentum is moderate."},{"axis":"Scope","code":"Scope","value":3,"confidence":"high","justification":"Confined to the Bluth family, their Orange County orbit, and the Bluth Company; the canvas is one dysfunctional family rather than a wide geographic or social world."},{"axis":"Institutional Sweep","code":"Swp","value":2,"confidence":"high","justification":"The Bluth Company and its fraud are backdrop for family dysfunction; the show traces no self-perpetuating institutional logic, just the Bluths' personal scheming."},{"axis":"Interiority","code":"Int","value":2,"confidence":"medium","justification":"Ron Howard's narration describes behavior and ironizes it from outside; we watch the Bluths act selfishly but are rarely staged inside any character's consciousness."},{"axis":"Authorial Signature","code":"Auth","value":8,"confidence":"high","justification":"Instantly recognizable hand: the omniscient narrator, mock-documentary handheld, freeze-frames, on-screen text, and tightly engineered callback architecture make it unmistakable blind."},{"axis":"Verisimilitude","code":"Ver","value":2,"confidence":"high","justification":"The world is cartoonish and farcical—chicken dances, a never-nude, the stair car—prioritizing comic absurdity over any reported or lived-in texture."},{"axis":"Density","code":"Den","value":8,"confidence":"high","justification":"Layered running gags, planted foreshadowing, and rewarded rewatch callbacks (\"I've made a huge mistake,\" blue paint) demand active tracking with no hand-holding."},{"axis":"Register","code":"Reg","value":6,"confidence":"medium","justification":"Plots and characters are broadly heightened caricatures (Tobias, Gob's magic, Lucille's venom), yet delivered with dry ironic deadpan, placing it in the upper-mid heightened range."}],"values":[5,3,2,2,8,2,8,6]},"Atlanta":{"genres":["Comedy"],"scores":[{"axis":"Propulsion","code":"Prop","value":3,"confidence":"high","justification":"Episodes are largely self-contained vignettes — a night lost trying to retrieve a jacket, a fake BET talk-show — that resist serialized escalation; the show drifts and observes rather than detonating the next problem."},{"axis":"Scope","code":"Scope","value":4,"confidence":"medium","justification":"Mostly anchored in the Atlanta hustle and rap scene with its class strata, though Season 3's European tour and the standalone Black-life parables widen the social canvas nt the viewer."},{"axis":"Register","code":"Reg","value":4,"confidence":"medium","justification":"Largely restrained and naturalistic in its combat and grief, though Michael Kamen's swelling score and moments of earned heroism push the emotional pitch above flat."}],"values":[6,7,6,4,6,9,5,4]},"Banshee":{"genres":["Crime","Thriller"],"scores":[{"axis":"Propulsion","code":"Prop","value":8,"confidence":"high","justification":"The show barely pauses between heists, ambushes, and reprisals; Lucas's fake-sheriff con and his war with Kai Proctor keep detonating fresh threats so the next-episode pull is relentless."},{"axis":"Scope","code":"Scope","value":4,"confidence":"medium","justification":"Confined largely to the small town of Banshee, PA, but it layers in Amish-rooted crime, the Kinaho tribe's casino, and Ukrainian mob ties for some social breadth."},{"axis":"Institutional Sweep","code":"Swp","value":2,"confidence":"medium","justification":"The sheriff's department is a stolen-identity cover and a plot engine, not a self-perpetuating system the show examines; swap it for any badge and the con-man-on-the-run story is unchanged."},{"axis":"Interiority","code":"Int","value":3,"confidence":"medium","justification":"Flashbacks to Lucas and Ana/Carrie's heist past gesture at motive, but the mode is overwhelmingly external action rather than staging us inside anyone's consciousness."},{"axis":"Authorial Signature","code":"Auth","value":7,"confidence":"medium","justification":"A loud, recognizable hand in the comic-book-graphic fight choreography and brutal set-piece staging (the Proctor brawls, the Albino prison fight) marks it as visibly stylized."},{"axis":"Verisimilitude","code":"Ver","value":3,"confidence":"high","justification":"The world is pulp fantasy—a fugitive impersonating a dead lawman with no one checking, superhuman bare-knuckle violence—mythologized rather than researched or lived-in."},{"axis":"Density","code":"Den","value":3,"confidence":"medium","justification":"Plots are followable with little tracking required; the show foregrounds visceral action over withheld exposition or thread-juggling."},{"axis":"Register","code":"Reg","value":8,"confidence":"high","justification":"Everything is pitched loud—operatic violence, heightened melodrama, sex and revenge played to the hilt—and paired with its low verisimilitude this is the deliberately lurid, pulpy key."}],"values":[8,4,2,3,7,3,3,8]},"Barry":{"genres":["Comedy","Crime"],"scores":[{"axis":"Propulsion","code":"Prop","value":8,"confidence":"high","justification":"Each lie Barry tells to protect his double life compounds into the next crisis—Goran, the cops, Fuches' betrayals—so consequences detonate forward, especially the relentless escalation of seasons 3-4."},{"axis":"Scope","code":"Scope","value":3,"confidence":"high","justification":"Confined to a small LA orbit—Gene's acting class, the Chechen and Bolivian crews, and a handful of relationships—rather than spanning regions, eras, or social strata."},{"axis":"Institutional Sweep","code":"Swp","value":2,"confidence":"high","justification":"The acting class and crime crews are pressure sources and backdrops, not self-perpetuating machines the show traces; it's about one man's moral disintegration, not a system."},{"axis":"Interiority","code":"Int","value":7,"confidence":"medium","justification":"The show stages Barry's dissociation, guilt, and self-justifying delusion directly—dream sequences, the 'starting from zero' rationalizations—putting us inside his fractured psyche."},{"axis":"Authorial Signature","code":"Auth","value":8,"confidence":"high","justification":"Hader's direction is highly distinctive—the extended single-take motorcycle chase, the surreal dirt-bike-kids set piece, sudden tonal pivots and bold formal swings mark a recognizable hand."},{"axis":"Verisimilitude","code":"Ver","value":5,"confidence":"medium","justification":"The Hollywood-acting-class milieu and hitman drudgery feel observed and specific, but the heightened crime plotting and farcical coincidences pull it away from reportage."},{"axis":"Density","code":"Den","value":5,"confidence":"medium","justification":"Followable scene to scene, but the later seasons' time jumps and the layering of who knows what about Barry's secret demand active tracking."},{"axis":"Register","code":"Reg","value":6,"confidence":"medium","justification":"It oscillates between deadpan comedy and sudden operatic violence and despair—NoHo Hank's heightened emotionality and the bleak tragic crescendos push it above naturalistic restraint without going full melodrama."}],"values":[8,3,2,7,8,5,5,6]},"Battlestar Galactica":{"genres":["Sci-Fi"],"scores":[{"axis":"Propulsion","code":"Prop","value":8,"confidence":"high","justification":"The fleet's relentless flight from Cylon pursuit means each episode's crisis—a jump to a new system, a coup, a resource shortage—creates the next, with serialized arcs like the New Caprica occupation compounding rather than resetting."},{"axis":"Scope","code":"Scope","value":8,"confidence":"high","justification":"A ragtag fleet of ships ranging across space plus the civilian/military/political strata (Quorum, presidency, the deck crew) and two opposed civilizations (humans and Cylons) make for a large social and geographic canvas."},{"axis":"Institutional Sweep","code":"Swp","value":5,"confidence":"medium","justification":"The friction between Adama's military command and Roslin's civilian government, the Quorum, and the press genuinely share the stage, but the show's true subject is survival and identity rather than tracing any institution's self-perpetuating logic."},{"axis":"Interiority","code":"Int","value":6,"confidence":"medium","justification":"Baltar's hallucinated head-Six stages his psyche directly, and the Cylons' agonized questions of identity and the sleeper-agent reveals push the show substantially inside conflicted consciousnesses."},{"axis":"Authorial Signature","code":"Auth","value":6, ne's logic."},{"axis":"Interiority","code":"Int","value":8,"confidence":"high","justification":"The series lives inside Danny's and Amy's depression, rage, and self-loathing, culminating in the hallucinatory berry-poisoning finale where their merged consciousness is literally staged as the text."},{"axis":"Authorial Signature","code":"Auth","value":7,"confidence":"medium","justification":"A distinct hand via episode titles drawn from artworks, painted chapter title cards, and the surreal dissociative finale give it a recognizable A24-auteur stamp."},{"axis":"Verisimilitude","code":"Ver","value":7,"confidence":"medium","justification":"The Korean-American immigrant milieu, the grind of a struggling contractor and a self-made plant-store owner, and the church scenes feel observed and lived-in rather than glamorized."},{"axis":"Density","code":"Den","value":5,"confidence":"medium","justification":"Moderate demand—the dual perspectives and family subplots (Paul, George, the parents) require tracking, but the central feud is always legible and the show doesn't withhold much."},{"axis":"Register","code":"Reg","value":6,"confidence":"medium","justification":"Emotions are pitched loud—screaming confrontations, the operatic spiral of obsession and the heightened, near-mythic finale—though grounded in naturalistic performance enough to avoid full melodrama."}],"values":[8,3,2,8,7,7,5,6]},"Berlin Station":{"genres":["Thriller"],"scores":[{"axis":"Propulsion","code":"Prop","value":6,"confidence":"medium","justification":"The hunt for the leaker 'Thomas Shaw' in season one drives a serialized mole-hunt with steady escalation, though midseason stretches idle on relationship subplots and tradecraft procedure."},{"axis":"Scope","code":"Scope","value":5,"confidence":"medium","justification":"Centered on the CIA's Berlin station but expanding to operations across Europe and shifting focus to refugee/far-right politics in later seasons; a regional rather than continental or epochal ca ns Albuquerque law firms, the courthouse, the cartel underworld, and the eldercare/Sandpiper case, plus the flash-forward Omaha timeline, but stays tethered to one city and a small constellation of characters."},{"axis":"Institutional Sweep","code":"Swp","value":3,"confidence":"high","justification":"HHM, the bar association, and the cartel exert constant pressure, but the rubric's own anchor pegs this at 3: the firm and cartel are pressure sources on Jimmy's and Kim's moral falls, not subjects whose self-perpetuating logic the show traces."},{"axis":"Interiority","code":"Int","value":7,"confidence":"high","justification":"The show lives inside Jimmy's self-justifying psyche and especially Kim's opaque inner conflict; the slow erosion of their consciences and Jimmy's grief over Chuck are the real text."},{"axis":"Authorial Signature","code":"Auth","value":7,"confidence":"high","justification":"A strong, recognizable hand — extreme wide-angle and POV compositions, black-and-white Gene cold opens, montage set to music, and objects shot in striking macro — more visually assertive than Breaking Bad."},{"axis":"Verisimilitude","code":"Ver","value":8,"confidence":"high","justification":"Meticulous legal procedure, the granular texture of document review and elder-law fraud, and plausible cartel logistics make the world feel researched and lived-in."},{"axis":"Density","code":"Den","value":6,"confidence":"medium","justification":"Rewards close attention to legal maneuvering, long con setups, and the dual timeline, but it unfolds methodically enough that threads remain followable without heavy tracking."},{"axis":"Register","code":"Reg","value":4,"confidence":"high","justification":"Largely restrained and naturalistic — courtroom and domestic scenes played cool — with periodic operatic flourishes like Chuck's breakdown and Lalo's menace, sitting just above grounded."}],"values":[5,5,3,7,7,8,6,4]},"Better Things":{"genres":["Comedy"],"scores":[{"axis":"Propulsion","code":"Pr ble as Black Mirror almost on sight."},{"axis":"Verisimilitude","code":"Ver","value":5,"confidence":"medium","justification":"The near-future tech is extrapolated plausibly (the memory 'grain' in 'The Entire History of You'), but the worlds are pitched as satirical thought-experiments rather than reported, lived-in texture."},{"axis":"Density","code":"Den","value":4,"confidence":"medium","justification":"Self-contained episodes resolve their own premise and largely hand the viewer the rules they need; the payoff is a twist to absorb, not a web of names and threads to track."},{"axis":"Register","code":"Reg","value":6,"confidence":"medium","justification":"Tone tends toward heightened satirical dread and gut-punch melodrama ('Shut Up and Dance,' the emotional swell of 'San Junipero'), though some episodes pull back to a cooler key."}],"values":[7,4,3,6,7,5,4,6]},"Black Sails":{"genres":["Historical"],"scores":[{"axis":"Propulsion","code":"Prop","value":8,"confidence":"medium","justification":"The serialized war for Nassau and the shifting alliances between Flint, Silver, Vane and Eleanor constantly compound — each scheme to secure the Urca gold or hold the island forces the next betrayal, so plot lines rarely idle."},{"axis":"Scope","code":"Scope","value":7,"confidence":"medium","justification":"Spans Nassau, the open seas, plantations, Charles Town and the reach of the British Empire, and layers pirates, merchants, colonial governors and enslaved people into one canvas."},{"axis":"Institutional Sweep","code":"Swp","value":5,"confidence":"medium","justification":"The founding and defense of the pirate 'civilization' of Nassau against empire is a genuine subject, but the drama lives chiefly in Flint's and Silver's personal projects rather than tracing a self-perpetuating machine."},{"axis":"Interiority","code":"Int","value":5,"confidence":"medium","justification":"Flint's hidden grief and the McGraw backstory give real inner access, but most characters like Vane and Rackham are read through action and rhetoric rather than staged from inside."},{"axis":"Authorial Signature","code":"Auth","value":5,"confidence":"medium","justification":"Handsome, sweeping prestige craft with strong ship-battle staging, but the visual grammar is conventional cinematic polish rather than a blind-recognizable auteur hand."},{"axis":"Verisimilitude","code":"Ver","value":7,"confidence":"medium","justification":"The rigging, sailing tactics, period Nassau economy and real historical figures (Blackbeard, Vane, Rackham, Bonny) feel researched, though heightened for drama at the edges."},{"axis":"Density","code":"Den","value":6,"confidence":"medium","justification":"Multiple factions, double-crosses and a sprawling cast of captains and politicians require active tracking, though the show signposts its stakes more than something like The Wire."},{"axis":"Register","code":"Reg","value":7,"confidence":"medium","justification":"Flint's thunderous monologues, swelling score and melodramatic speeches about civilization and tyranny pitch the emotional key loud and operatic."}],"values":[8,7,5,5,5,7,6,7]},"Bloodline":{"genres":["Crime","Thriller"],"scores":[{"axis":"Propulsion","code":"Prop","value":7,"confidence":"medium","justification":"The flash-forward of Danny's death and Marco's investigation creates a relentless dread, and each of John's cover-up choices compounds the family's exposure scene by scene, especially across the first season."},{"axis":"Scope","code":"Scope","value":3,"confidence":"medium","justification":"Confined largely to the Rayburn family, their Islamorada inn, and the surrounding Florida Keys; the canvas is one family and one small community rather than wide geography or social strata."},{"axis":"Institutional Sweep","code":"Swp","value":2,"confidence":"medium","justification":"John's role as a sheriff's detective is a pressure source, but the show traces a family's secrets and guilt, not the self-perpetuating logic of any law-enforcement ge ensemble across multiple cities, overlapping political and criminal threads, and many named players require active tracking with little hand-holding."},{"axis":"Register","code":"Reg","value":5,"confidence":"medium","justification":"Gangster melodrama with bursts of operatic violence and emotional flare (Jimmy's death, Gillian's arcs), but mostly played in a controlled, naturalistic period key rather than full operatic pitch."}],"values":[5,8,5,4,6,8,7,5]},"Bodyguard":{"genres":["Thriller","Crime"],"scores":[{"axis":"Propulsion","code":"Prop","value":9,"confidence":"high","justification":"The BBC thriller is built as a relentless cliffhanger machine — David Budd's discovery of the sniper, the Thornton Circus shootout, and Julia's car bomb each detonate the next crisis, making episodes feel involuntary to keep watching."},{"axis":"Scope","code":"Scope","value":3,"confidence":"medium","justification":"Confined to contemporary London and the world of Westminster security; it's a tight, present-tense story around one protection officer and the Home Secretary, not a wide geographic or temporal canvas."},{"axis":"Institutional Sweep","code":"Swp","value":4,"confidence":"medium","justification":"The Metropolitan Police, security services, and political machine exert real pressure and the conspiracy implicates multiple agencies, but the show is about Budd's personal unraveling rather than tracing any institution's self-perpetuating logic."},{"axis":"Interiority","code":"Int","value":6,"confidence":"medium","justification":"Budd's PTSD, suppressed rage, and suicidal despair are foregrounded — the suicide-vest sequence stages his inner collapse — so we are often anchored inside his fraying mind, though much is still observed externally."},{"axis":"Authorial Signature","code":"Auth","value":4,"confidence":"medium","justification":"Competent, slick mainstream thriller direction with tense set-pieces, but no distinctive recognizable visual hand — it looks like high-end BBC drama rather than an auteur's signature."},{"axis":"Verisimilitude","code":"Ver","value":5,"confidence":"medium","justification":"The close-protection tradecraft and police procedure feel reasonably researched, but the sprawling conspiracy and the implausibly survivable bomb-vest climax pull it toward heightened thriller mechanics."},{"axis":"Density","code":"Den","value":4,"confidence":"medium","justification":"The plot has many suspects and a twisting whodunit conspiracy, but it spoon-feeds reveals and keeps the central tension easy to follow without demanding the viewer hold dense threads."},{"axis":"Register","code":"Reg","value":6,"confidence":"medium","justification":"Largely played in grounded naturalism, but the swelling tension of the bomb sequences, interrogation confrontations, and melodramatic affair raise the emotional pitch above cool restraint."}],"values":[9,3,4,6,4,5,4,6]},"Borgen":{"genres":["Political"],"scores":[{"axis":"Propulsion","code":"Prop","value":6,"confidence":"medium","justification":"Episodes are largely issue-of-the-week (an immigration crisis, a defense scandal), but Birgitte's grip on power and her crumbling marriage build steadily across seasons, so consequences compound without ever feeling involuntary."},{"axis":"Scope","code":"Scope","value":5,"confidence":"medium","justification":"Confined to contemporary Danish national life but spanning multiple strata — the PM's office, coalition party rooms, the TV1 newsroom — and reaching outward in the Greenland/Arctic arc of the revival."},{"axis":"Institutional Sweep","code":"Swp","value":6,"confidence":"medium","justification":"The mechanics of coalition-building, spin-doctoring, and parliamentary horse-trading are genuinely a subject — how the machine of governing shapes and erodes people — though Birgitte and Katrine's personal arcs share the stage rather than ceding it to the system."},{"axis":"Interiority","code":"Int","value":5,"confidence":"medium","justification":"We track the personal toll on Birgitte (her divorce, her later vanity and illness) and Katrine, but the show mostly observes their behavior and choices rather than staging us inside a consciousness."},{"axis":"Authorial Signature","code":"Auth","value":4,"confidence":"medium","justification":"Clean, naturalistic Scandinavian TV craft with restrained framing and unobtrusive scoring; competent and consistent but without a loud or instantly recognizable directorial hand."},{"axis":"Verisimilitude","code":"Ver","value":8,"confidence":"high","justification":"The depiction of Danish minority-government coalition arithmetic, spin operations, and newsroom compromise feels meticulously researched and reported, down to the procedural detail of forming a cabinet."},{"axis":"Density","code":"Den","value":6,"confidence":"medium","justification":"Viewers must track numerous parties, ministers, and shifting alliances plus the press subplot, but exposition is delivered cleanly enough to follow without active homework."},{"axis":"Register","code":"Reg","value":3,"confidence":"medium","justification":"Played cool and naturalistic — quiet performances, no swelling melodrama even at moments of political collapse or personal heartbreak, with stakes pitched grounded rather than operatic."}],"values":[6,5,6,5,4,8,6,3]},"Bosch":{"genres":["Crime"],"scores":[{"axis":"Propulsion","code":"Prop","value":7,"confidence":"medium","justification":"Each season tracks a central murder case with mounting leads and complications, and Bosch's relentless 'everybody counts or nobody counts' drive keeps the investigation pushing forward, though some procedural beats and side cases idle."},{"axis":"Scope","code":"Scope","value":4,"confidence":"medium","justification":"Largely confined to Los Angeles and the LAPD, though it ranges across the city's neighborhoods, courts, and occasionally other agencies, giving a moderate civic canvas rather than a sprawling one."},{"axis":"Institutional Sweep","code":"Swp","value":5,"confidence":"medium","justification":"The LAPD's internal politics, brass careerism, IA, and the courts genuinely share the stage and exert their own logic, but the show ultimately centers on Bosch as an individual detective rather than the machine itself."},{"axis":"Interiority","code":"Int","value":4,"confidence":"medium","justification":"We get Bosch's personal history (his mother's murder, jazz, his quiet solitude) shaping his obsession, but the show mostly observes his conduct externally rather than staging us inside his consciousness."},{"axis":"Authorial Signature","code":"Auth","value":3,"confidence":"medium","justification":"Clean, professional procedural craft with moody LA night photography and a recurring jazz score, but the technique is largely workmanlike and effaced rather than a distinctive recognizable hand."},{"axis":"Verisimilitude","code":"Ver","value":7,"confidence":"medium","justification":"Drawn from Michael Connelly's reported procedure, the detective work, courtroom mechanics, and real LA locations feel researched and authentic, with credible departmental texture."},{"axis":"Density","code":"Den","value":4,"confidence":"medium","justification":"Multiple cases and political threads run at once, but the show explains itself clearly and rarely asks the viewer to track much without help."},{"axis":"Register","code":"Reg","value":3,"confidence":"medium","justification":"Played cool and naturalistic—Bosch's terse delivery, understated stakes, and restrained scoring keep the emotional pitch grounded even during violent or high-stakes turns."}],"values":[7,4,5,4,3,7,4,3]},"Breaking Bad":{"genres":["Crime","Thriller"],"scores":[{"axis":"Propulsion","code":"Prop","value":10,"confidence":"high","justification":"Each choice detonates the next crisis — Walt's first cook forces the disposal of Krazy-8, which forces Tuco, which forces Gus; the engine never idles and consequences compound relentlessly."},{"axis":"Scope","code":"Scope","value":3,"confidence":"high","justification":"Confined largely to Albuquerque and the people in Walt's blast radius — family, the DEA, and the drug trade he touches; the canvas is one man's narrowing world."},{"axis":"Institutional Sweep","code":"Swp","value":1,"confidence":"high","justification":"The cartel and DEA exist as pressure, but the show traces no self-perpetuating institutional logic — it is wholly about Walter White's transformation into Heisenberg."},{"axis":"Interiority","code":"Int","value":8,"confidence":"high","justification":"Lives inside Walt's self-justification, pride, and denial — his rationalizations ('I did it for the family') are the real text the show interrogates."},{"axis":"Authorial Signature","code":"Auth","value":6,"confidence":"high","justification":"A strong, controlled hand — POV shots from inside barrels, time-lapse cooks, color-coded costuming — without the camera ever foregrounding itself as a trick."},{"axis":"Verisimilitude","code":"Ver","value":7,"confidence":"high","justification":"Grounded in plausible chemistry and cartel procedure, though it tips into operatic heightening late (the Nazi compound, Gus's symmetrical death)."},{"axis":"Density","code":"Den","value":6,"confidence":"high","justification":"Rewards serialized attention to setups like the ricin and Lily of the Valley, but remains accessible and rarely withholds essential exposition."},{"axis":"Register","code":"Reg","value":4,"confidence":"high","justification":"Mostly grounded and naturalistic, with escalating operatic flourishes — the 'I am the one who knocks' speech and Gus's reveal pitch louder than the early restraint."}],"values":[10,3,1,8,6,7,6,4]},"Broadchurch":{"genres":["Mystery","Crime"],"scores":[{"axis":"Propulsion","code":"Prop","value":7,"confidence":"high","justification":"The whodunit engine drives hard—each episode peels back a new suspect (the newsagent, the vicar, Susan Wright) and ends on a reveal that forces the next, so the season-one mystery pulls you forward involuntarily."},{"axis":"Scope","code":"Scope","value":3,"confidence":"high","justification":"Confined almost entirely to one small Dorset coastal town and its handful of families; the canvas is deliberately claustrophobic, the whole community orbiting Danny Latimer's death."},{"axis":"Institutional Sweep","code":"Swp","value":3,"confidence":"medium","justification":"The police investigation and the intrusive press exert pressure, but the show is about a community's grief and suspicion, not the self-perpetuating logic of any institution—swap the setting and it's still the Latimers' and Millers' story."},{"axis":"Interiority","code":"Int","value":5,"confidence":"medium","justification":"It dwells closely on Beth Latimer's grief and Hardy's guilt over the Sandbrook case, but mostly stages these through observed behavior and confrontation rather than going fully inside a consciousness."},{"axis":"Authorial Signature","code":"Auth","value":6,"confidence":"medium","justification":"A recognizable hand in the sweeping cliff-top cinematography and Ólafur Arnalds's plaintive piano score, which give it a distinctive, melancholic visual and sonic identity."},{"axis":"Verisimilitude","code":"Ver","value":7,"confidence":"medium","justification":"The texture of a tight-knit seaside town under media siege and the toll on the family feels grounded and researched, with believable small-town policing rather than glamour."},{"axis":"Density","code":"Den","value":4,"confidence":"medium","justification":"A manageable cast of suspects and a single central mystery; it rewards attention to clues but holds the viewer's hand through the investigation without demanding heavy thread-tracking."},{"axis":"Register","code":"Reg","value":6,"confidence":"medium","justification":"The grief is pitched emotionally high—anguished performances and the swelling Arnalds score heighten the mourning—sitting above naturalistic restraint without reaching full operatic melodrama."}],"values":[7,3,3,5,6,7,4,6]},"Bro ium","justification":"Characters are revealed through banter and behavior at the bar rather than staged inner experience; we observe Sam's pride or Diane's pretensions externally."},{"axis":"Authorial Signature","code":"Auth","value":2,"confidence":"medium","justification":"Conventional multi-camera proscenium staging and laugh track; the craft is invisible by sitcom design rather than a recognizable auteur hand."},{"axis":"Verisimilitude","code":"Ver","value":5,"confidence":"medium","justification":"The bar feels like a believable lived-in neighborhood hangout with consistent regulars, but it's a warm comedic version rather than reported, granular realism."},{"axis":"Density","code":"Den","value":2,"confidence":"high","justification":"Self-contained episodes with clear setups and payoffs; nothing requires the viewer to track threads or names across episodes."},{"axis":"Register","code":"Reg","value":5,"confidence":"medium","justification":"Performances are pitched for broad comedy with heightened banter and recurring catchphrases, but stakes are played warmly and conversationally rather than operatically."}],"values":[3,1,1,2,2,5,2,5]},"Chernobyl":{"genres":["Drama"],"scores":[{"axis":"Propulsion","code":"Prop","value":8,"confidence":"high","justification":"The countdown structure and the cascade of lies, exposures, and physical consequences (the burning core, the trial) keep tightening; each revelation forces the next investigative step."},{"axis":"Scope","code":"Scope","value":6,"confidence":"high","justification":"Spans the plant, Pripyat, Moscow ministries, the mines, and the liquidator effort, tracing the disaster across multiple strata of Soviet society though confined to one event."},{"axis":"Institutional Sweep","code":"Swp","value":8,"confidence":"high","justification":"The real subject is the Soviet state apparatus's machinery of lies and self-protection — the bureaucracy's denial logic causes and prolongs the catastrophe, beyond any individual."},{"axis" rwards braided with present-day plotting and withheld reveals—is an instantly recognizable structural hand that defines the series' identity."},{"axis":"Verisimilitude","code":"Ver","value":5,"confidence":"medium","justification":"The corporate-malfeasance cases echo real scandals, but the parade of conspiracies, contract killings, and improbable manipulations leans toward heightened thriller mechanics over reported, granular legal texture."},{"axis":"Density","code":"Den","value":7,"confidence":"medium","justification":"Viewers must actively hold the dual timelines, decode partial flash-forward images, and track who betrayed whom across overlapping schemes, with little hand-holding between reveals."},{"axis":"Register","code":"Reg","value":6,"confidence":"medium","justification":"Glenn Close's coiled menace, the ominous scoring, and the melodramatic betrayals-and-murders pitch the show well above naturalism, though it stays cooler and more clipped than full operatic excess."}],"values":[8,4,3,5,7,5,7,6]},"Dark":{"genres":["Sci-Fi"],"scores":[{"axis":"Propulsion","code":"Prop","value":8,"confidence":"high","justification":"Each episode ends on a revelation that recontextualizes the timelines, and the bootstrap-loop structure means every discovery (who is whose parent, what caused the disappearance) tightens the next; binge-compulsion is built into the cliffhangers."},{"axis":"Scope","code":"Scope","value":8,"confidence":"high","justification":"Geographically confined to Winden, but temporally vast — 1888, 1953, 1986, 2019, 2052 and beyond, plus a parallel world — and that interlocking time-canvas is the largest of the three dimensions."},{"axis":"Institutional Sweep","code":"Swp","value":2,"confidence":"high","justification":"The nuclear plant is a plot device for the anomaly, not a system the show traces; the real subject is four interlinked families and the time-loop, not any institution's self-perpetuating logic."},{"axis":"Interiority","code":"Int","value":5,"co
