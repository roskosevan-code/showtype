enace, Lily's flat affect), yet the booming choral score and sublime slow-motion imagery push the emotional pitch toward the operatic, splitting the difference."}],"values":[4,3,3,5,8,5,5,5]},"Dexter":{"genres":["Crime"],"scores":[{"axis":"Propulsion","code":"Prop","value":7,"confidence":"high","justification":"Each season's cat-and-mouse with a season-long nemesis (the Ice Truck Killer, Trinity, etc.) plus the constant threat of Dexter's secret being exposed keeps tightening, so episodes pull into the next."},{"axis":"Scope","code":"Scope","value":3,"confidence":"high","justification":"Confined almost entirely to Miami and Dexter's small orbit — the Miami Metro homicide unit and his family — with no broad geographic, temporal, or social canvas."},{"axis":"Institutional Sweep","code":"Swp","value":2,"confidence":"high","justification":"Miami Metro PD is purely a backdrop and a source of cover for Dexter; the show never traces the department's self-perpetuating logic, focusing on one man's secret life."},{"axis":"Interiority","code":"Int","value":8,"confidence":"high","justification":"The relentless first-person voiceover stages the show inside Dexter's mind — his 'Dark Passenger,' Harry's Code, and his pretense at normal emotion are the core text."},{"axis":"Authorial Signature","code":"Auth","value":5,"confidence":"medium","justification":"The fetishistic blood-and-breakfast title sequence, sun-bleached Miami palette, and pervasive confessional narration give a recognizable hand without being formally radical."},{"axis":"Verisimilitude","code":"Ver","value":4,"confidence":"medium","justification":"Forensic blood-spatter procedure has a veneer of research, but the immaculate kill rituals and improbably long evasion of an entire homicide squad lean glamorized rather than lived-in."},{"axis":"Density","code":"Den","value":3,"confidence":"medium","justification":"The voiceover spells out Dexter's reasoning and motives, plotting is followable season to season, and little tracking is demanded of the viewer."},{"axis":"Register","code":"Reg","value":5,"confidence":"medium","justification":"The wry, macabre narration and serial-killer melodrama (especially the heightened later-season villains) pitch it above naturalism without reaching full operatic excess."}],"values":[7,3,2,8,5,4,3,5]},"Doctor Who":{"genres":["Sci-Fi"],"scores":[{"axis":"Propulsion","code":"Prop","value":5,"confidence":"medium","justification":"Largely episodic monster-of-the-week adventures that resolve within an hour, so scene-to-scene escalation is modest; the season-long arc threads (Bad Wolf, the Crack, the Hybrid) and two-part cliffhangers supply real momentum only in bursts."},{"axis":"Scope","code":"Scope","value":10,"confidence":"high","justification":"The TARDIS premise puts any planet, any century, and the whole sweep of cosmic history in play — from Victorian London to the end of the universe — making the canvas about as large as the medium allows."},{"axis":"Institutional Sweep","code":"Swp","value":3,"confidence":"medium","justification":"UNIT, Torchwood and the Time Lords of Gallifrey appear, but they function as backdrop and plot pressure rather than self-perpetuating machines the show traces; the drama is the Doctor and companions, not the institution's logic."},{"axis":"Interiority","code":"Int","value":4,"confidence":"medium","justification":"Episodes occasionally stage the Doctor's loneliness, guilt over Gallifrey, and grief at losing companions, but the dominant mode is external adventure observed from outside rather than sustained inner access."},{"axis":"Authorial Signature","code":"Auth","value":5,"confidence":"medium","justification":"Mostly conventional BBC family-sci-fi staging, though Moffat-era structural play (non-linear 'timey-wimey' plotting, the Weeping Angels conceit) gives moments of recognizable formal trickery."},{"axis":"Verisimilitude","code":"Ver","value":2,"confidence":"high","justification":"The sonic screwdriver, reversing-the-polarity technobabble, and rubber-suit aliens are knowingly fantastical; the world is mythic and whimsical rather than researched or lived-in."},{"axis":"Density","code":"Den","value":4,"confidence":"medium","justification":"Built for a broad family audience with self-contained episodes and re-explained premises, though Moffat's arc seasons asked viewers to hold paradoxes and recurring names across a series."},{"axis":"Register","code":"Reg","value":8,"confidence":"high","justification":"Heightened performances, Murray Gold's swelling orchestral score, and big melodramatic farewell speeches and universe-saving stakes are pitched loud and emotional."}],"values":[5,10,3,4,5,2,4,8]},"ER":{"genres":["Drama"],"scores":[{"axis":"Propulsion","code":"Prop","value":6,"confidence":"medium","justification":"The ER's perpetual stream of incoming trauma keeps each hour kinetic, but the structure is largely case-of-the-week with soap-style personal arcs, so scenes generate urgency more than they detonate the next consequence."},{"axis":"Scope","code":"Scope","value":4,"confidence":"medium","justification":"Almost entirely confined to County General in Chicago, though the parade of patients from every social stratum and the occasional excursion (Carter in Africa) widens the social canvas somewhat."},{"axis":"Institutional Sweep","code":"Swp","value":5,"confidence":"medium","justification":"The hospital's machinery — HMO cost-cutting, administrative politics, the County vs. private-medicine divide — is genuinely a recurring subject, but the drama keeps returning to the doctors' personal lives rather than the system's own logic."},{"axis":"Interiority","code":"Int","value":4,"confidence":"medium","justification":"It's an observational ensemble watching how staff behave under pressure; we get character backstory (Carter's addiction, Greene's illness) but the show rarely stages itself inside a single consciousness."},{"axis":"Authorial Signature","code":"Auth","value":6,"confidence":"medium","justification":"The roving steadicam long takes weaving through crowded trauma bays were a genuinely distinctive, recognizable visual signature for network drama of its era."},{"axis":"Verisimilitude","code":"Ver","value":8,"confidence":"high","justification":"Renowned for medically accurate procedures, rapid-fire authentic jargon, and consultant-vetted trauma sequences that feel reported rather than glamorized."},{"axis":"Density","code":"Den","value":6,"confidence":"medium","justification":"The unexplained medical terminology and overlapping simultaneous cases demand active attention, though as a broadcast show it still resets enough to stay accessible."},{"axis":"Register","code":"Reg","value":6,"confidence":"medium","justification":"Despite the clinical realism, it leans on swelling emotional scores and heightened life-or-death melodrama (Lucy's death, Greene's brain tumor) pitched for maximum network impact."}],"values":[6,4,5,4,6,8,6,6]},"Eastbound & Down":{"genres":["Comedy"],"scores":[{"axis":"Propulsion","code":"Prop","value":4,"confidence":"medium","justification":"Kenny's comeback schemes escalate within each season (the return to Shelby, the Mexico stint), but the show is picaresque and meandering, lingering on bits and humiliation rather than letting each scene tighten into the next."},{"axis":"Scope","code":"Scope","value":3,"confidence":"medium","justification":"Largely confined to Kenny's small-town North Carolina orbit and his brother's house, with side detours to Mexico and Myrtle Beach; the canvas stays personal and provincial."},{"axis":"Institutional Sweep","code":"Swp","value":1,"confidence":"high","justification":"The middle-school gym job and minor-league baseball are backdrops for Kenny's ego, never systems the show traces; it is entirely about one man's delusions."},{"axis":"Interiority","code":"Int","value":6,"confidence":"medium","justification":"Kenny's relentless self-mythologizing voiceover puts us inside his grandiose, self-justifying head as a constant comic device, granting real (if absurd) inner access."},{"axis":"Authorial Signature","code":"Auth","value":6,"confidence":"medium","justification":"The Jody Hill/David Gordon Green house style is recognizable — the bombastic narration, sun-bleached Southern framing, and rock-anthem swagger give it a distinct comic-auteur hand."},{"axis":"Verisimilitude","code":"Ver","value":5,"confidence":"medium","justification":"The shabby gyms, mullets, and minor-league/small-town milieu feel observed and lived-in, but everything is filtered through caricature and comic exaggeration."},{"axis":"Density","code":"Den","value":2,"confidence":"high","justification":"Plot is simple and self-evident; the comedy and Kenny's narration spell out his intentions, asking almost nothing of the viewer to track."},{"axis":"Register","code":"Reg","value":8,"confidence":"high","justification":"Kenny Powers is pitched at full operatic volume — grandiose monologues, anthem-scored hero shots, and bombastic crudeness make the emotional key loud and heightened throughout."}],"values":[4,3,1,6,6,5,2,8]},"Fallout":{"genres":["Sci-Fi"],"scores":[{"axis":"Propulsion","code":"Prop","value":7,"confidence":"medium","justification":"Three converging quests — Lucy chasing her father, Maximus rising in the Brotherhood, the Ghoul hunting the head — each episode hands off a clear next objective and the bounty-head mystery keeps escalating toward their collision."},{"axis":"Scope","code":"Scope","value":8,"confidence":"high","justification":"Spans the irradiated California wasteland, multiple vaults, the Brotherhood of Steel, the NCR ruins of Shady Sands, plus pre-war flashbacks stretching the timeline over two centuries through Cooper Howard."},{"axis":"Institutional Sweep","code":"Swp","value":5,"confidence":"medium","justification":"Vault-Tec's corporate conspiracy and the Brotherhood's quasi-feudal hierarchy are traced as self-perpetuating systems, but the show ultimately rides on Lucy, Maximus and the Ghoul's personal arcs rather than the machinery itself."},{"axis":"Interiority","code":"Int","value":3,"confidence":"medium","justification":"Largely an external adventure; we watch what characters do across the wasteland, with the Ghoul's pre-war flashbacks providing motivation but little sustained inner access."},{"axis":"Authorial Signature","code":"Auth","value":6,"confidence":"medium","justification":"A recognizable hand in the Pip-Boy/retro-50s-atomic aesthetic, faithful game-icon framing, and the deadpan splatter comedy give it a distinctive look you'd identify quickly."},{"axis":"Verisimilitude","code":"Ver","value":4,"confidence":"medium","justification":"The world is densely detailed and lore-consistent, but it's a heightened, cartoonish post-apocalypse — gore gags, jet-pack power armor and vault gimmicks — that reads as mythologized rather than reported."},{"axis":"Density","code":"Den","value":5,"confidence":"medium","justification":"Three timelines and Vault-Tec's backstory require some tracking, but the show recaps its mysteries and keeps the through-line (find the head) easy to follow."},{"axis":"Register","code":"Reg","value":6,"confidence":"medium","justification":"Pitched up with broad violence, satirical sci-fi melodrama and the Ghoul's theatrical menace, though grounded by Lucy's earnest naivety it lands above the deadpan middle."}],"values":[7,8,5,3,6,4,5,6]},"Fargo":{"genres":["Crime","Comedy"],"scores":[{"axis":"Propulsion","code":"Prop","value":7,"confidence":"medium","justification":"A single bad decision (Lester's hammer, Ed's hit-and-run cover-up) snowballs relentlessly into bodies and Malvo/Varga's predation, though tangents and fable-like digressions occasionally let the engine idle."},{"axis":"Scope","code":"Scope","value":6,"confidence":"medium","justification":"Each season fans out across Midwest towns, competing crime families and police jurisdictions, with Season 2 reaching into a Kansas City syndicate and a 1979 timeframe, but it stays regional rather than continental."},{"axis":"Institutional Sweep","code":"Swp","value":3,"confidence":"medium","justification":"Police departments and crime organizations are present as pressure, but the show is about individual morality, luck and fate (Marge-like decency vs. predators), not the self-perpetuating logic of any machine."},{"axis":"Interiority","code":"Int","value":4,"confidence":"medium","justification":"We track characters like Lester's cowardice and Lorne Malvo's nihilism through behavior and dialogue rather than staged inner consciousness; the mode is observational and parable-like."},{"axis":"Authorial Signature","code":"Auth","value":8,"confidence":"high","justification":"Unmistakable Coen-inflected hand: 'this is a true story' title cards, chapter framing, deadpan Minnesotan dialogue, symmetrical snowbound compositions and the UFO/Sisyphus flourishes mark it instantly."},{"axis":"Verisimilitude","code":"Ver","value":5,"confidence":"medium","justification":"The accents, diners and small-town textures feel observed, but the folkloric framing, biblical/cosmic intrusions and quirky heightening push it toward myth rather than reported reality."},{"axis":"Density","code":"Den","value":5,"confidence":"medium","justification":"Multiple plotlines and a sizable ensemble require some tracking, but episodes recap motivations clearly and the plotting is followable without heavy work."},{"axis":"Register","code":"Reg","value":6,"confidence":"medium","justification":"Pitched between deadpan Midwestern understatement and operatic violence, allegory and swelling fable—Malvo's menace and Varga's grotesquerie are played loud against the cool 'oh yah' restraint."}],"values":[7,6,3,4,8,5,5,6]},"Farscape":{"genres":["Sci-Fi"],"scores":[{"axis":"Propulsion","code":"Prop","value":6,"confidence":"medium","justification":"Early seasons mix monster-of-the-week standalones with strong serial arcs, but the Scorpius pursuit and Crichton's wormhole-knowledge stakes escalate and compound steadily, especially once the chase tightens in later seasons."},{"axis":"Scope","code":"Scope","value":8,"confidence":"medium","justification":"Spans a distant region of the galaxy with multiple species and powers — Peacekeepers, Scarrans, Nebari, the Uncharted Territories — and many planets and ships, a large geographic and social canvas."},{"axis":"Institutional Sweep","code":"Swp","value":3,"confidence":"medium","justification":"The Peacekeeper military and its breeding/command hierarchy exert real pressure on Aeryn and the crew, but the show is about the fugitives aboard Moya, not the self-perpetuating logic of the institution itself."},{"axis":"Interiority","code":"Int","value":7,"confidence":"medium","justification":"Crichton's psyche is the literal stage late on — the Scorpius 'Harvey' neural clone, hallucinations, and his mental disintegration are dramatized from inside his mind."},{"axis":"Authorial Signature","code":"Auth","value":7,"confidence":"medium","justification":"The Jim Henson Creature Shop puppetry (Rygel, Pilot), surreal episodes like 'Crackers Don't Matter,' and comic-book visual flourishes make it instantly recognizable."},{"axis":"Verisimilitude","code":"Ver","value":3,"confidence":"medium","justification":"A fantastical universe of puppet aliens, living ships, and pop-culture-quipping wormhole physics — vivid and imaginative but mythologized rather than researched or lived-in."},{"axis":"Density","code":"Den","value":5,"confidence":"medium","justification":"Requires tracking a roster of species, alliances, and the evolving wormhole arc, but episodes generally orient the viewer and the plotting stays followable."},{"axis":"Register","code":"Reg","value":8,"confidence":"high","justification":"Performances and tone are loud and heightened — Crichton's manic breakdowns, broad comedy, melodramatic romance with Aeryn, and operatic villainy from Scorpius all pitched maximally."}],"values":[6,8,3,7,7,3,5,8]},"Fauda":{"genres":["Thriller"],"scores":[{"axis":"Propulsion","code":"Prop","value":9,"confidence":"high","justification":"Each undercover raid produces a fresh vendetta or botched target that forces the next operation; Doron's pursuit of Abu Ahmad and later targets is a self-feeding cycle of retaliation that never idles."},{"axis":"Scope","code":"Scope","value":5,"confidence":"medium","justification":"Geographically tight to the West Bank, Israel, and excursions to Gaza/Lebanon, but it canvasses two societies at once — the Israeli unit and Palestinian families/militant cells — giving real social breadth without continental scale."},{"axis":"Institutional Sweep","code":"Swp","value":4,"confidence":"medium","justification":"The mista'arvim unit and Shin Bet exert constant pressure, but the show is about Doron's personal obsessions and the human cost on both sides, not the self-perpetuating logic of the security apparatus itself."},{"axis":"Interiority","code":"Int","value":4,"confidence":"medium","justification":"It humanizes fighters on both sides and lingers on Doron's guilt and Palestinian characters' motives, but the mode is largely external — we watch behavior and decisions more than inhabit a consciousness."},{"axis":"Authorial Signature","code":"Auth","value":4,"confidence":"medium","justification":"Handheld, kinetic naturalism with documentary-style coverage; competent and intense but not a blind-recognizable auteur stamp."},{"axis":"Verisimilitude","code":"Ver","value":8,"confidence":"high","justification":"Created by a former undercover operative and a journalist, with authentic Arabic and Hebrew dialogue and tradecraft, giving the raids and embeds a reported, lived-in feel."},{"axis":"Density","code":"Den","value":6,"confidence":"medium","justification":"Viewers must track two languages, multiple cells, and shifting allegiances across the unit and Palestinian families, but the plotting stays followable without heavy work."},{"axis":"Register","code":"Reg","value":5,"confidence":"medium","justification":"Largely grounded and tense, but the recurring family melodrama, betrayals, and emotionally pitched confrontations push it above flat naturalism into moderate heightening."}],"values":[9,5,4,4,4,8,6,5]},"Firefly":{"genres":["Sci-Fi"],"scores":[{"axis":"Propulsion","code":"Prop","value":5,"confidence":"medium","justification":"Largely episodic with standalone jobs (the train heist, the hospital con), so momentum is moderate; the Reaver/Alliance arc and River mystery pull forward but most episodes are self-contained adventures rather than escalating chains."},{"axis":"Scope","code":"Scope","value":7,"confidence":"medium","justification":"A terraformed multi-planet 'verse spanning Core worlds, frontier moons, and Reaver space, with the Alliance/Independent divide layered on; geographically and socially broad despite confinement to one ship."},{"axis":"Institutional Sweep","code":"Swp","value":3,"confidence":"medium","justification":"The Alliance and the Blue Sun corporation exert pressure as looming powers, but the show traces the crew's loyalties and survival, not the machinery of those systems; swap the Alliance for any oppressive empire and it's the same story."},{"axis":"Interiority","code":"Int","value":4,"confidence":"medium","justification":"Some access to Mal's bitterness over Serenity Valley and River's fractured mind, but the mode is mostly external ensemble banter and action rather than staging the story inside a consciousness."},{"axis":"Authorial Signature","code":"Auth","value":6,"confidence":"medium","justification":"Whedon's voice is recognizable — the Western-meets-space mashup, Mandarin cursing, overlapping quippy dialogue, and handheld zoom-in space photography give it a distinct hand."},{"axis":"Verisimilitude","code":"Ver","value":5,"confidence":"medium","justification":"The lived-in, rusty ship, frontier dustiness, and no-sound-in-space realism feel grounded, but the cowboy-pastiche premise and broad genre worldbuilding keep it from feeling researched or reported."},{"axis":"Density","code":"Den","value":4,"confidence":"medium","justification":"Episodes are mostly self-contained and accessible; the River/Blue Sun threads ask some tracking but exposition is generally clear and there's little demand to hold a sprawling roster of names."},{"axis":"Register","code":"Reg","value":6,"confidence":"medium","justification":"Tonally heightened with comedic banter, swelling folk-Western score, and melodramatic emotional beats (Wash and Zoe, Mal's defiant speeches), pitched louder than naturalism but not full opera."}],"values":[5,7,3,4,6,5,4,6]},"Fleabag":{"genres":["Comedy"],"scores":[{"axis":"Propulsion","code":"Prop","value":5,"confidence":"medium","justification":"The first season builds slowly around the slow reveal of Boo's death and the cafe's collapse, while the second is organized as a tightening romance with the Priest; it pulls forward emotionally but not through plot-detonation."},{"axis":"Scope","code":"Scope","value":2,"confidence":"high","justification":"Confined to one woman's London life — the failing cafe, her family's dinners, and a few flats and a confessional; no geographic, temporal, or social sprawl."},{"axis":"Institutional Sweep","code":"Swp","value":1,"confidence":"high","justification":"There is no institution as subject; even the Catholic Church appears only through one priest as a personal object of desire, not as a machine the show traces."},{"axis":"Interiority","code":"Int","value":9,"confidence":"high","justification":"The fourth-wall asides put us continuously inside Fleabag's running commentary, guilt, and self-deception; the Priest noticing her break to camera makes interiority literally the show's central mechanism."},{"axis":"Authorial Signature","code":"Auth","value":8,"confidence":"high","justification":"The direct-address conceit, conspiratorial glances to camera, and tightly controlled comic timing make Waller-Bridge's hand instantly recognizable blind."},{"axis":"Verisimilitude","code":"Ver","value":7,"confidence":"medium","justification":"The awkward family dinners, the guinea-pig-themed cafe, and the texture of grief and bad sex feel observed and lived-in rather than glamorized, despite the heightened wit."},{"axis":"Density","code":"Den","value":4,"confidence":"medium","justification":"Largely accessible and self-explaining, though it withholds the truth of Boo's death and trusts the viewer to read subtext beneath the jokes."},{"axis":"Register","code":"Reg","value":5,"confidence":"medium","justification":"Tonally it swings between deadpan naturalistic comedy and genuinely heightened emotional confession — the kneeling \"love is awful\" speech and the bus-stop ending push the pitch up without tipping into melodrama."}],"values":[5,2,1,9,8,7,4,5]},"Forbrydelsen (The Killing)":{"genres":["Crime"],"scores":[{"axis":"Propulsion","code":"Prop","value":6,"confidence":"medium","justification":"The one-day-per-episode structure and the interlocking of Lund's investigation with the Birk Larsen family's grief and the mayoral campaign keep tightening, but the relentless red herrings and reopened leads deliberately slow the line rather than detonate it."},{"axis":"Scope","code":"Scope","value":4,"confidence":"medium","justification":"Confined to Copenhagen over a single ~20-day investigation, but it spreads socially across three worlds: the police, a working-class grieving family, and city-hall electoral politics."},{"axis":"Institutional Sweep","code":"Swp","value":4,"confidence":"medium","justification":"Police bureaucracy and the machinery of a mayoral campaign exert real pressure (leaks, cover-ups, careerism), but the show is about Lund's obsession and the Birk Larsens' grief, not the self-perpetuating logic of the institutions themselves."},{"axis":"Interiority","code":"Int","value":4,"confidence":"medium","justification":"Sarah Lund is famously opaque — we read her through her fixated stare and behavior rather than inner access — though the family's grief is staged with real emotional depth."},{"axis":"Authorial Signature","code":"Auth","value":5,"confidence":"medium","justification":"A quietly distinctive Nordic-noir hand: desaturated rain-soaked Copenhagen, the iconic Faroese sweater, long muted takes — recognizable but never showy or formally tricky."},{"axis":"Verisimilitude","code":"Ver","value":8,"confidence":"medium","justification":"The procedural grind, the plausible texture of municipal politics, and the unglamorous, drawn-out depiction of a family's grief all feel researched and lived-in."},{"axis":"Density","code":"Den","value":7,"confidence":"medium","justification":"Across 20 episodes it demands tracking a sprawl of suspects, alibis, and political figures with minimal recap, and the constant false leads require active holding of detail."},{"axis":"Register","code":"Reg","value":3,"confidence":"medium","justification":"Tonally muted and melancholic — flat naturalistic performances, sparse score, and Lund's affectless intensity keep the pitch cool despite the murder at its center."}],"values":[6,4,4,4,5,8,7,3]},"Foundation":{"genres":["Sci-Fi"],"scores":[{"axis":"Propulsion","code":"Prop","value":5,"confidence":"medium","justification":"The split timelines (Cleon dynasty on Trantor, Gaal/Salvor across the Outer Reach) and centuries-long jumps create grand movement but frequently idle on prophecy and tableau rather than letting each scene tighten the next; momentum is uneven."},{"axis":"Scope","code":"Scope","value":10,"confidence":"high","justification":"A galaxy-spanning Empire across multiple worlds (Trantor, Terminus, Synnax) and centuries of cryo-jumps and clone successions — temporally and geographically maximal."},{"axis":"Institutional Sweep","code":"Swp","value":6,"confidence":"medium","justification":"The genetic dynasty of Cleon clones and psychohistory's modeling of civilizational collapse give the Empire genuine self-perpetuating logic as a subject, though the show keeps pulling focus to individual figures like Gaal, Salvor, and Demerzel."},{"axis":"Interiority","code":"Int","value":4,"confidence":"medium","justification":"Gaal's voiceover and Demerzel's tortured loyalty offer some inner access, but the mode is largely external spectacle of empire and prophecy."},{"axis":"Authorial Signature","code":"Auth","value":7,"confidence":"medium","justification":"A lavish, distinctive visual hand — the throne-room symmetry, the Cleon aging triptych, vast CGI vistas — makes it recognizable, though it leans on prestige-sci-fi conventions."},{"axis":"Verisimilitude","code":"Ver","value":4,"confidence":"medium","justification":"The far-future world is mythologized and grand rather than reported or lived-in; psychohistory and clone-emperor mysticism prioritize sweep over granular plausibility."},{"axis":"Density","code":"Den","value":7,"confidence":"medium","justification":"Multiple timelines, time-skips of decades, and a sprawling roster (three concurrent Cleons, the Vault, Foundation factions) demand the viewer actively track threads."},{"axis":"Register","code":"Reg","value":7,"confidence":"medium","justification":"Pitched operatic — sweeping orchestral score, portentous prophecy, and grandiose imperial melodrama play emotions and stakes loud rather than cool."}],"values":[5,10,6,4,7,4,7,7]},"Frasier":{"genres":["Comedy"],"scores":[{"axis":"Propulsion","code":"Prop","value":3,"confidence":"high","justification":"As a sitcom built on self-contained episodes (Frasier's radio crises, Niles's pining for Daphne), each installment resets rather than detonating the next; momentum comes only from slow-burn arcs like the Daphne romance."},{"axis":"Scope","code":"Scope","value":2,"confidence":"high","justification":"Confined almost entirely to Frasier's apartment, the radio station, and Cafe Nervosa in Seattle, with a small recurring cast and present-day timeframe."},{"axis":"Institutional Sweep","code":"Swp","value":1,"confidence":"high","justification":"The KACL radio station is mere backdrop for character comedy; the show traces no self-perpetuating institutional logic — swap the station for any workplace and it's the same story."},{"axis":"Interiority","code":"Int","value":4,"confidence":"medium","justification":"Frasier's pomposity and insecurity are constantly verbalized and the radio-callers externalize psychology, but we observe his neuroses through behavior and dialogue rather than being staged inside his mind."},{"axis":"Authorial Signature","code":"Auth","value":4,"confidence":"medium","justification":"The chapter-title intertitles and the deliberately theatrical, farce-structured episodes give a recognizable hand, but the multi-cam staging is otherwise a conventional sitcom frame."},{"axis":"Verisimilitude","code":"Ver","value":4,"confidence":"medium","justification":"The psychiatry references, opera, and fine-wine snobbery are detailed and plausible, but the sound-stage apartment and tidy farce mechanics keep it from feeling reported or lived-in."},{"axis":"Density","code":"Den","value":3,"confidence":"high","justification":"Jokes reward verbal attention, but episodes are self-contained with clear setups and payoffs and demand no tracking of threads or names across the series."},{"axis":"Register","code":"Reg","value":6,"confidence":"medium","justification":"The high-comedy farce — slamming doors, mistaken identities, Frasier and Niles's theatrically overwrought exasperation — pitches performances broad and heightened, though it stays grounded in a domestic key rather than going fully operatic."}],"values":[3,2,1,4,4,4,3,6]},"Friday Night Lights":{"genres":["Drama"],"scores":[{"axis":"Propulsion","code":"Prop","value":5,"confidence":"medium","justification":"The weekly game gives a soft pulse, but the show mostly idles in relationship beats and small-town life — episodes accrue more than they detonate, with stretches like Landry/Tyra subplots that don't compound."},{"axis":"Scope","code":"Scope","value":4,"confidence":"medium","justification":"Confined to Dillon, Texas, but socially it reaches across the booster club, the school, the various families, and the East/West Dillon class divide — a town-sized canvas rather than a single household."},{"axis":"Institutional Sweep","code":"Swp","value":4,"confidence":"medium","justification":"The Panthers program and the town's economic and political investment in it exert constant pressure (booster politics, the firing of Coach Taylor, the redistricting), but the real subject is the Taylors' marriage and the kids' lives, not the machine's own logic."},{"axis":"Interiority","code":"Int","value":5,"confidence":"medium","justification":"It gets emotionally intimate with Coach and Tami Taylor and with players like Saracen and Riggins, but the mode is observed behavior and naturalistic conversation rather than being staged inside any consciousness."},{"axis":"Authorial Signature","code":"Auth","value":6,"confidence":"medium","justification":"Peter Berg's restless handheld, snap-zoom, available-light documentary look and the improvisatory acting give it an instantly recognizable verite hand, quiet but consistent."},{"axis":"Verisimilitude","code":"Ver","value":9,"confidence":"high","justification":"The improvised dialogue, real Texas locations, and granular feel of Friday-night ritual, locker rooms, and small-town economic strain read as genuinely reported and lived-in."},{"axis":"Density","code":"Den","value":3,"confidence":"medium","justification":"A network drama built for accessibility — self-contained emotional arcs, clear stakes, and little to actively track from week to week."},{"axis":"Register","code":"Reg","value":5,"confidence":"medium","justification":"Largely naturalistic and understated, but the Explosions in the Sky score and the inspirational locker-room speeches ('Clear eyes, full hearts') push toward earnest, heightened emotional peaks."}],"values":[5,4,4,5,6,9,3,5]},"Fringe":{"genres":["Sci-Fi","Mystery"],"scores":[{"axis":"Propulsion","code":"Prop","value":6,"confidence":"medium","justification":"Early seasons lean on self-contained monster-of-the-week cases that don't always compound, but the parallel-universe mythology and the Peter-erasure arc build genuine scene-to-scene escalation in later seasons."},{"axis":"Scope","code":"Scope","value":7,"confidence":"medium","justification":"The canvas spans two parallel universes (with distinct color-graded 'over there' Bishop Dynamic world), alternate timelines, and a future-Observer-occupied Earth in season 5."},{"axis":"Institutional Sweep","code":"Swp","value":3,"confidence":"medium","justification":"Fringe Division, the FBI, and Massive Dynamic provide a backdrop, but the show's real subject is the Bishop family and Olivia, not the self-perpetuating logic of any machine."},{"axis":"Interiority","code":"Int","value":5,"confidence":"medium","justification":"Walter's fractured, guilt-ridden mind and his lost memories are recurrent subjects, and Olivia's cortexiphan-altered perception gets internal staging, though much remains externally observed."},{"axis":"Authorial Signature","code":"Auth","value":6,"confidence":"medium","justification":"Distinctive recurring devices — the floating 3D location titles, the glyph codes between act breaks, and the saturated red/blue palette separating the two universes — make it recognizable on sight."},{"axis":"Verisimilitude","code":"Ver","value":3,"confidence":"medium","justification":"The 'fringe science' (reanimation, shapeshifters, universe-crossing) is frankly pseudo-scientific and Walter's lab improvisations are fanciful rather than researched and lived-in."},{"axis":"Density","code":"Den","value":5,"confidence":"medium","justification":"There's a mythology of cortexiphan, Observers, and First People to track, but the procedural case-of-the-week structure and exposition-heavy briefings keep it accessible."},{"axis":"Register","code":"Reg","value":5,"confidence":"medium","justification":"Walter's tearful pathos and the swelling emotional stakes of the Peter sacrifice push toward heightened, but the procedural FBI investigation framing keeps much of it played fairly straight."}],"values":[6,7,3,5,6,3,5,5]},"Game of Thrones":{"genres":["Fantasy"],"scores":[{"axis":"Propulsion","code":"Prop","value":8,"confidence":"high","justification":"Cliffhanger deaths (Ned's execution, the Red Wedding) and converging plotlines keep tightening the situation, with most episodes ending on a hook that forces the next."},{"axis":"Scope","code":"Scope","value":10,"confidence":"high","justification":"Continents from Westeros to Essos, a multi-year sweep, and every social stratum from kings and small council to peasants, Wildlings, and the Night's Watch."},{"axis":"Institutional Sweep","code":"Swp","value":5,"confidence":"medium","justification":"The Iron Throne, the Faith, the Night's Watch and great houses exert real systemic pressure, but the drama is fundamentally about specific families and their power struggles rather than the machinery's self-perpetuating logic."},{"axis":"Interiority","code":"Int","value":4,"confidence":"medium","justification":"We get some access to Tyrion's wit, Jon's doubts, and Dany's resolve, but the mode is largely external — watching maneuvering and betrayal rather than living inside a consciousness."},{"axis":"Authorial Signature","code":"Auth","value":6,"confidence":"medium","justification":"A confident, lavish hand — the Battle of the Bastards staging, the title-sequence map, and set-piece spectacle — though it works within prestige-fantasy convention rather than radical formal invention."},{"axis":"Verisimilitude","code":"Ver","value":5,"confidence":"medium","justification":"Politics and court intrigue feel grounded and the medieval texture is detailed, but dragons, magic, and increasingly convenient late-season plotting pull it toward the mythologized."},{"axis":"Density","code":"Den","value":7,"confidence":"high","justification":"A huge cast of houses, names, and shifting allegiances across continents must be actively tracked, with little hand-holding once the early seasons establish the board."},{"axis":"Register","code":"Reg","value":7,"confidence":"medium","justification":"Heightened and operatic — swelling Ramin Djawadi score, grand throne-room confrontations, and melodramatic deaths — though grounded in enough political realism to avoid pure camp."}],"values":[8,10,5,4,6,5,7,7]},"Generation Kill":{"genres":["War"],"scores":[{"axis":"Propulsion","code":"Prop","value":4,"confidence":"medium","justification":"The advance toward Baghdad gives a geographic forward pull, but the show deliberately stalls in hurry-up-and-wait, bungled orders, and idling Humvees rather than escalating consequence scene-to-scene."},{"axis":"Scope","code":"Scope","value":5,"confidence":"medium","justification":"Geographically it traverses Iraq from the Kuwait border to Baghdad, but it stays tightly within First Recon Marines, so the canvas is a single invasion through one unit's eyes rather than every stratum."},{"axis":"Institutional Sweep","code":"Swp","value":7,"confidence":"medium","justification":"The real subject is the Marine Corps machine itself — its broken chain of command, ROE absurdities, careerist officers like Encino Man and Captain America, and how the institution's logic grinds down competent men regardless of individuals."},{"axis":"Interiority","code":"Int","value":2,"confidence":"high","justification":"Almost purely observational; we watch banter and behavior in the Humvees and rarely enter anyone's head, with even Wright's reporter-surrogate perspective kept external."},{"axis":"Authorial Signature","code":"Auth","value":4,"confidence":"medium","justification":"The Simon/Burns hand shows in dense overlapping dialogue and refusal of conventional war-movie framing, but the camera stays handheld and unshowy, embedded-documentary in feel."},{"axis":" ck overlapping dialogue dense with pop-culture references is instantly recognizable, though the camera work and staging are conventional."},{"axis":"Verisimilitude","code":"Ver","value":3,"confidence":"medium","justification":"Stars Hollow is a cozy, idealized small-town fantasy where everyone trades witty banter and no one struggles materially; the texture is charming but unreal."},{"axis":"Density","code":"Den","value":4,"confidence":"medium","justification":"The avalanche of cultural references and machine-gun dialogue demands fast listening, but the plotting is gentle, recapped, and easy to follow week to week."},{"axis":"Register","code":"Reg","value":4,"confidence":"medium","justification":"Mostly warm comedic naturalism, occasionally rising to heightened melodrama in mother-daughter confrontations and Emily-Lorelai blowups, but generally played mid-pitch."}],"values":[3,2,2,4,5,3,4,4]},"Giri/Haji":{"genres":["Crime"],"scores":[{"axis":"Propulsion","code":"Prop","value":6,"confidence":"medium","justification":"Kenzo's hunt for his assassin brother Yuto and the looming yakuza war between the Fukuhara and rival clans drives the plot forward, but the show frequently detours into mood and character study, so the engine pulses rather than relentlessly tightens."},{"axis":"Scope","code":"Scope","value":6,"confidence":"medium","justification":"The story straddles Tokyo and London with two crime families, the Met police, and migrant criminal underworlds, giving it real geographic and social spread without reaching continental or epochal scale."},{"axis":"Institutional Sweep","code":"Swp","value":3,"confidence":"medium","justification":"The yakuza hierarchy and London policing are present as pressure sources, but the real subject is the Mori family's bonds and the title's duty/shame conflict, not the self-perpetuating logic of any machine."},{"axis":"Interiority","code":"Int","value":6,"confidence":"medium","justification":"The show stages the inner lives of Kenzo, Yuto, the suicidal Rodney, and grieving Sarah through flashbacks and reflective beats, going substantially inside its characters' guilt and longing rather than just observing behavior."},{"axis":"Authorial Signature","code":"Auth","value":8,"confidence":"high","justification":"The split-screen panels, anime/manga interludes, genre-shifting structure, and the climactic interpretive-dance sequence make for an unmistakably bold, recognizable directorial hand."},{"axis":"Verisimilitude","code":"Ver","value":5,"confidence":"low","justification":"The bilingual settings and family textures feel observed, but the yakuza melodrama and stylized flourishes pull it away from a fully reported, lived-in authenticity."},{"axis":"Density","code":"Den","value":6,"confidence":"medium","justification":"Two languages, parallel Tokyo/London timelines, and an interlocking web of family secrets and criminal alliances ask the viewer to actively track threads, though it remains followable."},{"axis":"Register","code":"Reg","value":6,"confidence":"medium","justification":"The emotional pitch runs heightened—operatic confrontations, swelling melodrama, and the surreal dance finale—while still cooling into naturalistic, deadpan exchanges, placing it in the upper-middle."}],"values":[6,6,3,6,8,5,6,6]},"Girls":{"genres":["Comedy"],"scores":[{"axis":"Propulsion","code":"Prop","value":3,"confidence":"high","justification":"Episodes drift through Hannah's stalled writing career and the friends' on-off relationships without compounding stakes; many installments are self-contained vignettes (e.g. the bottle episode at the brownstone) rather than escalations."},{"axis":"Scope","code":"Scope","value":2,"confidence":"high","justification":"Confined to a small circle of four friends in a few Brooklyn and Manhattan neighborhoods over a young-adult slice of life; no broad geographic, temporal, or social canvas."},{"axis":"Institutional Sweep","code":"Swp","value":1,"confidence":"high","justification":"There is no institution as subject; even Hannah's brushes with publishing, the Iowa MFA, or teaching are personal experiences, not a machine the show traces."},{"axis":"Interiority","code":"Int","value":7,"confidence":"medium","justification":"The show stages Hannah's self-absorbed inner narration, anxieties, and self-justifications closely, often making her subjective neuroses the text rather than just observing behavior."},{"axis":"Authorial Signature","code":"Auth","value":6,"confidence":"medium","justification":"Lena Dunham's voice is distinct—naturalistic awkward staging, unflattering nudity used pointedly, and a recognizable cringe-comedy rhythm—without being formally showy."},{"axis":"Verisimilitude","code":"Ver","value":8,"confidence":"high","justification":"The precarious gig jobs, cramped apartments, fumbling sex, and entitled-millennial dialogue feel observed and lived-in to an uncomfortable degree."},{"axis":"Density","code":"Den","value":3,"confidence":"medium","justification":"Easy to follow with a tiny cast and episodic structure; it asks little tracking of the viewer beyond ongoing relationships."},{"axis":"Register","code":"Reg","value":3,"confidence":"medium","justification":"Tone is deadpan, awkward, and naturalistic—mortifying social moments played dry rather than with swelling music or melodrama, despite occasional emotional flare-ups."}],"values":[3,2,1,7,6,8,3,3]},"Gomorrah":{"genres":["Crime"],"scores":[{"axis":"Propulsion","code":"Prop","value":8,"confidence":"high","justification":"The clan power struggles compound relentlessly — every betrayal between Ciro, Genny and Don Pietro forces the next reprisal, so alliances and killings escalate without idling."},{"axis":"Scope","code":"Scope","value":6,"confidence":"medium","justification":"Anchored in Naples' Secondigliano and Scampia clans but expands across drug routes to Spain, Germany and Honduras, covering the strata of the Camorra's trafficking world."},{"axis":"Institutional Sweep","code":"Swp", :6,"confidence":"medium","justification":"Season 1's race to clone the IBM PC drives hard, but the show repeatedly dissolves its companies (Cardiff, Mutiny, Comet) and resets, so momentum comes in bursts rather than one continuously tightening engine."},{"axis":"Scope","code":"Scope","value":6,"confidence":"medium","justification":"Spans roughly a decade from the 1983 PC-clone era through online communities and the early web, moving from the Texas 'Silicon Prairie' to California, giving real temporal and modest geographic breadth."},{"axis":"Institutional Sweep","code":"Swp","value":4,"confidence":"medium","justification":"The personal-computing and early-internet industries supply constant pressure and shape the ventures, but the show's true subject is the four leads' partnerships and rivalries rather than any self-perpetuating machine; swap the industry and Joe, Cameron, Gordon and Donna's relationships remain the story."},{"axis":"Interiority","code":"Int","value":6,"confidence":"medium","justification":"The drama lives in Joe's reinventions, Cameron's restlessness and Donna's compromises, with sustained access to their ambitions and grief, though it observes them dramatically rather than staging the camera inside a single consciousness."},{"axis":"Authorial Signature","code":"Auth","value":5,"confidence":"medium","justification":"A confident, period-precise look and a propulsive synth-driven soundtrack give it a recognizable texture, but it avoids structural tricks or showy framing and stays within prestige-drama conventions."},{"axis":"Verisimilitude","code":"Ver","value":7,"confidence":"medium","justification":"The hardware reverse-engineering, BIOS-cloning legal worry, and the texture of bootstrapping startups feel researched and credible to the era's tech culture."},{"axis":"Density","code":"Den","value":5,"confidence":"medium","justification":"It expects you to track shifting companies and tech concepts across time jumps, but it explains its business and emotional stakes clearly enough that little active tracking is required."},{"axis":"Register","code":"Reg","value":5,"confidence":"medium","justification":"Mostly grounded performances, but the relationship blow-ups, Joe's grand visionary speeches, and emotionally pitched crescendos push it past flat naturalism into moderately heightened territory."}],"values":[6,6,4,6,5,7,5,5]},"Hannibal":{"genres":["Horror","Crime"],"scores":[{"axis":"Propulsion","code":"Prop","value":6,"confidence":"medium","justification":"The cat-and-mouse between Will and Hannibal escalates with real consequence, but the show often pauses for dreamlike rumination and tableau, slowing scene-to-scene drive in favor of mood."},{"axis":"Scope","code":"Scope","value":3,"confidence":"medium","justification":"Confined largely to the FBI/Hannibal orbit in and around Baltimore; even the European-set later episodes stay intimate, centered on a small circle of obsessed individuals."},{"axis":"Institutional Sweep","code":"Swp","value":3,"confidence":"medium","justification":"The FBI and Jack Crawford's behavioral unit exert pressure, but the show is about the psychological entanglement of Will and Hannibal, not how the bureau works as a machine."},{"axis":"Interiority","code":"Int","value":9,"confidence":"high","justification":"The show lives inside Will Graham's empathy-driven reconstructions and hallucinations (the stag, the crime-scene reenactments), staging his disintegrating mind as the primary text."},{"axis":"Authorial Signature","code":"Auth","value":9,"confidence":"high","justification":"Bryan Fuller's hand is unmistakable: surreal slow-motion blood, baroque corpse-tableaux, fractal imagery and operatic plating make it recognizable in a single frame."},{"axis":"Verisimilitude","code":"Ver","value":3,"confidence":"medium","justification":"The forensics, gourmet murders, and elaborate body-art killings are aestheticized fantasy rather than researched procedure; the world is mythologized, not lived-in stic life feel reported and lived-in, with no glamorizing of crime or grief."},{"axis":"Density","code":"Den","value":6,"confidence":"medium","justification":"Multiple threads—missing persons, family fallout, local crime—run in parallel and require attention, though the storytelling remains clear and followable."},{"axis":"Register","code":"Reg","value":2,"confidence":"high","justification":"Despite life-and-death stakes and brutal violence, performances and tone stay flat and naturalistic—Catherine's emotion is held tight rather than pitched operatically."}],"values":[8,2,4,7,4,9,6,2]},"Hellbound":{"genres":["Horror"],"scores":[{"axis":"Propulsion","code":"Prop","value":6,"confidence":"medium","justification":"The decree-and-countdown structure (a person is told the hour of their damnation, then the monsters arrive) builds genuine pull, but the mid-series time jump and shift to a new set of characters resets momentum rather than escalating it cleanly."},{"axis":"Scope","code":"Scope","value":6,"confidence":"medium","justification":"Geographically confined to Seoul, but socially broad: it tracks the New Truth religious movement, the Arrowhead vigilantes, police, media, and ordinary families all reacting to the supernatural phenomenon across a society."},{"axis":"Institutional Sweep","code":"Swp","value":6,"confidence":"medium","justification":"The New Truth cult's growth into a self-justifying doctrinal machine — and the parasitic Arrowhead enforcers it spawns — is genuinely a subject, tracing how a religious institution manufactures and perpetuates fear independent of any one leader."},{"axis":"Interiority","code":"Int","value":3,"confidence":"medium","justification":"The show observes Jung Jin-soo's chilling conviction and the detective's grief largely from outside; it watches behavior and ideology rather than staging us inside any character's consciousness."},{"axis":"Authorial Signature","code":"Auth","value":6,"confidence":"medium","justification":"Yeon Sang-ho -perpetuating machine, though the ensemble's personal lives remain co-equal subjects."},{"axis":"Interiority","code":"Int","value":4,"confidence":"medium","justification":"It largely observes behavior across a sprawling cast—Belker undercover, Renko and Hill on patrol—rather than staging events inside any one consciousness, with only modest access to Furillo's inner life."},{"axis":"Authorial Signature","code":"Auth","value":6,"confidence":"medium","justification":"Bochco and Kozoll's vérité handheld camera, overlapping crosstalk and crowded frames were a distinctive, recognizable formal break from prior cop shows, a strong if not flamboyant hand."},{"axis":"Verisimilitude","code":"Ver","value":8,"confidence":"medium","justification":"The chaotic roll-call room, overlapping radio chatter, worn station house and morally muddy outcomes feel reported and lived-in, a deliberate move away from glamorized police drama."},{"axis":"Density","code":"Den","value":6,"confidence":"medium","justification":"Multiple simultaneous plot threads and a large recurring ensemble with overlapping dialogue ask the viewer to track a lot, though network conventions still provide some orientation per episode."},{"axis":"Register","code":"Reg","value":4,"confidence":"medium","justification":"Mostly grounded and naturalistic, but it leans into tragicomic flourishes and warm/sentimental beats (Esterhaus's 'be careful out there,' Belker's antics) that lift it off a fully flat pitch."}],"values":[5,5,6,4,6,8,6,4]},"His Dark Materials":{"genres":["Fantasy"],"scores":[{"axis":"Propulsion","code":"Prop","value":5,"confidence":"medium","justification":"The quest for Lyra's father and the alethiometer drives the plot, but the first season in particular idles—long stretches of travel and setup that don't tightly compound scene-to-scene, only quickening once the multiverse crossings begin."},{"axis":"Scope","code":"Scope","value":8,"confidence":"high","justification":"The story spans parallel worlds—Lyra's steampunk Oxford, our own world, Cittàgazze—plus the Magisterium's reach, the witch clans, and the armored bears of Svalbard, a genuinely multi-world canvas."},{"axis":"Institutional Sweep","code":"Swp","value":4,"confidence":"medium","justification":"The Magisterium is a powerful theocratic institution exerting constant pressure, but it functions as antagonist and looming threat rather than a self-perpetuating machine the show dissects; the drama remains Lyra's and Will's journey."},{"axis":"Interiority","code":"Int","value":3,"confidence":"medium","justification":"The show observes its characters externally through action and dialogue; even the daemon device externalizes the soul into a visible companion rather than staging us inside anyone's consciousness."},{"axis":"Authorial Signature","code":"Auth","value":4,"confidence":"medium","justification":"Handsomely mounted prestige-fantasy adaptation with strong VFX daemons and production design, but the directorial hand is largely conventional and not blind-recognizable."},{"axis":"Verisimilitude","code":"Ver","value":5,"confidence":"medium","justification":"The retro-industrial Oxford and Magisterium architecture feel detailed and consistent, but the world is invented fantasy with daemons and Dust rather than researched, reported texture."},{"axis":"Density","code":"Den","value":5,"confidence":"medium","justification":"Viewers must track Dust, daemons, the alethiometer, multiple worlds and factions, yet the adaptation leans on exposition to explain its cosmology rather than withholding it."},{"axis":"Register","code":"Reg","value":6,"confidence":"medium","justification":"An earnest epic pitch with swelling orchestral score and high-stakes melodrama around prophecy and parental betrayal, heightened above naturalism but not full operatic excess."}],"values":[5,8,4,3,4,5,5,6]},"Homeland":{"genres":["Thriller"],"scores":[{"axis":"Propulsion","code":"Prop","value":8,"confidence":"high","justification":"Carrie's manic pursuit of Brody and later threats drives relentless episode-to-episode cliffhangers; the ticking-clock paranoia and reversals (is Brody turned or not) compel continuous viewing."},{"axis":"Scope","code":"Scope","value":7,"confidence":"medium","justification":"Ranges across Washington, Beirut, Islamabad, Berlin and warzones, touching CIA, Congress, foreign intelligence services and terror networks, though it always orbits back to a small cluster of agents."},{"axis":"Institutional Sweep","code":"Swp","value":5,"confidence":"medium","justification":"The CIA's bureaucracy, drone-war politics and surveillance apparatus exert constant pressure and are interrogated, but the real subject is Carrie and Saul's relationships and choices rather than the machine's own self-perpetuating logic."},{"axis":"Interiority","code":"Int","value":7,"confidence":"high","justification":"The show stages Carrie's bipolar consciousness from the inside — her jazz-wall manias, breakdowns and obsessive certainty are rendered as subjective experience, not just observed behavior."},{"axis":"Authorial Signature","code":"Auth","value":4,"confidence":"medium","justification":"Competent prestige-thriller craft with the recurring saxophone-jazz motif and handheld tension, but no strongly recognizable auteur stamp; the technique mostly serves the plot."},{"axis":"Verisimilitude","code":"Ver","value":6,"confidence":"medium","justification":"Tradecraft, CIA station politics and intelligence-vetting feel researched, but the recurring implausible coincidences and heightened Carrie-Brody intrigue dilute the lived-in texture."},{"axis":"Density","code":"Den","value":5,"confidence":"medium","justification":"Requires tracking factions and double-agent allegiances, but it explains its stakes clearly and leans on Carrie's verbalized theories rather than withholding exposition."},{"axis":"Register","code":"Reg","value":6,"confidence":"medium","justification":"Pitched higher than naturalistic spy realism — Danes's tearful, trembling breakdowns and the propulsive scoring push the emotional key toward melodrama without going fully operatic."}],"values":[8,7,5,7,4,6,5,6]},"Homicide: Life on the Street":{"genres":["Crime"],"scores":[{"axis":"Propulsion","code":"Prop","value":4,"confidence":"medium","justification":"Built largely on case-of-the-week structure tracked via the squad's red/black name board; serialized threads like the Adena Watson case and Luther Mahoney arc add pull, but episodes mostly resolve rather than detonate the next."},{"axis":"Scope","code":"Scope","value":4,"confidence":"medium","justification":"Confined to one Baltimore homicide squad and the city's crime scenes; canvas widens socially through victims and brass but stays anchored to a single unit and timeframe."},{"axis":"Institutional Sweep","code":"Swp","value":6,"confidence":"medium","justification":"The clearance-rate board, the politics of the brass, budget pressures, and the interrogation 'box' make the unit's self-perpetuating bureaucracy a genuine subject, though the detectives' personalities still share the stage."},{"axis":"Interiority","code":"Int","value":5,"confidence":"medium","justification":"Bayliss's guilt over the unsolved Adena Watson case and Pembleton's crises of faith give real inner access, but the dominant mode is observing detectives at work."},{"axis":"Authorial Signature","code":"Auth","value":7,"confidence":"high","justification":"The jittery handheld camerawork, jump cuts, and repeated triple-cut takes of the same line make the show instantly recognizable as a distinct directorial hand."},{"axis":"Verisimilitude","code":"Ver","value":8,"confidence":"high","justification":"Drawn from David Simon's reporting on the real Baltimore homicide unit, the procedure, paperwork, and interrogation tactics feel reported rather than invented."},{"axis":"Density","code":"Den","value":6,"confidence":"medium","justification":"A large rotating ensemble and multiple concurrent cases require tracking, though the episodic resolutions and procedural framing keep it followable."},{"axis":"Register","code":"Reg","value":4,"confidence":"medium","justification":"Mostly naturalistic and grounded, but Pembleton's theatrical interrogation monologues and occasional swelling emotional beats push it above flat realism."}],"values":[4,4,6,5,7,8,6,4]},"House":{"genres":["Drama"],"scores":[{"axis":"Propulsion","code":"Prop","value":4,"confidence":"high","justification":"The case-of-the-week structure resets each episode around a new patient mystery; the diagnostic 'eureka' arrives reliably by the act break rather than detonating consequences that compound across episodes, though the Vicodin and Cuddy arcs add some serialized pull."},{"axis":"Scope","code":"Scope","value":2,"confidence":"high","justification":"Almost entirely confined to Princeton-Plainsboro's diagnostics department, clinic, and a handful of patients' rooms; the world rarely extends past House's small team and the hospital walls."},{"axis":"Institutional Sweep","code":"Swp","value":2,"confidence":"medium","justification":"The hospital is a backdrop and a source of pressure (Cuddy's administration, lawsuits, donors), not a self-perpetuating machine the show traces; swap the hospital for any setting that lets a genius solve puzzles and it's the same House show."},{"axis":"Interiority","code":"Int","value":6,"confidence":"medium","justification":"House's pain, addiction, and misanthropic self-loathing are the recurring real subject, surfaced through his therapy sessions and confrontations, but the show stages this through behavior and dialogue rather than putting us inside his consciousness."},{"axis":"Authorial Signature","code":"Auth","value":3,"confidence":"medium","justification":"Largely conventional network-procedural craft; the recurring CGI fly-through-the-body shots are its one signature flourish, but nothing about the framing or structure would identify it blind."},{"axis":"Verisimilitude","code": ly stage his calculations and contempt, making his inner reasoning the literal text of the show."},{"axis":"Authorial Signature","code":"Auth","value":7,"confidence":"high","justification":"Fincher's sleek, cold, shadowed visual palette plus the signature fourth-wall-breaking address make it recognizable on sight."},{"axis":"Verisimilitude","code":"Ver","value":4,"confidence":"medium","justification":"Plausible Beltway texture is undercut by melodramatic implausibility — a Whip personally murdering a journalist and a congressman without consequence reads mythologized rather than reported."},{"axis":"Density","code":"Den","value":5,"confidence":"medium","justification":"Multiple subplots (legislation, media, the Underwood marriage) require tracking, but Frank's narration spells out motives and stakes so little is genuinely withheld."},{"axis":"Register","code":"Reg","value":6,"confidence":"medium","justification":"Heightened Machiavellian melodrama — soliloquies, swelling menace, operatic betrayals — yet delivered through Spacey's cool, controlled menace rather than full-throated theatricality."}],"values":[8,6,4,7,7,4,5,6]},"House of the Dragon":{"genres":["Fantasy"],"scores":[{"axis":"Propulsion","code":"Prop","value":6,"confidence":"medium","justification":"The Targaryen succession crisis steadily escalates toward the Dance of the Dragons, but multi-year time jumps and long stretches of council intrigue (especially in Season 2) repeatedly stall the build rather than detonating one problem into the next."},{"axis":"Scope","code":"Scope","value":8,"confidence":"high","justification":"Spans King's Landing, Dragonstone, the Free Cities, and warring houses across Westeros over roughly two decades of dynastic history, with the Greens and Blacks splitting the whole realm."},{"axis":"Institutional Sweep","code":"Swp","value":5,"confidence":"medium","justification":"The Iron Throne, the Small Council, and the laws of succession exert constant pressure, but the show's real subject is the Targaryen family's personal rivalries rather than the self-perpetuating logic of the monarchy as a machine."},{"axis":"Interiority","code":"Int","value":4,"confidence":"medium","justification":"There's genuine access to Rhaenyra's and Alicent's resentments and divided loyalties, but the dominant mode is observed court maneuvering and dynastic spectacle rather than living inside a consciousness."},{"axis":"Authorial Signature","code":"Auth","value":5,"confidence":"medium","justification":"Lavish, dragon-driven production design and the candlelit Targaryen-history aesthetic are distinctive, but the grammar is largely conventional prestige-fantasy coverage without a blind-recognizable formal hand."},{"axis":"Verisimilitude","code":"Ver","value":5,"confidence":"medium","justification":"Court ritual, lineage politics, and medieval power dynamics feel reasonably grounded and researched, but the dragons, golden Targaryen mythos, and occasional anachronistic polish pull it toward the mythologized rather than the reported."},{"axis":"Density","code":"Den","value":6,"confidence":"medium","justification":"Viewers must track a tangle of Targaryen and allied houses, intermarried lineages, and shifting council allegiances, though the central Greens-vs-Blacks split keeps it more followable than its house-count suggests."},{"axis":"Register","code":"Reg","value":8,"confidence":"high","justification":"Swelling Ramin Djawadi score, dragon-fire spectacle, anguished succession melodrama, and heightened throne-room confrontations pitch the emotion operatically loud."}],"values":[6,8,5,4,5,5,6,8]},"Industry":{"genres":["Drama"],"scores":[{"axis":"Propulsion","code":"Prop","value":7,"confidence":"medium","justification":"Deals, performance reviews, and RIF threats keep tightening — Harper's fabricated client wins and the constant fear of being cut create scene-to-scene escalation, though some interpersonal subplots idle."},{"axis":"Scope","code":"Scope","value":5,"confidence":"medium","justification":"Largely confined to Pierpoint's London trading floor and the grads' flats, expanding later to clients, energy/IPO deals and a brush with government, but the canvas stays tight around one firm's orbit."},{"axis":"Institutional Sweep","code":"Swp","value":6,"confidence":"medium","justification":"Pierpoint as a self-perpetuating machine — its desk hierarchies, RIF logic, and ethics-versus-revenue calculus — genuinely shares the stage, though the show is equally about the young characters' personal arcs."},{"axis":"Interiority","code":"Int","value":6,"confidence":"medium","justification":"We get substantial access to Harper's ambition and impostor anxiety and Yasmin's class wounds, but the mode often observes behavior and performance on the floor rather than staging us inside a mind."},{"axis":"Authorial Signature","code":"Auth","value":5,"confidence":"medium","justification":"A confident, kinetic handheld style with needle-drops and tight close-ups (Lena Dunham's pilot setting the tone), but not a blind-recognizable auteur stamp."},{"axis":"Verisimilitude","code":"Ver","value":8,"confidence":"high","justification":"Created by ex-bankers, the unglossed jargon, desk dynamics, cross-selling pitches and compliance pressure feel reported and lived-in rather than glamorized."},{"axis":"Density","code":"Den","value":8,"confidence":"high","justification":"It refuses to explain its finance jargon — structured products, FX trades, RIF, allocation — and expects you to track many names and desk politics unaided."},{"axis":"Register","code":"Reg","value":6,"confidence":"medium","justification":"Pitched fairly hot — cocaine binges, sexual power plays, a death, and charged confrontations — though performances stay naturalistic rather than fully operatic."}],"values":[7,5,6,6,5,8,8,6]},"It's Always Sunny in Philadelphia":{"genres":["Comedy"],"scores":[{"axis":"Propulsion","code":"Prop","value":2,"confidence":"high","justification":"Episodes are self-contained schemes that reset to zero by the end credits; the Gang's status quo never escalates or compounds across episodes, by design."},{"axis":"Scope","code":"Scope","value":2,"confidence":"high","justification":"Confined almost entirely to Paddy's Pub and a handful of South Philly locations following five degenerates; the canvas is deliberately tiny."},{"axis":"Institutional Sweep","code":"Swp","value":1,"confidence":"high","justification":"The bar is merely a hangout, not a system the show traces; the subject is five narcissists, not any self-perpetuating institution."},{"axis":"Interiority","code":"Int","value":1,"confidence":"high","justification":"Purely external farce — we watch Dennis, Mac, and the others scheme and humiliate themselves with no genuine access to interior life beyond their stated delusions."},{"axis":"Authorial Signature","code":"Auth","value":3,"confidence":"medium","justification":"Mostly flat sitcom coverage and handheld looseness, though recurring devices like the cutaway title cards give a mild recognizable stamp."},{"axis":"Verisimilitude","code":"Ver","value":4,"confidence":"medium","justification":"The grimy bar and shabby Philadelphia milieu feel lived-in, but the cartoonish scheme logic and broad characters undercut any reported authenticity."},{"axis":"Density","code":"Den","value":2,"confidence":"high","justification":"Each episode stands alone and explains its own premise quickly; almost nothing must be tracked across episodes beyond running gags."},{"axis":"Register","code":"Reg","value":7,"confidence":"medium","justification":"The performances are loud, manic, and heightened — screaming arguments, Charlie's frantic outbursts, Dennis's volcanic rage — pitched well into broad comic operatics."}],"values":[2,2,1,1,3,4,2,7]},"Justified":{"genres":["Crime","Western"],"scores":[{"axis":"Propulsion","code":"Prop","value":7,"confidence":"medium","justification":"The escalating cat-and-mouse between Raylan and Boyd Crowder, plus season-long villains like Mags Bennett and Robert Quarles, keeps consequences compounding even when individual episodes start procedurally."},{"axis":"Scope","code":"Scope","value":4,"confidence":"medium","justification":"Largely confined to Harlan County and Lexington, Kentucky, with the social strata of mining-country crime families and the Marshals office, but it never expands much beyond that regional canvas."},{"axis":"Institutional Sweep","code":"Swp","value":3,"confidence":"medium","justification":"The US Marshals Service is a backdrop and pressure source; the real subject is Raylan and Boyd as individuals, and swapping the agency wouldn't change the core story."},{"axis":"Interiority","code":"Int","value":4,"confidence":"medium","justification":"There's real attention to Raylan's father-haunted psychology and his pull back to Harlan, but the Elmore Leonard mode keeps him cool and observed from outside more than internally staged."},{"axis":"Authorial Signature","code":"Auth","value":5,"confidence":"medium","justification":"The distinctive Elmore Leonard wit and rhythm in the dialogue gives a recognizable voice, but the camera and visual grammar are fairly conventional cable-drama craft."},{"axis":"Verisimilitude","code":"Ver","value":5,"confidence":"medium","justification":"Harlan's hollows, dialect, and oxy/coal-country economy feel researched, but the quick-draw showdowns and gunslinger cool push it toward modern-western mythology."},{"axis":"Density","code":"Den","value":5,"confidence":"medium","justification":"It rewards tracking recurring Crowder and Bennett family members across arcs, but episodes remain accessible and don't withhold much exposition."},{"axis":"Register","code":"Reg","value":6,"confidence":"medium","justification":"The drawled banter, posed standoffs, and modern-western swagger pitch it above naturalism, though it stops short of full operatic melodrama."}],"values":[7,4,3,4,5,5,5,6]},"Killing Eve":{"genres":["Thriller","Comedy"],"scores":[{"axis":"Propulsion","code":"Prop","value":7,"confidence":"medium","justification":"The obsessive cat-and-mouse between Eve and Villanelle drives a strong pull — each near-miss and intimate confrontation baits the next — though the middle seasons stall and circle without escalating cleanly."},{"axis":"Scope","code":"Scope","value":6,"confidence":"medium","justification":"The chase ranges across European capitals — London, Paris, Berlin, Russia — and touches MI6 and the shadowy international syndicate The Twelve, giving a wide geographic canvas without the full social stratification of a true epic."},{"axis":"Institutional Sweep","code":"Swp","value":3,"confidence":"medium","justification":"MI6 and The Twelve are pressure sources and a backdrop for the central fixation; the show never traces the syndicate's self-perpetuating machinery — it keeps it deliberately opaque because the real subject is the two women's mutual obsession."},{"axis":"Interiority","code":"Int","value":5,"confidence":"medium","justification":"We get real access to Eve's spiraling fascination and glimpses of Villanelle's hollow psychology, but the mode is largely performance-driven and observed rather than staged inside a single consciousness."},{"axis":"Authorial Signature","code":"Auth","value":7,"confidence":"medium","justification":"A distinctive arch, darkly comic voice and a fashion-forward, color-saturated visual flair make it recognizable — the playful framing of Villanelle's kills marks a strong stylistic hand."},{"axis":"Verisimilitude","code":"Ver","value":3,"confidence":"medium","justification":"The world is glamorized — couture-clad assassins, theatrical, improbable killings, and a fantasy of spycraft — privileging style and wit over researched, lived-in tradecraft."},{"axis":"Density","code":"Den","value":4,"confidence":"medium","justification":"The plotting is followable with a manageable cast; The Twelve's intrigue adds some threads to track, but the show rarely withholds enough to demand active work."},{"axis":"Register","code":"Reg","value":8,"confidence":"medium","justification":"Heightened and playful — Villanelle's flamboyant kills, the arch comic dialogue, and the melodramatic charge of the central attraction are pitched loud, leaning campy given the low verisimilitude."}],"values":[7,6,3,5,7,3,4,8]},"Kingdom":{"genres":["Horror","Historical"],"scores":[{"axis":"Propulsion","code":"Prop","value":8,"confidence":"medium","justification":"The Joseon-era plague spreads relentlessly outward from Dongnae, and Crown Prince Lee Chang's flight south while the infection races behind him keeps each episode ending on an escalating threat that forces the next."},{"axis":"Scope","code":"Scope","value":7,"confidence":"medium","justification":"It spans the royal palace at Hanyang, southern provinces like Dongnae and Sangju, and every social stratum from the puppet boy-king and Haewon Cho clan down to starving peasants, while the plague's spread covers a whole kingdom's geography."},{"axis":"Institutional Sweep","code":"Swp","value":5,"confidence":"medium","justification":"The Haewon Cho clan's manipulation of the throne and the rigid class hierarchy are genuine subjects — the show traces how the ruling order hoards rice and exploits commoners — but the core drama remains Lee Chang's personal struggle for legitimacy rather than the machine's own logic."},{"axis":"Interiority","code":"Int","value":3,"confidence":"medium","justification":"The show observes action and political maneuvering from the outside; Lee Chang and physician Seo-bi are defined by what they do, with little staging inside their inner lives."},{"axis":"Authorial Signature","code":"Auth","value":6,"confidence":"medium","justification":"A strong, recognizable hand in the sweeping period cinematography, the painterly palace and snow-covered landscape compositions, and the choreographed nighttime horde attacks."},{"axis":"Verisimilitude","code":"Ver","value":6,"confidence":"medium","justification":"The Joseon-era costuming, court rituals, hanbok and gat hats, and political customs are meticulously rendered, though the supernatural plague and its resurrection-flower mythology pull it away from pure realism."},{"axis":"Density","code":"Den","value":5,"confidence":"low","justification":"Viewers must track the Cho clan's scheming, factional court politics and several names, but the central chase and clear cliffhangers keep it followable without much homework."},{"axis":"Register","code":"Reg","value":6,"confidence":"medium","justification":"The pitch is heightened — swelling score, melodramatic palace confrontations, and operatic horror set-pieces — sitting above naturalism though grounded by the period texture."}],"values":[8,7,5,3,6,6,5,6]},"Line of Duty":{"genres":["Crime"],"scores":[{"axis":"Propulsion","code":"Prop","value":9,"confidence":"high","justification":"Each interrogation scene and revelation (the identity of 'H', the bent officer of the series) detonates the next, and episodes routinely end on a cliffhanger that forces the next; the engine almost never idles."},{"axis":"Scope","code":"Scope","value":4,"confidence":"medium","justification":"Largely confined to AC-12 and a single (unnamed) urban police force, with each series anatomising one corruption case rather than spanning many places or strata."},{"axis":"Institutional Sweep","code":"Swp","value":7,"confidence":"medium","justification":"The show genuinely traces how police corruption perpetuates itself — cover-ups, the OCG's infiltration up the chain, and institutional self-protection are the real subject as much as the individual bent officers."},{"axis":"Interiority","code":"Int","value":3,"confidence":"medium","justification":"Almost entirely external — built around interrogations and observed behaviour, with little staging inside Steve, Kate, or Hastings's inner lives."},{"axis":"Authorial Signature","code":"Auth","value":4,"confidence":"medium","justification":"Mercurio's signature long interrogation set-pieces give it a recognisable rhythm, but the overall visual grammar is conventional BBC procedural, not foregrounded auteur style."},{"axis":"Verisimilitude","code":"Ver","value":6,"confidence":"medium","justification":"Dense, accurate-feeling police procedure and acronym soup (CHIS, UCO, Reg 15, ARV) lend real texture, though the cliffhanger plotting and serial-twist coincidences strain plausibility."},{"axis":"Density","code":"Den","value":7,"confidence":"high","justification":"The relentless acronyms, procedural jargon, and tangled web of cross-series names and conspiracies must be actively tracked, with little hand-holding for the casual viewer."},{"axis":"Register","code":"Reg","value":5,"confidence":"medium","justification":"Mostly grounded and naturalistic, but the high-pitched interrogation confrontations and shock reveals push it toward heightened melodrama in the set-pieces."}],"values":[9,4,7,3,4,6,7,5]},"Loki":{"genres":["Sci-Fi"],"scores":[{"axis":"Propulsion","code":"Prop","value":7,"confidence":"medium","justification":"Each episode chases the next branching mystery—the TVA hunt, the search for the variant, the journey to the Citadel—with cliffhanger reveals (the Sylvie kiss, He Who Remains' offer) that pull forward, though some mid-stretches idle in exposition."},{"axis":"Scope","code":"Scope","value":9,"confidence":"high","justification":"The canvas spans the entire Multiverse, the Sacred Timeline across all of history (Pompeii, apocalypses, the end of time), and infinite branching realities, making the temporal/spatial scale enormous."},{"axis":"Institutional Sweep","code":"Swp","value":6,"confidence":"medium","justification":"The TVA—its bureaucracy, mythology of the Time-Keepers, pruning protocols, and self-perpetuating lie that its workers are brainwashed variants—genuinely functions as a system the show interrogates, though it remains partly a backdrop for Loki's personal arc."},{"axis":"Interiority","code":"Int","value":6,"confidence":"medium","justification":"The show stages Loki confronting his own narcissism and self-worth (the time-loop torture device replaying his worst moments, conversations with Sylvie as a mirror), giving real inner access without ever becoming a fully subjective frame."},{"axis":"Authorial Signature","code":"Auth","value":7,"confidence":"medium","justification":"A distinctive retro-futurist TVA design, brutalist orange-and-green palette, Miss Minutes' cartoon interjections, and the recursive looping visuals give it a recognizable, stylized hand beyond standard MCU house style."},{"axis":"Verisimilitude","code":"Ver","value":3,"confidence":"medium","justification":"The world is deliberately fantastical and mythologized—time bureaucracy, infinity-stone paperweights, talking clocks—with no pretense of researched, lived-in realism."},{"axis":"Density","code":"Den","value":5,"confidence":"medium","justification":"Viewers must track variants, timelines, and TVA jargon (Nexus events, pruning, branching), but the show explains its rules generously through Mobius and Miss Minutes exposition."},{"axis":"Register","code":"Reg","value":6,"confidence":"medium","justification":"Played with heightened emotion and a swelling score in the romance and Citadel confrontation scenes, balanced by Owen Wilson's dry comedy, landing in a moderately operatic middle pitch."}],"values":[7,9,6,6,7,3,5,6]},"Lost":{"genres":["Sci-Fi","Mystery"],"scores":[{"axis":"Propulsion","code":"Prop","value":9,"confidence":"high","justification":"The mystery-box engine and end-of-episode reveals (the hatch, the Others, the flash-forwards) make each episode demand the next; cliffhangers compound relentlessly across seasons."},{"axis":"Scope","code":"Scope","value":7,"confidence":"medium","justification":"Beyond the island it sprawls across many characters' pre-crash lives worldwide, time-travel to different eras, and off-island flash-forwards, widening both geographic and temporal canvas considerably."},
