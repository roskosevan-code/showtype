olism, grief, racism, and faith from the inside, giving sustained access to his inner struggle, though much of the squad is observed externally."},{"axis":"Authorial Signature","code":"Auth","value":6,"confidence":"medium","justification":"Bochco/Milch's restless handheld camerawork, whip-pans, and jittery push-ins were a distinctive, much-imitated formal signature for network drama at the time."},{"axis":"Verisimilitude","code":"Ver","value":7,"confidence":"medium","justification":"The interrogation-room rhythms, paperwork, partner dynamics, and Milch's profane street-cop dialogue feel researched and lived-in, grounded in real detective procedure."},{"axis":"Density","code":"Den","value":4,"confidence":"medium","justification":"Built for network broadcast with self-contained cases and clear exposition; ongoing arcs reward viewing but it never asks you to track a large web of names or threads."},{"axis":"Register","code":"Reg","value":5,"confidence":"medium","justification":"Naturalistic in its squad-room banter, but the show leans into heightened emotional confrontations and Sipowicz's tearful crises, pitching key scenes melodramatically above flat realism."}],"values":[5,3,4,6,6,7,4,5]},"Narcos":{"genres":["Crime"],"scores":[{"axis":"Propulsion","code":"Prop","value":8,"confidence":"high","justification":"The DEA pursuit of Escobar drives relentlessly from raid to raid, with each manhunt setback and betrayal forcing the next escalation toward the eventual kill; the narration constantly pushes the timeline forward."},{"axis":"Scope","code":"Scope","value":8,"confidence":"high","justification":"Spans Colombia's cartels, the Medellin streets, US DEA and government, the Cali rivals, and political assassinations reaching into the Colombian presidency and Washington."},{"axis":"Institutional Sweep","code":"Swp","value":5,"confidence":"medium","justification":"The DEA, Colombian police/Search Bloc, and the cartel as an enterprise exert real systemic pressure, but the show is ultimately built around Escobar and the agents hunting him rather than tracing a machine's self-perpetuating logic."},{"axis":"Interiority","code":"Int","value":4,"confidence":"medium","justification":"Murphy's voiceover gives some access to the agents' perspective and Escobar's family-man rationalizations, but the mode is mostly external observation of events."},{"axis":"Authorial Signature","code":"Auth","value":5,"confidence":"medium","justification":"The heavy archival-footage intercutting and Murphy's noir-style narration give a recognizable texture, but the directing is largely conventional prestige-crime craft."},{"axis":"Verisimilitude","code":"Ver","value":6,"confidence":"medium","justification":"Real news footage, Spanish-language dialogue, and actual events lend authenticity, though the voiceover compresses and dramatizes history with some glamorizing of the kingpin."},{"axis":"Density","code":"Den","value":5,"confidence":"medium","justification":"Many real names, factions, and political players to track, but the constant narration explains the cartel structure and history so the viewer is rarely left to keep up alone."},{"axis":"Register","code":"Reg","value":5,"confidence":"medium","justification":"Grounded in gritty cartel violence but heightened by dramatic music, the mythologizing voiceover, and Escobar's larger-than-life presentation, sitting between naturalism and operatic."}],"values":[8,8,5,4,5,6,5,5]},"Narcos: Mexico":{"genres":["Crime"],"scores":[{"axis":"Propulsion","code":"Prop","value":7,"confidence":"medium","justification":"Félix Gallardo's consolidation of the plazas and the DEA's pursuit of him build with cause-and-effect escalation, though the narrator's foreshadowing and historical-recap detours occasionally release the tension."},{"axis":"Scope","code":"Scope","value":8,"confidence":"medium","justification":"It spans the whole Mexican drug trade across Guadalajara, Sinaloa, Juárez, and Tijuana, U.S. agencies, and Colombian suppliers, tracking the birth of a national cartel federation over years."},{"axis":"Institutional Sweep","code":"Swp","value":6,"confidence":"medium","justification":"It genuinely traces how the DFS, corrupt Mexican government, and the cartel federation function as self-perpetuating systems, but the drama keeps centering on Félix and individual agents rather than the machine alone."},{"axis":"Interiority","code":"Int","value":4,"confidence":"medium","justification":"Voiceover narration grants some access to motives and Félix's ambition, but the mode is largely external, observing political maneuvering and violence rather than staging the inside of a mind."},{"axis":"Authorial Signature","code":"Auth","value":4,"confidence":"medium","justification":"The omniscient ironic narrator and archival-footage intercuts are a recognizable device, but the visual grammar is otherwise conventional prestige-crime filmmaking."},{"axis":"Verisimilitude","code":"Ver","value":7,"confidence":"medium","justification":"The Camarena killing, period detail, Spanish-language texture, and real political figures feel researched, with only mild dramatized streamlining of the historical record."},{"axis":"Density","code":"Den","value":6,"confidence":"medium","justification":"Viewers must track many plazas, families, and shifting alliances across the federation, but the narrator's explanations and recaps cushion the load."},{"axis":"Register","code":"Reg","value":5,"confidence":"medium","justification":"Mostly grounded and procedural with a hard-boiled narrator, but the bursts of stylized violence and tragic operatic flourishes (Camarena's torture, betrayals) push the pitch above flat naturalism."}],"values":[7,8,6,4,4,7,6,5]},"Normal People":{"genres":["Drama"],"scores":[{"axis":"Propulsion","code":"Prop","value":4,"confidence":"medium","justification":"The will-they-won't-they pull between Marianne and Connell creates real forward draw, but the show repeatedly stalls in miscommunication and on-agai ty","code":"Int","value":4,"confidence":"medium","justification":"We follow Marty's and Wendy's calculating reasoning and Ruth's emotional struggle, but the show mostly observes maneuvering behavior rather than staging itself deep inside a consciousness."},{"axis":"Authorial Signature","code":"Auth","value":6,"confidence":"high","justification":"The desaturated blue-grey color grading, cold overhead compositions, and chapter-marker title cards give it an instantly recognizable, controlled visual hand."},{"axis":"Verisimilitude","code":"Ver","value":5,"confidence":"medium","justification":"The money-laundering mechanics and rural Missouri milieu feel researched, but the relentless escalation and the Byrdes' improbable survival edge toward the schematic rather than fully lived-in."},{"axis":"Density","code":"Den","value":5,"confidence":"medium","justification":"Multiple financial schemes and competing factions require attention, but the dialogue explains the laundering logic and motivations clearly enough to follow without much work."},{"axis":"Register","code":"Reg","value":4,"confidence":"medium","justification":"Performances stay mostly cool and clipped (Marty's deadpan calm), though Wendy's late-series theatrics and operatic family showdowns push the pitch above flat naturalism."}],"values":[9,4,3,4,6,5,5,4]},"PEN15":{"genres":["Comedy"],"scores":[{"axis":"Propulsion","code":"Prop","value":3,"confidence":"medium","justification":"Largely episodic vignettes built around discrete middle-school humiliations (the AIM 'thumb war' chat, the school play, the spin-the-bottle party) rather than escalating consequences that force the next episode."},{"axis":"Scope","code":"Scope","value":2,"confidence":"high","justification":"Confined to two seventh-grade girls' suburban world in the year 2000 — school hallways, bedrooms, and a few houses; no geographic, temporal, or social expansion."},{"axis":"Institutional Sweep","code":"Swp","value":2,"confidence":"high","justification" ation":"Spans nearly a century from 1910s Busan to 1989 Tokyo and Osaka, tracking four generations across Korean colonial poverty, Japanese diaspora ghettos, and global high finance."},{"axis":"Institutional Sweep","code":"Swp","value":5,"confidence":"medium","justification":"Japanese colonialism and the systemic discrimination against Zainichi Koreans (registration cards, barred professions) press hard on the family, but the show traces the Baek family's survival rather than the self-perpetuating machinery of those systems."},{"axis":"Interiority","code":"Int","value":6,"confidence":"medium","justification":"The narrative stays close to Sunja's emotional world and Solomon's divided identity, dwelling on memory, shame, and longing rather than purely external behavior."},{"axis":"Authorial Signature","code":"Auth","value":7,"confidence":"high","justification":"A strongly recognizable hand: the color-coded yellow/blue subtitles distinguishing Korean and Japanese, the joyous anachronistic title-sequence dance, and the lush interwoven-timeline structure are distinctive directorial choices."},{"axis":"Verisimilitude","code":"Ver","value":8,"confidence":"medium","justification":"Meticulous period texture and trilingual authenticity (Korean, Japanese, English) — the boarding houses, market stalls, and historical detail of the Kanto earthquake aftermath feel researched and lived-in."},{"axis":"Density","code":"Den","value":6,"confidence":"medium","justification":"Requires tracking two braided timelines, three languages, and historical context across generations, though the emotional throughline keeps it followable."},{"axis":"Register","code":"Reg","value":6,"confidence":"medium","justification":"Emotionally heightened with a swelling score and melodramatic family-saga peaks (separations, sacrifices), pitched warmer and louder than naturalistic drama yet grounded by its authentic texture."}],"values":[5,9,5,6,7,8,6,6]},"Parks and Recreation":{"genres":["Comedy"],"scores":[{ me of the Subura — though some plotting leans into sensational melodrama."},{"axis":"Density","code":"Den","value":6,"confidence":"medium","justification":"Requires tracking a large cast of historical figures, shifting Senate factions and alliances, but it provides enough narrative orientation that it never withholds like The Wire."},{"axis":"Register","code":"Reg","value":7,"confidence":"medium","justification":"Pitched fairly operatic — Atia's venomous scheming, lurid sex and violence, and heightened oratory and betrayal — though grounded enough by its texture to avoid the corny reading."}],"values":[7,8,5,4,5,7,6,7]},"Russian Doll":{"genres":["Comedy","Sci-Fi"],"scores":[{"axis":"Propulsion","code":"Prop","value":8,"confidence":"high","justification":"The time-loop structure is an engine: each of Nadia's deaths resets the night and forces her to push the mystery forward, with the loops degrading and escalating so every reset tightens the stakes."},{"axis":"Scope","code":"Scope","value":4,"confidence":"medium","justification":"Season 1 is confined to one East Village birthday party and a few blocks; the canvas only widens in Season 2's subway time-travel into the 1980s and 1940s, giving it modest temporal reach but a small social and geographic footprint."},{"axis":"Institutional Sweep","code":"Swp","value":1,"confidence":"high","justification":"There is no institution under examination—the subject is Nadia's personal reckoning, not any self-perpetuating system."},{"axis":"Interiority","code":"Int","value":8,"confidence":"medium","justification":"The loops are ultimately a staging of Nadia's psyche—her guilt over her mother, her self-destruction and avoidance—so the metaphysics function as a literalized interior journey toward healing."},{"axis":"Authorial Signature","code":"Auth","value":8,"confidence":"high","justification":"A strongly recognizable hand: the cyclical bathroom-mirror reset, Harry Nilsson's 'Gotta Get Up' as a structural cue, and Lyonne's distinctive voice make it identifiable in seconds."},{"axis":"Verisimilitude","code":"Ver","value":6,"confidence":"medium","justification":"Despite the supernatural premise, the East Village milieu—the dive-bar friends, the grimy apartments, Lyonne's lived-in deli-and-cigarettes New York—feels specific and authentic."},{"axis":"Density","code":"Den","value":6,"confidence":"medium","justification":"Viewers must track which loop they're in, the accumulating clues (disappearing people, dying fish, mirrors), and the Season 2 generational threads, but the show still orients you with each reset."},{"axis":"Register","code":"Reg","value":5,"confidence":"medium","justification":"Pitched between deadpan dark comedy and emotional heightening—Lyonne's wry, abrasive delivery keeps it cool, but the climactic mother-daughter catharsis and existential stakes push it toward the operatic."}],"values":[8,4,1,8,8,6,6,5]},"Schitt's Creek":{"genres":["Comedy"],"scores":[{"axis":"Propulsion","code":"Prop","value":4,"confidence":"medium","justification":"The Rose family's slow softening and Moira's town-renaissance arc accumulate gently over seasons, but episodes are largely self-contained sitcom situations (the spa, the singles' party) rather than each scene detonating the next."},{"axis":"Scope","code":"Scope","value":2,"confidence":"high","justification":"Confined almost entirely to one tiny town — the motel, Café Tropical, Rose Apothecary — with a small recurring cast and a compressed present-day timeframe."},{"axis":"Institutional Sweep","code":"Swp","value":1,"confidence":"high","justification":"No system is the subject; the town's institutions (the council, the motel) are comedic backdrop for a family's personal reinvention, not machines with their own logic."},{"axis":"Interiority","code":"Int","value":3,"confidence":"medium","justification":"We watch the Roses behave and change from the outside; aside from David and Patrick's tender exchanges, the show rarely stages anyone's inner consciousness."},{"axis":"Authorial Signature","code":"Auth","value":3,"confidence":"medium","justification":"Flat, warm sitcom shooting with little formal trickery; the distinctive voice lives in Moira's vocabulary and David's mannerisms, not in visual or structural style."},{"axis":"Verisimilitude","code":"Ver","value":3,"confidence":"medium","justification":"A deliberately gentle, conflict-light fantasy of small-town life where homophobia is absent and reversals are forgiving — charming but not reported or granular."},{"axis":"Density","code":"Den","value":2,"confidence":"high","justification":"Episodes are accessible and self-explaining; the running jokes and small cast require no active tracking of threads or names."},{"axis":"Register","code":"Reg","value":6,"confidence":"medium","justification":"Moira's baroque diction and wigs and David's exaggerated melodrama pitch the comedy heightened, though the emotional beats (David's vows, Patrick's serenade) play sincere and warm rather than fully operatic."}],"values":[4,2,1,3,3,3,2,6]},"Search Party":{"genres":["Comedy","Mystery"],"scores":[{"axis":"Propulsion","code":"Prop","value":7,"confidence":"medium","justification":"Each season is built on an escalating engine — the search for Chantal, then the cover-up of Keith's killing, then the trial — with cliffhangers that pull straight into the next episode."},{"axis":"Scope","code":"Scope","value":3,"confidence":"medium","justification":"Anchored to a tight clique of four self-absorbed Brooklynites and their immediate orbit; even when the plot mushrooms into a trial or cult, the canvas stays small and local."},{"axis":"Institutional Sweep","code":"Swp","value":2,"confidence":"medium","justification":"The murder trial and media circus are satirized as a culture, but no institution's self-perpetuating logic is the subject — the show is about Dory and her friends' narcissism, not a machine."},{"axis":"Interiority","code":"Int","value":4,"confidence":"low","justification":"It's mostly external satire of behavior, though Dory's spiraling self-justification and delusion get genuine inner attention, especially as she rationalizes the killing."},{"axis":"Authorial Signature","code":"Auth","value":6,"confidence":"medium","justification":"A recognizable hand via genre-shifting per season (noir mystery, courtroom drama, cult thriller), arch title cards, and a consistent ironic millennial voice."},{"axis":"Verisimilitude","code":"Ver","value":4,"confidence":"medium","justification":"The Brooklyn hipster milieu — affected speech, performative friendships, brunch culture — is sharply observed, but the plot machinery (accidental murders, cults) is heightened and absurd."},{"axis":"Density","code":"Den","value":4,"confidence":"low","justification":"The plotting is followable and the satire is legible; it rewards attention but never withholds in the way of a multi-thread systems show."},{"axis":"Register","code":"Reg","value":5,"confidence":"medium","justification":"Early seasons play deadpan and ironic, but the tone escalates toward operatic absurdity in the trial and cult arcs, landing mid-spectrum."}],"values":[7,3,2,4,6,4,4,5]},"Seinfeld":{"genres":["Comedy"],"scores":[{"axis":"Propulsion","code":"Prop","value":3,"confidence":"medium","justification":"As an episodic sitcom it resets each week with no serialized stakes; the only escalation is the clever convergence of George's, Jerry's, Elaine's, and Kramer's separate plotlines into one comic collision within a single episode."},{"axis":"Scope","code":"Scope","value":2,"confidence":"high","justification":"Confined to four friends orbiting Jerry's apartment, Monk's diner, and a few Manhattan blocks; the canvas is deliberately small everyday New York."},{"axis":"Institutional Sweep","code":"Swp","value":1,"confidence":"high","justification":"No institution is the subject; even recurring workplaces like the Yankees office or Pendant Publishing are joke backdrops, never machines whose logic the show traces."},{"axis":"Interiority","code":"Int","value":2,"confidence":"medium","justification":"Purely behavioral and observational — the show watches how people navigate social rules (double-dipping, the soup nazi) and never stages anyone's inner life."},{"axis":"Authorial Signature","code":"Auth","value":4,"confidence":"medium","justification":"Visually a plain multi-camera sitcom, but the signature structural device of braiding multiple trivial plots into a single converging payoff, bookended by Jerry's stand-up, is recognizable."},{"axis":"Verisimilitude","code":"Ver","value":5,"confidence":"medium","justification":"Built from minutely observed real social minutiae — waiting for a restaurant table, parking-garage etiquette, breakup logistics — though the comic exaggeration of situations keeps it from feeling fully reported."},{"axis":"Density","code":"Den","value":3,"confidence":"medium","justification":"Self-contained episodes require no tracking of names or threads across the series; the only attention asked is holding the three or four parallel plotlines until they collide."},{"axis":"Register","code":"Reg","value":5,"confidence":"medium","justification":"Largely deadpan observational comedy, but heightened by Kramer's broad physical entrances and George's operatic neurotic meltdowns, pushing the pitch above pure naturalism."}],"values":[3,2,1,2,4,5,3,5]},"Sense8":{"genres":["Sci-Fi"],"scores":[{"axis":"Propulsion","code":"Prop","value":5,"confidence":"medium","justification":"The BPO/Whispers manhunt provides a through-line that tightens late, but the show frequently idles in standalone emotional vignettes (Lito's coming-out, Capheus's bus, Kala's wedding) that don't compound, so momentum is intermittent."},{"axis":"Scope","code":"Scope","value":9,"confidence":"high","justification":"Eight protagonists in San Francisco, Berlin, Seoul, Mumbai, Nairobi, Mexico City, Chicago, and London run simultaneously, making the geographic canvas nearly planet-wide."},{"axis":"Institutional Sweep","code":"Swp","value":3,"confidence":"medium","justification":"BPO exerts real pressure as a shadowy organization hunting sensates, but it functions as a faceless antagonist rather than a traced self-perpetuating machine; the drama is the cluster's bonds, not the institution's logic."},{"axis":"Interiority","code":"Int","value":7,"confidence":"medium","justification":"The premise is literal shared consciousness — the eight feel each other's fears, desires and memories — so the show is repeatedly staged inside characters' emotional inner lives, though it's felt-emotion rather than analytic monologue."},{"axis":"Authorial Signature","code":"Auth","value":8,"confidence":"high","justification":"The Wachowski hand is unmistakable: match-cut 'visiting' sequences across continents, synchronized split-action set pieces, lush global cinematography, and the signature cross-cluster orgy montages."},{"axis":"Verisimilitude","code":"Ver","value":5,"confidence":"medium","justification":"On-location shooting gives genuine cultural texture (Nairobi slums, Seoul, Mumbai), but the psychic premise and idealized, heightened emotional beats keep it from feeling reported or lived-in."},{"axis":"Density","code":"Den","value":6,"confidence":"medium","justification":"Tracking eight intercut lives plus their visiting cluster-mates demands attention, but each thread is signposted clearly enough that little is truly withheld."},{"axis":"Register","code":"Reg","value":8,"confidence":"high","justification":"Swelling music, tearful confessional crescendos, and ecstatic collective set pieces (the group singalongs, the orgies) pitch the emotion loud and operatic throughout."}],"values":[5,9,3,7,8,5,6,8]},"Severance":{"genres":["Sci-Fi","Mystery"],"scores":[{"axis":"Propulsion","code":"Prop","value":7,"confidence":"high","justification":"The mystery-box structure compounds—each revelation about the severed floor (the wellness sessions, the map, Petey's defection) tightens the next question, and the season-one finale's overtime-contingency sequence is engineered as a relentless escalation."},{"axis":"Scope","code":"Scope","value":3,"confidence":"high","justification":"The world is confined almost entirely to Lumon's sterile severed floor and the snowbound town around it; the canvas is small by design, a single corporation and a handful of lives."},{"axis":"Institutional Sweep","code":"Swp","value":6,"confidence":"medium","justification":"Lumon functions as a self-perpetuating cult-corporation with its own logic—Kier worship, the Board, departmental rituals, the perks-and-punishments machinery—that the show traces as a subject in its own right, though Mark and the MDR team's personal stakes still share the stage."},{"axis":"Interiority","code":"Int","value":5,"confidence":"medium","justification":"The innie/outie premise is literally about a divided consciousness and identity, so the show is staged around inner experience, yet it mostly observes the severed selves behaviorally rather than narrating their thoughts from within."},{"axis":"Authorial Signature","code":"Auth","value":9,"confidence":"high","justification":"The rubric's own test case: rigid symmetry, retro-modern production design, long sterile corridors and Ben Stiller's precisely composed framing make it instantly recognizable blind."},{"axis":"Verisimilitude","code":"Ver","value":4,"confidence":"medium","justification":"The Lumon world is deliberately surreal and uncanny—impossible architecture, anachronistic technology, fictionalized rituals—prioritizing dreamlike unreality over reported, lived-in texture."},{"axis":"Density","code":"Den","value":7,"confidence":"high","justification":"It withholds explanation aggressively—the purpose of refining numbers, the meaning of the perpetuity wing, the names and factions are left for the viewer to assemble without hand-holding."},{"axis":"Register","code":"Reg","value":4,"confidence":"high","justification":"Despite its maximalist design, performances and tone are muted and deadpan—Mark's flat affect, the dry corporate euphemisms and clipped delivery keep the emotional pitch cool even as stakes rise."}],"values":[7,3,6,5,9,4,7,4]},"Sex Education":{"genres":["Comedy"],"scores":[{"axis":"Propulsion","code":"Prop","value":5,"confidence":"medium","justification":"Episodes braid several relationship subplots (Otis's clinic, Maeve, Eric, Adam) with ongoing arcs, but the structure is closer to ensemble dramedy than scene-to-scene escalation — threads advance steadily rather than detonating into one another."},{"axis":"Scope","code":"Scope","value":5,"confidence":"medium","justification":"Confined to Moordale and its small town, but socially broad across a wide teen ensemble plus parents and home lives, covering multiple peer factions and family strata."},{"axis":"Institutional Sweep","code":"Swp","value":3,"confidence":"medium","justification":"Moordale Secondary is mostly a backdrop for personal stories; the show only briefly probes institutional logic via Hope's authoritarian regime in season 3, but the system is never the real subject over the characters' relationships."},{"axis":"Interiority","code":"Int","value":6,"confidence":"medium","justification":"The sex-clinic premise foregrounds characters' private shame, desire, and insecurity, and the show stages a lot of emotional confession, though it still observes behavior more than it lives inside any single mind."},{"axis":"Authorial Signature","code":"Auth","value":7,"confidence":"medium","justification":"A strongly recognizable hand — the candy-bright palette, anachronistic American-meets-British 'no fixed era' aesthetic, and saturated production design give it an unmistakable visual signature."},{"axis":"Verisimilitude","code":"Ver","value":3,"confidence":"medium","justification":"The deliberately unplaceable Americana-styled high school, varsity jackets, and heightened scenarios prioritize a stylized fantasy texture over a lived-in, reported world, even as the emotional beats ring true."},{"axis":"Density","code":"Den","value":3,"confidence":"medium","justification":"Many parallel subplots, but each is clearly signposted with accessible exposition and tidy resolutions; the viewer is rarely asked to track withheld threads or unexplained names."},{"axis":"Register","code":"Reg","value":6,"confidence":"medium","justification":"Emotions are pitched warm and heightened — comedic exaggeration, big confrontations, swelling needle-drops, and melodramatic romantic stakes — though it stops short of fully operatic."}],"values":[5,5,3,6,7,3,3,6]},"Sharp Objects":{"genres":["Mystery","Thriller"],"scores":[{"axis":"Propulsion","code":"Prop","value":4,"confidence":"medium","justification":"The Wind Gap murder investigation provides a forward pull, but the show deliberately idles in atmosphere and Camille's recursive trauma rather than escalating scene-to-scene; the mystery is a frame for mood more than an engine."},{"axis":"Scope","code":"Scope","value":3,"confidence":"high","justification":"Confined almost entirely to the small town of Wind Gap and the Crellin house; the only expansion is temporal, via Camille's childhood flashbacks, not geographic or social breadth."},{"axis":"Institutional Sweep","code":"Swp","value":2,"confidence":"high","justification":"Though there's a police investigation with Detective Willis and Chief Vickery, the law enforcement is backdrop; the real subject is the Crellin family's generational sickness, not any institution's self-perpetuating logic."},{"axis":"Interiority","code":"Int","value":9,"confidence":"high","justification":"The entire show is staged inside Camille's fractured psyche — subliminal memory flashes, the words scarred into her skin surfacing on objects — making her damaged consciousness the literal text."},{"axis":"Authorial Signature","code":"Auth","value":8,"confidence":"high","justification":"Jean-Marc Vallée's signature flash-cut editing, dissolving past and present and embedding words on surfaces, gives the show an instantly recognizable formal hand."},{"axis":"Verisimilitude","code":"Ver","value":7,"confidence":"medium","justification":"The sweltering small-town Missouri texture — the pig farm, Calhoun Day, the gossip and class strata of Wind Gap — feels researched and lived-in despite the gothic stylization."},{"axis":"Density","code":"Den","value":7,"confidence":"medium","justification":"The fragmented, exposition-averse editing forces the viewer to assemble Camille's memories and the mystery's clues without hand-holding, demanding active reconstruction."},{"axis":"Register","code":"Reg","value":5,"confidence":"medium","justification":"Southern Gothic heightening — Adora's poisonous theatricality, the decaying mansion, Amma's doll's-house menace — pitches mid-operatic, but Amy Adams's muted, withdrawn performance keeps much of the emotional key cool."}],"values":[4,3,2,9,8,7,7,5]},"Sherlock":{"genres":["Mystery","Crime"],"scores":[{"axis":"Propulsion","code":"Prop","value":7,"confidence":"medium","justification":"Each feature-length case rockets through deductions and reveals, and the Moriarty arc compounds across episodes, though the anthology-of-cases structure occasionally resets rather than escalating."},{"axis":"Scope","code":"Scope","value":4,"confidence":"medium","justification":"Largely confined to contemporary London and the Holmes-Watson-Mycroft-Moriarty circle; occasional excursions (Baskerville, the Reichenbach plot) widen it only modestly."},{"axis":"Institutional Sweep","code":"Swp","value":2,"confidence":"high","justification":"Scotland Yard and Mycroft's shadowy government role are mere backdrops; the show traces no self-perpetuating institutional logic, only Sherlock's cases and relationships."},{"axis":"Interiority","code":"Int","value":6,"confidence":"medium","justification":"The mind-palace sequences and visualized chains of deduction literally stage the inside of Sherlock's cognition, though his emotional inner life stays guarded."},{"axis":"Authorial Signature","code":"Auth","value":8,"confidence":"high","justification":"Instantly recognizable: on-screen floating text for texts and deductions, whip-pan editing, the mind-palace conceit, and Moffat/Gatiss's structural sleight-of-hand."},{"axis":"Verisimilitude","code":"Ver","value":3,"confidence":"medium","justification":"Deductions are dazzling but implausible, and the criminal underworld and Moriarty's theatrics are mythologized rather than reported or researched."},{"axis":"Density","code":"Den","value":5,"confidence":"medium","justification":"The rapid-fire deductions demand attention in the moment, but the on-screen text spells out clues and the plots remain followable without active thread-tracking."},{"axis":"Register","code":"Reg","value":7,"confidence":"medium","justification":"Cumberbatch's flamboyant delivery, Andrew Scott's theatrical Moriarty, and the swelling, propulsive score pitch the show well toward the operatic end."}],"values":[7,4,2,6,8,3,5,7]},"Shogun":{"genres":["Historical"],"scores":[{"axis":"Propulsion","code":"Prop","value":7,"confidence":"high","justification":"Blackthorne's arrival and Toranaga's maneuvering against the Council of Regents create constant escalation, with each political feint and betrayal forcing the next; momentum builds toward the inevitable war rather than idling."},{"axis":"Scope","code":"Scope","value":7,"confidence":"high","justification":"Spans feudal Japan across Osaka, Edo, and Ajiro, dramatizing rival warlords, the Council of Regents, the Catholic Church's mercantile interests, and competing samurai houses — a broad social and factional canvas."},{"axis":"Institutional Sweep","code":"Swp","value":6,"confidence":"medium","justification":"The Council of Regents, the rigid samurai code, and Portuguese-Jesuit trade machinery operate as systems with their own logic, but the show ultimately centers on Toranaga's and Mariko's personal arcs rather than the machine itself."},{"axis":"Interiority","code":"Int","value":6,"confidence":"medium","justification":"Mariko's torn loyalties and suppressed faith, and Toranaga's concealed calculations, are given real inner weight through voiced reflection and quiet revelation, though much remains deliberately inscrutable by design."},{"axis":"Authorial Signature","code":"Auth","value":6,"confidence":"medium","justification":"A controlled, painterly hand — composed widescreen framing, muted period palette, and patient staging of tea-house and council scenes — that is distinctive without showy formal tricks."},{"axis":"Verisimilitude","code":"Ver","value":8,"confidence":"high","justification":"Meticulous attention to period dress, etiquette, language (with extensive subtitled Japanese), and ritual like seppuku gives the world a researched, lived-in texture rather than exoticized spectacle."},{"axis":"Density","code":"Den","value":6,"confidence":"medium","justification":"Requires tracking shifting alliances among the Regents, Japanese names and titles, and translated dialogue, but the central conflict is clearly legible and exposition is reasonably provided."},{"axis":"Register","code":"Reg","value":5,"confidence":"medium","justification":"Largely restrained and naturalistic in its samurai decorum, but heightened in pivotal moments — Mariko's defiance at the gate, ritual suicides, and swelling score — pitch the emotional key above flat realism."}],"values":[7,7,6,6,6,8,6,5]},"Show Me a Hero":{"genres":["Drama"],"scores":[{"axis":"Propulsion","code":"Prop","value":5,"confidence":"medium","justification":"The federal contempt fines and escalating city-council showdowns over the housing order keep tightening the screws, but the procedural, election-cycle rhythm and the slow integration of the residents' lives mean it builds steadily rather than detonating scene to scene."},{"axis":"Scope","code":"Scope","value":6,"confidence":"medium","justification":"Confined to Yonkers across several years, but it spans the full social ladder of one city — the mayor's office, white homeowner enclaves, the public-housing projects, and the federal judiciary — giving it real social breadth."},{"axis":"Institutional Sweep","code":"Swp","value":7,"confidence":"medium","justification":"Simon traces the self-perpetuating logic of municipal government, the city council, and a federal desegregation mandate as machines grinding forward, though Wasicsko's personal rise and fall shares the stage more than in The Wire."},{"axis":"Interiority","code":"Int","value":4,"confidence":"medium","justification":"There's genuine access to Nick Wasicsko's ambition and unraveling, but the dominant mode is sociological observation of council members and housing-project residents from the outside."},{"axis":"Authorial Signature","code":"Auth","value":4,"confidence":"medium","justification":"Paul Haggis directs in a restrained, naturalistic register; the only recurring flourish is the Springsteen song scoring, and otherwise the craft stays deliberately unobtrusive."},{"axis":"Verisimilitude","code":"Ver","value":9,"confidence":"high","justification":"Drawn from Lisa Belkin's reporting with real names and the granular mechanics of council votes, court hearings, and HUD scattered-site construction; it reads as documented fact."},{"axis":"Density","code":"Den","value":6,"confidence":"medium","justification":"The viewer must track a crowded roster of council members, lawyers, judges, and project residents alongside zoning and litigation details, though it explains its political stakes more than The Wire would."},{"axis":"Register","code":"Reg","value":3,"confidence":"medium","justification":"Tone is cool and naturalistic — flat council-chamber arguments and quiet domestic scenes — with heightening confined to Wasicsko's tragic downbeat and the Springsteen cues."}],"values":[5,6,7,4,4,9,6,3]},"Silicon Valley":{"genres":["Comedy"],"scores":[{"axis":"Propulsion","code":"Prop","value":7,"confidence":"high","justif ilitude","code":"Ver","value":5,"confidence":"medium","justification":"The post-collapse world is rendered poetically and mythically — the Shakespeare-performing caravan and fairy-tale Severn City airport feel emblematic rather than reported, with little interest in the granular logistics of survival."},{"axis":"Density","code":"Den","value":7,"confidence":"medium","justification":"The fractured chronology forces the viewer to actively connect characters across twenty-year gaps (linking Arthur, Miranda's comic, Kirsten, Tyler, and the Prophet) with minimal hand-holding about how the threads fit."},{"axis":"Register","code":"Reg","value":6,"confidence":"low","justification":"Emotionally heightened and lyrical — swelling music, the elegiac 'survival is insufficient' ethos, and grief played tenderly raise the pitch above naturalism, though it stops short of full operatic melodrama."}],"values":[4,6,2,7,8,5,7,6]},"Stranger Things":{"genres":["Sci-Fi","Horror"],"scores":[{"axis":"Propulsion","code":"Prop","value":8,"confidence":"high","justification":"Cliffhanger-driven serialization with parallel groups racing toward convergence; each episode's discovery (Will's disappearance, the lab, the gate) forces the next, and the season finales build to coordinated showdowns."},{"axis":"Scope","code":"Scope","value":5,"confidence":"high","justification":"Largely confined to Hawkins and its parallel Upside Down, though later seasons widen geographically (Russia, California) and split the cast across locations, expanding a fundamentally small-town canvas."},{"axis":"Institutional Sweep","code":"Swp","value":3,"confidence":"medium","justification":"Hawkins Lab and the government conspiracy exert real pressure and menace, but the show is about the kids, families, and friendships, not about tracing the institution's self-perpetuating logic."},{"axis":"Interiority","code":"Int","value":3,"confidence":"medium","justification":"Mostly external and ensemble-driven; we watch the kids act and bond, with only occasional access to Eleven's or Will's inner experience rather than sustained staging inside a mind."},{"axis":"Authorial Signature","code":"Auth","value":6,"confidence":"high","justification":"A strong, recognizable Duffer-brothers hand of 80s pastiche—synth score, Spielberg/King homage framing, neon-lit nostalgia—that you could identify on sight."},{"axis":"Verisimilitude","code":"Ver","value":3,"confidence":"medium","justification":"The 80s production design is meticulous, but the world is nostalgic fantasy—supernatural monsters, conveniently capable kids—prioritizing mythic homage over reported, lived-in texture."},{"axis":"Density","code":"Den","value":3,"confidence":"high","justification":"Generously expository with recaps and clearly signposted threads; the multiple storylines are easy to track and the show actively hand-holds its lore."},{"axis":"Register","code":"Reg","value":7,"confidence":"high","justification":"Heightened and emotionally pitched—swelling synth crescendos, melodramatic friendship and romance beats, and operatic monster set-pieces—leaning maximalist rather than restrained."}],"values":[8,5,3,3,6,3,3,7]},"Suburra":{"genres":["Crime"],"scores":[{"axis":"Propulsion","code":"Prop","value":7,"confidence":"medium","justification":"The shifting alliances and double-crosses between Aureliano, Spadino and Lele keep detonating new betrayals, with each land-deal scheme over Ostia forcing the next confrontation."},{"axis":"Scope","code":"Scope","value":7,"confidence":"medium","justification":"It threads Rome's coastal Ostia clans, the Sinti/Anacleti Roma family, Vatican power-brokers and corrupt municipal politicians into one web spanning the city's underworld and elites."},{"axis":"Institutional Sweep","code":"Swp","value":5,"confidence":"medium","justification":"The Church-politics-mafia nexus (echoing the real Mafia Capitale scandal) genuinely shares the stage, but the drama ultimately tracks the three young protagonists' rise rather than the machine's own logic."},{"axis":"Interiority","code":"Int","value":4,"confidence":"medium","justification":"Mostly observes maneuvering from the outside, though Spadino's hidden homosexuality within the rigid Anacleti clan gives some genuine inner conflict."},{"axis":"Authorial Signature","code":"Auth","value":6,"confidence":"medium","justification":"A glossy, neon-soaked Roman nightscape with a propulsive electronic score gives it a recognizable, stylized hand."},{"axis":"Verisimilitude","code":"Ver","value":5,"confidence":"medium","justification":"Rooted in the real Mafia Capitale corruption case and Roman dialect, but the sleek nightclub glamour and posed gangster cool push it toward mythologized rather than reported."},{"axis":"Density","code":"Den","value":5,"confidence":"medium","justification":"Several factions and shifting deals to track, but the plotting is followable and exposition is fairly generous."},{"axis":"Register","code":"Reg","value":7,"confidence":"medium","justification":"Pitched loud — swelling music, melodramatic betrayals and heightened, swaggering performances drive the emotional key well above naturalism."}],"values":[7,7,5,4,6,5,5,7]},"Succession":{"genres":["Drama"],"scores":[{"axis":"Propulsion","code":"Prop","value":8,"confidence":"high","justification":"Each succession gambit triggers a counter-move—Kendall's vote of no confidence, the cruise scandal, Logan's feints—so every betrayal forces the next, and alliances reshuffle scene to scene without idling."},{"axis":"Scope","code":"Scope","value":4,"confidence":"medium","justification":"Though jets carry the Roys between New York, Tuscany, and a DC hearing, the canvas is a single elite stratum—one family and its corporate orbit—rather than multiple social layers or eras."},{"axis":"Institutional Sweep","code":"Swp","value":4,"confidence":"medium","justification":"Waystar Royco is the constant pressure source, but the show traces the family's psychic warfare, not the conglomerate's self-perpetuating logic; swap the media empire for any dynastic firm and it remains the same story of Logan's children circling him."},{"axis":"Interiority","code":"Int","value":5,"confidence":"medium","justification":"We get real access to Kendall's self-loathing and Roman's flinching neediness, but the dominant mode is observing wounding behavior from the outside rather than staging us inside a single consciousness."},{"axis":"Authorial Signature","code":"Auth","value":7,"confidence":"high","justification":"The restless handheld camera, sudden snap-zooms, and Nicholas Britell's hip-hop-inflected piano theme make the show instantly recognizable blind."},{"axis":"Verisimilitude","code":"Ver","value":7,"confidence":"medium","justification":"The boardroom maneuvering, shareholder politics, PR damage control, and cruise-division cover-up feel researched and plausible to the world of media conglomerates."},{"axis":"Density","code":"Den","value":6,"confidence":"medium","justification":"The rapid, allusion-packed dialogue and shifting deal mechanics reward attention, but the central family power struggle remains followable without active note-taking."},{"axis":"Register","code":"Reg","value":6,"confidence":"medium","justification":"The Shakespearean stakes and torrential profane insults pitch loud, yet they're delivered in cringe-naturalist handheld with no swelling melodrama, landing between operatic and restrained."}],"values":[8,4,4,5,7,7,6,6]},"Tales from the Loop":{"genres":["Sci-Fi"],"scores":[{"axis":"Propulsion","code":"Prop","value":2,"confidence":"high","justification":"The anthology structure deliberately refuses momentum; each episode is a self-contained, quietly resolving meditation (the body-swap, the time-frozen episodes) that doesn't build toward a next event."},{"axis":"Scope","code":"Scope","value":3,"confidence":"medium","justification":"Confined to one small Ohio town built atop the Loop facility, following a few interconnected families over a an escalating stakes; the relegation arc provides some pull but many episodes idle pleasantly."},{"axis":"Scope","code":"Scope","value":3,"confidence":"high","justification":"Confined largely to AFC Richmond's clubhouse, the pitch, and a few Richmond locales; even the Amsterdam and Wembley detours don't widen the canvas much beyond the team and its small circle."},{"axis":"Institutional Sweep","code":"Swp","value":3,"confidence":"medium","justification":"A football club is the setting and ownership/press pressures exist, but the show is about individual emotional healing, not how the football institution perpetuates itself — swap the club for another workplace and it's the same story."},{"axis":"Interiority","code":"Int","value":5,"confidence":"medium","justification":"Ted's therapy sessions with Dr. Sharon and his hidden panic attacks pull us inside his grief and anxiety, though much of the ensemble is observed from the outside."},{"axis":"Authorial Signature","code":"Auth","value":3,"confidence":"medium","justification":"Largely conventional warm sitcom-dramedy coverage with bright lighting and needle-drops; little distinctive formal stamp beyond the genial tone, so it wouldn't be recognizable blind on craft alone."},{"axis":"Verisimilitude","code":"Ver","value":4,"confidence":"medium","justification":"Locker-room banter and the texture of a Premier League season have some grounding, but the relentlessly nice culture, fairy-tale results, and feel-good logic are idealized rather than reported."},{"axis":"Density","code":"Den","value":2,"confidence":"high","justification":"Emotions and motivations are spelled out explicitly, often via Ted's pep-talks and on-the-nose dialogue; nothing demands active tracking and the show hand-holds the viewer through every beat."},{"axis":"Register","code":"Reg","value":6,"confidence":"medium","justification":"Pitched warm and earnest with swelling sentimental music and big emotional speeches (the 'Believe' sign, locker-room monologues), heightened toward uplift while still grounded in comedic naturalism."}],"values":[4,3,3,5,3,4,2,6]},"Tehran":{"genres":["Thriller"],"scores":[{"axis":"Propulsion","code":"Prop","value":7,"confidence":"medium","justification":"Tamar's blown extraction in the pilot kicks off a chain of compounding crises — a failed assassination forces her deeper undercover, each cover identity collapse triggering the next scramble — though some surveillance and waiting stretches idle between set-pieces."},{"axis":"Scope","code":"Scope","value":5,"confidence":"medium","justification":"Largely confined to Tehran's streets, IRGC offices, and safehouses, but the Mossad-versus-Iran framing and the cyber/airstrike stakes reach across two states and their intelligence apparatuses."},{"axis":"Institutional Sweep","code":"Swp","value":4,"confidence":"medium","justification":"The Revolutionary Guard intelligence unit and Mossad both exert constant pressure, but the show tracks Tamar's personal infiltration and divided Iranian-Israeli identity rather than the self-perpetuating logic of either agency."},{"axis":"Interiority","code":"Int","value":4,"confidence":"medium","justification":"We get Tamar's wavering loyalty and her connection to her Iranian aunt and lover Milad, but the show mostly observes her actions under pressure rather than staging itself inside her mind."},{"axis":"Authorial Signature","code":"Auth","value":4,"confidence":"low","justification":"Competent, mostly invisible thriller direction with handheld tension and Tehran-as-Athens location work; no foregrounded stylistic signature you'd recognize blind."},{"axis":"Verisimilitude","code":"Ver","value":6,"confidence":"medium","justification":"The hacking, electrical-grid sabotage, and Mossad tradecraft feel researched, and the depiction of Tehran daily life and underground parties adds texture, though some plot conveniences strain realism."},{"axis":"Density","code":"Den","value":5,"confidence":"medium","justification":"Several parallel threads — Tamar's cover, Faraz's hunt, the Mossad handlers — must be tracked, but the spy-thriller plotting is clearly signposted and rarely withholds what you need."},{"axis":"Register","code":"Reg","value":4,"confidence":"medium","justification":"Mostly taut and naturalistic with cool performances, though Faraz's emotional volatility and the heightened ticking-clock stakes push it slightly above a flat, restrained pitch."}],"values":[7,5,4,4,4,6,5,4]},"The Agency":{"genres":["Thriller"],"scores":[{"axis":"Propulsion","code":"Prop","value":6,"confidence":"medium","justification":"As a slow-burn CIA thriller, the tension around Martian's compromised cover and the forbidden affair with Sami builds steadily, with each operational misstep raising the stakes, though it favors simmering dread over scene-to-scene detonation."},{"axis":"Scope","code":"Scope","value":6,"confidence":"medium","justification":"Anchored in the CIA's London station but reaching into operations in Ukraine, Iran, and Sudan, the canvas is internationally broad without spanning every social stratum or vast timeframes."},{"axis":"Institutional Sweep","code":"Swp","value":6,"confidence":"medium","justification":"The CIA station's tradecraft, handler hierarchies, and bureaucratic risk-management genuinely share the stage as a functioning machine, though the drama still centers on Martian's personal compromise rather than the agency's self-perpetuating logic alone."},{"axis":"Interiority","code":"Int","value":6,"confidence":"low","justification":"Fassbender's Martian carries much of the show through his suppressed inner conflict between duty and his relationship, giving real psychological access without being staged entirely inside one mind."},{"axis":"Authorial Signature","code":"Auth","value":4,"confidence":"low","justification":"The Butterworths deliver a polished, controlled prestige look with cool muted palettes, but the craft stays largely invisible rather than announcing a distinctive auteur hand."},{"axis":"Verisimilitude","code":"Ver","value":7,"confidence":"medium","justification":"Adapted from Le Bureau des Légendes, it leans on plausible spy tradecraft, dead drops, surveillance and agency procedure that feel researched and grounded rather than glamorized."},{"axis":"Density","code":"Den","value":6,"confidence":"low","justification":"Multiple concurrent operations, cover identities, and agency personnel require active tracking, but the show parcels out exposition enough to remain followable."},{"axis":"Register","code":"Reg","value":3,"confidence":"medium","justification":"Performances and tone are deliberately cool and naturalistic, with Fassbender's contained restraint and an understated score keeping the emotional pitch flat despite life-or-death stakes."}],"values":[6,6,6,6,4,7,6,3]},"The Americans":{"genres":["Thriller"],"scores":[{"axis":"Propulsion","code":"Prop","value":8,"confidence":"high","justification":"Each mission and the Jennings' deepening cover stories detonate consequences — a botched op or an exposed agent forces the next desperate move, and the marriage itself escalates as a slow-burn engine."},{"axis":"Scope","code":"Scope","value":6,"confidence":"high","justification":"Spans Cold War espionage across DC suburbia, KGB Rezidentura, FBI counterintelligence, and Moscow, but stays anchored to one family and a handful of factions rather than continents or centuries."},{"axis":"Institutional Sweep","code":"Swp","value":6,"confidence":"medium","justification":"The KGB and FBI operate as real machines with their own bureaucratic logic (Gabriel, the Centre, Stan's counterintel office), but the show's true subject is the Jennings' marriage and identities, not the system itself."},{"axis":"Interiority","code":"Int","value":7,"confidence":"high","justification":"The show lives inside Philip and Elizabeth's competing convictions and the psychic cost of their disguises — est seminars, Philip's doubts, and Elizabeth's ideological res :"medium","justification":"Largely an anthology of self-contained historical episodes (the Aberfan disaster, the moon landing, Churchill's portrait) that resolve within the hour rather than detonating the next problem; the pull is thematic recurrence, not scene-to-scene escalation."},{"axis":"Scope","code":"Scope","value":8,"confidence":"high","justification":"Spans decades from Elizabeth's 1947 wedding through the late 20th century, ranging across Westminster, the Commonwealth, foreign tours, and abdication-era history — a large temporal and social canvas."},{"axis":"Institutional Sweep","code":"Swp","value":7,"confidence":"medium","justification":"The monarchy itself is the real subject: the show repeatedly stages 'the Crown' as a self-perpetuating institution that grinds down Margaret, Philip, and Diana, with Elizabeth's personhood subordinated to its logic."},{"axis":"Interiority","code":"Int","value":5,"confidence":"medium","justification":"It gives some access to Elizabeth's private struggle between duty and self, but the dominant mode is restrained external observation of composed faces rather than staging the action inside a mind."},{"axis":"Authorial Signature","code":"Auth","value":5,"confidence":"medium","justification":"Peter Morgan's prestige register and lavish, symmetrical compositions are recognizable and controlled, but the craft is polished classical rather than a distinctive formal signature you'd identify blind."},{"axis":"Verisimilitude","code":"Ver","value":6,"confidence":"medium","justification":"Meticulous costume, palace, and protocol detail anchor it, but the invented private conversations and dramatized speculation (the Philip/Charles confrontations, imagined meetings) soften the reported-fact texture."},{"axis":"Density","code":"Den","value":4,"confidence":"medium","justification":"Episodes supply ample context for each historical event and rarely demand the viewer track tangled threads across hours; it is accessible prestige drama by des earched and lived-in down to the storefronts."},{"axis":"Density","code":"Den","value":7,"confidence":"medium","justification":"A large ensemble of pimps, workers, cops, and operators with overlapping economic threads must be tracked without much hand-holding, in classic Simon fashion."},{"axis":"Register","code":"Reg","value":3,"confidence":"high","justification":"Plays its sex, violence, and squalor in cool naturalism — flat performances and ambient period soundtrack rather than melodramatic heightening, despite the lurid subject."}],"values":[4,8,8,4,4,9,7,3]},"The End of the Fxxking World":{"genres":["Comedy"],"scores":[{"axis":"Propulsion","code":"Prop","value":7,"confidence":"medium","justification":"The road-trip structure escalates fast — James's plan to kill Alyssa gives way to a real killing and a manhunt, and each short episode's consequence forces the next leg of the run."},{"axis":"Scope","code":"Scope","value":2,"confidence":"high","justification":"Confined to two runaway teenagers crossing a small stretch of England; the canvas is intimate and the cast tiny, never widening beyond their immediate orbit."},{"axis":"Institutional Sweep","code":"Swp","value":2,"confidence":"medium","justification":"The two bumbling detectives in season two add a police presence, but it's a plot pressure on the couple, not a system the show traces for its own logic."},{"axis":"Interiority","code":"Int","value":8,"confidence":"high","justification":"The entire show is built on alternating deadpan inner monologues from James and Alyssa, staging the gap between their private thoughts and their behavior."},{"axis":"Authorial Signature","code":"Auth","value":7,"confidence":"medium","justification":"A strongly recognizable look — flat symmetrical compositions, retro Americana color and jukebox needle-drops grafted onto suburban Britain — marks a distinct directorial hand."},{"axis":"Verisimilitude","code":"Ver","value":4,"confidence":"medium","justification":"The world is heightened and storybook-stylized (the candy-colored diners, the cartoonish adults), grounded emotionally but not reported or researched in texture."},{"axis":"Density","code":"Den","value":3,"confidence":"medium","justification":"Short, linear episodes with constant narration that spells out what each character feels; little is withheld and nothing complex must be tracked."},{"axis":"Register","code":"Reg","value":4,"confidence":"medium","justification":"The dominant key is flat, ironic deadpan — violence and death delivered in cool monotone voiceover — though the romance occasionally swells toward more openly felt emotion."}],"values":[7,2,2,8,7,4,3,4]},"The Expanse":{"genres":["Sci-Fi"],"scores":[{"axis":"Propulsion","code":"Prop","value":9,"confidence":"high","justification":"The Eros incident, the protomolecule's spread, and each political crisis cascade directly into the next; the narrative compounds rather than idles, with the ring gate opening one chapter into the next."},{"axis":"Scope","code":"Scope","value":10,"confidence":"high","justification":"Spans Earth, Mars, the Belt, and eventually thousands of new systems through the ring gates, with three (then more) competing powers across the entire solar system."},{"axis":"Institutional Sweep","code":"Swp","value":8,"confidence":"high","justification":"The UN, Martian military, OPA factions, and corporations (Mao-Kwikowski, Protogen) function as self-perpetuating machines whose logic drives events independent of the Rocinante crew."},{"axis":"Interiority","code":"Int","value":4,"confidence":"medium","justification":"We get some access to Holden's moral idealism and Miller's obsession, but the show is largely externally plotted around events and factions rather than staged inside any one mind."},{"axis":"Authorial Signature","code":"Auth","value":4,"confidence":"medium","justification":"Competent, fairly clean sci-fi craft with attention to thrust gravity and ship design, but no strongly recognizable directorial hand you'd identify blind."},{"axis":"Verisimilitude","code":"Ver","value":8,"confidence":"high","justification":"Newtonian physics, the toll of g-forces and the 'juice,' Belter creole and physiological adaptation to low gravity all feel meticulously worked out."},{"axis":"Density","code":"Den","value":8,"confidence":"high","justification":"Demands tracking many factions, named characters, and political maneuvers across the UN, Mars, and the OPA without much hand-holding."},{"axis":"Register","code":"Reg","value":4,"confidence":"medium","justification":"Largely grounded and naturalistic in performance, though some plot stakes and the protomolecule horror push toward heightened moments."}],"values":[9,10,8,4,4,8,8,4]},"The Fall":{"genres":["Crime"],"scores":[{"axis":"Propulsion","code":"Prop","value":5,"confidence":"medium","justification":"The cat-and-mouse between Gibson and Spector generates real pull, but the show is a deliberate slow-burn that lingers on Spector's grooming routines and Gibson's stillness, and the dragged-out third season idles rather than escalates."},{"axis":"Scope","code":"Scope","value":3,"confidence":"high","justification":"Confined to Belfast and a single investigation orbiting two figures — Spector's household and the PSNI incident room — with no geographic, temporal, or social breadth."},{"axis":"Institutional Sweep","code":"Swp","value":3,"confidence":"medium","justification":"The PSNI and its politics (the chief constable, internal pressure, the bereavement-counsellor cover) supply pressure, but the show is squarely about Gibson and Spector as individuals, not the machine's self-perpetuating logic."},{"axis":"Interiority","code":"Int","value":7,"confidence":"medium","justification":"The series stages itself substantially inside both minds — Spector's compulsions, dreams and notebook drawings, and Gibson's voiced feminist reflections, sleep diary and desires — rather than just observing behaviour."},{"axis":"Authorial Signature","code":"Auth","value":5,"confidence":"medium","justification":"Allan Cubitt's cool, controlled hand is recognizable in the parallel cross-cutting between hunter and prey and the muted, clinical Belfast palette, but it stops short of showy formal trickery."},{"axis":"Verisimilitude","code":"Ver","value":6,"confidence":"medium","justification":"Police procedure, the bereavement-counsellor cover and Belfast texture feel researched, though Spector's near-omnicompetent evasions and the heightened erotic charge push toward thriller convention."},{"axis":"Density","code":"Den","value":4,"confidence":"medium","justification":"The dual-track structure is easy to follow with few names or threads to actively hold; the killer is known from the opening, so little is withheld from the viewer."},{"axis":"Register","code":"Reg","value":4,"confidence":"medium","justification":"Gillian Anderson's icy, near-whispered restraint and the flat, naturalistic playing keep the pitch cool, with only intermittent heightening in the predatory tension."}],"values":[5,3,3,7,5,6,4,4]},"The Glory":{"genres":["Thriller"],"scores":[{"axis":"Propulsion","code":"Prop","value":7,"confidence":"medium","justification":"Moon Dong-eun's revenge plan unfolds as a chain of deliberate moves — recruiting allies, infiltrating the bullies' lives — where each maneuver sets up the next reveal and tightens the trap, though the pacing pauses for flashback."},{"axis":"Scope","code":"Scope","value":4,"confidence":"medium","justification":"Geographically confined to Seoul and a small cluster of the protagonist and her five tormentors, but it spans nearly two decades from high-school abuse to adult reckoning, giving it temporal rather than social breadth."},{"axis":"Institutional Sweep","code":"Swp","value":3,"confidence":"medium","justification":"School authorities, police, and class privilege shielding the bullies form a pressure backdrop, but the show traces one woman's personal vengeance, not the self-perpetuating logic of thos t emotional beats like the finale's doorway farewell — pitched warmer and louder than naturalism."}],"values":[8,7,6,4,5,3,5,6]},"The Good Wife":{"genres":["Drama"],"scores":[{"axis":"Propulsion","code":"Prop","value":6,"confidence":"medium","justification":"The case-of-the-week structure keeps episodes partly self-contained, but the serialized engines — Alicia's marriage to the disgraced Peter, the firm's partnership wars, and the Lockhart/Gardner splits — escalate consequence across seasons and pull you forward."},{"axis":"Scope","code":"Scope","value":5,"confidence":"medium","justification":"Largely confined to Chicago, but it spans law firms, the courts, the State's Attorney's office, gubernatorial campaigns, and brushes with the NSA, giving it real social breadth within one city."},{"axis":"Institutional Sweep","code":"Swp","value":5,"confidence":"medium","justification":"Partnership politics, judicial idiosyncrasies, and electoral machinery are tracked as functioning systems, but the firm and courts are ultimately pressure sources on Alicia's reinvention rather than the show's true subject."},{"axis":"Interiority","code":"Int","value":5,"confidence":"medium","justification":"Alicia is deliberately guarded — the 'good wife' mask is the point — so we read her largely through composed behavior, though the show grants enough emotional access to her humiliation and ambition to sit at mid."},{"axis":"Authorial Signature","code":"Auth","value":4,"confidence":"medium","justification":"The Kings have recognizable touches — eccentric recurring judges, deadpan procedural quirks, occasional on-screen text gimmicks — but it mostly wears the polished, invisible visual grammar of network drama."},{"axis":"Verisimilitude","code":"Ver","value":6,"confidence":"medium","justification":"Legal maneuvering and ripped-from-headlines topicality (bitcoin, NSA surveillance, election fraud) feel researched, though the glossy network sheen and improbably clever courtroom turns soften the n":"Instantly recognizable blind — the red-cloak tableaux, symmetrical formal compositions, saturated color blocking, slow motion, and ironic needle drops mark a strong, deliberate visual hand."},{"axis":"Verisimilitude","code":"Ver","value":5,"confidence":"medium","justification":"The authoritarian tactics and ritual draw on real history, but the world is also heightened and somewhat mythologized — Gilead's mechanics often serve symbolic and emotional effect over reported, granular plausibility."},{"axis":"Density","code":"Den","value":4,"confidence":"medium","justification":"The narrative stays tightly tethered to June with relatively few competing threads to track, and her voiceover regularly spells out the emotional stakes rather than withholding them."},{"axis":"Register","code":"Reg","value":8,"confidence":"high","justification":"The pitch is operatic — swelling and ironic music cues, melodramatic confrontations, and emotionally maximalist close-ups push the tonal key high even in quieter scenes."}],"values":[4,6,5,8,7,5,4,8]},"The Haunting of Hill House":{"genres":["Horror"],"scores":[{"axis":"Propulsion","code":"Prop","value":7,"confidence":"high","justification":"The dual-timeline structure constantly withholds what happened the night the family fled, and each sibling-focused episode ends on a revelation (the body in the car, the red door) that yanks you forward."},{"axis":"Scope","code":"Scope","value":4,"confidence":"medium","justification":"Confined largely to one family and one house, but it spans roughly 26 years between the childhood summer and the adult present, giving it temporal rather than geographic breadth."},{"axis":"Institutional Sweep","code":"Swp","value":1,"confidence":"high","justification":"There is no institution at the center; the subject is a single family's grief and the house itself, with no self-perpetuating system being traced."},{"axis":"Interiority","code":"Int","value":8,"confidence":"high","justification":"Each Crain sibling gets an episode staged inside their psychology — Nell's sleep paralysis and dissociation, Luke's addiction, Theo's numbness — and ghosts double as manifestations of their inner trauma."},{"axis":"Authorial Signature","code":"Auth","value":7,"confidence":"high","justification":"Flanagan's hand is unmistakable: ghosts hidden in the background of frames, the long single-take 'Two Storms' episode, and recurring monologue-driven editing make it recognizable on sight."},{"axis":"Verisimilitude","code":"Ver","value":5,"confidence":"medium","justification":"The grief, addiction, and family-business (the mortuary) texture feel observed and grounded, but it remains a supernatural ghost story with heightened, unrealistic mechanics."},{"axis":"Density","code":"Den","value":6,"confidence":"medium","justification":"Viewers must hold two timelines, match child and adult versions of five siblings, and catch background ghosts and seeded clues, though the emotional throughline keeps it followable."},{"axis":"Register","code":"Reg","value":7,"confidence":"medium","justification":"Tearful, sustained monologues, swelling score, and melodramatic grief (Nell's wedding speech, the bent-neck lady reveal) pitch the emotional key loud and operatic."}],"values":[7,4,1,8,7,5,6,7]},"The Killing":{"genres":["Crime"],"scores":[{"axis":"Propulsion","code":"Prop","value":4,"confidence":"medium","justification":"The Rosie Larsen case is famously stretched across two seasons with cliffhangers that resolve into dead ends and red herrings, so the investigation circles and stalls rather than each scene tightening the next."},{"axis":"Scope","code":"Scope","value":4,"confidence":"medium","justification":"Confined to rainy Seattle and a single homicide, though it reaches across a few strata—the grieving Larsen family, the police, and Darren Richmond's mayoral campaign."},{"axis":"Institutional Sweep","code":"Swp","value":3,"confidence":"medium","justification":"The police department and the political campaign apply pressure and provide setting, but the show follows Linden's obsession and the family's grief rather than tracing any institution's self-perpetuating logic."},{"axis":"Interiority","code":"Int","value":5,"confidence":"medium","justification":"Linden's compulsive fixation on the case and the Larsens' raw mourning give real inner access, but much is still observed externally as behavior rather than staged inside a mind."},{"axis":"Authorial Signature","code":"Auth","value":5,"confidence":"medium","justification":"A consistent, recognizable mood—perpetual rain, desaturated grey-green palette, and slow brooding compositions—marks a deliberate hand without resorting to overt formal tricks."},{"axis":"Verisimilitude","code":"Ver","value":7,"confidence":"medium","justification":"The depiction of the Larsen parents' prolonged grief and the grinding, unglamorous procedural detail feel researched and lived-in rather than sensationalized."},{"axis":"Density","code":"Den","value":6,"confidence":"medium","justification":"The viewer must hold a rotating roster of suspects, alibis, and political-campaign threads as the investigation reshuffles its leads, though it still spells key beats out."},{"axis":"Register","code":"Reg","value":3,"confidence":"medium","justification":"Performances and tone are muted and melancholic—Linden's flat affect, hushed dialogue, and somber restraint keep the emotional pitch cool despite the murder at its center."}],"values":[4,4,3,5,5,7,6,3]},"The Knick":{"genres":["Drama"],"scores":[{"axis":"Propulsion","code":"Prop","value":6,"confidence":"medium","justification":"Thackery's cocaine addiction, the race to pioneer surgical procedures, and the hospital's financial crises keep threads escalating, though Soderbergh often lingers in observational stretches rather than driving scene-to-scene."},{"axis":"Scope","code":"Scope","value":6,"confidence":"medium","justification":"Centered on the Knickerbocker but reaching across 1900 New York's strata — society donors, immigrant slums, Black physicians barred from operating, ambulance turf wars, and back-alley abortion — giving real social breadth within one city."},{"axis":"Institutional Sweep","code":"Swp","value":5,"confidence":"medium","justification":"The hospital's funding, board politics, electrification, and relocation are tracked as a working system, but the show ultimately orbits Thackery and the surgeons rather than the machine's own self-perpetuating logic."},{"axis":"Interiority","code":"Int","value":4,"confidence":"medium","justification":"We feel Thackery's addiction and obsessive drive, but the show mostly observes behavior — the surgeries, the rivalries — rather than staging itself inside any character's consciousness."},{"axis":"Authorial Signature","code":"Auth","value":8,"confidence":"high","justification":"Soderbergh directed, shot, and edited every episode, and the unmistakable anachronistic Cliff Martinez electronic score plus restless handheld camerawork make the hand instantly recognizable."},{"axis":"Verisimilitude","code":"Ver","value":8,"confidence":"high","justification":"The period surgical procedures, instruments, and failures are rendered with researched, gory granularity, and turn-of-the-century New York's class and racial texture feels carefully reconstructed."},{"axis":"Density","code":"Den","value":5,"confidence":"medium","justification":"Multiple plotlines and period medical jargon ask attention, but the storytelling remains followable and rarely withholds the way a maximally demanding show does."},{"axis":"Register","code":"Reg","value":5,"confidence":"medium","justification":"Performances and dialogue stay largely naturalistic, but the pulsing synth score and the heightened intensity of Thackery's mania and the operating-theater set pieces push the pitch above flat realism."}],"values":[6,6,5,4,8,8,5,5]},"The Larry Sanders Show":{"genres":["Comedy"],"scores":[{"axis":"Propulsion","code":"Prop","value":3,"confidence":"medium","j dy played cool — the humiliations land through understated naturalistic performance, not swelling music or melodramatic heightening."}],"values":[3,2,5,4,6,8,4,3]},"The Last of Us":{"genres":["Sci-Fi","Horror"],"scores":[{"axis":"Propulsion","code":"Prop","value":6,"confidence":"high","justification":"The cross-country journey provides forward drive, but standalone detours like the Bill-and-Frank episode and the lengthy winter flashback deliberately pause the engine rather than escalate it scene-to-scene."},{"axis":"Scope","code":"Scope","value":7,"confidence":"high","justification":"Spans a continent-wide trek from Boston to Wyoming over a 20-year collapse, taking in FEDRA quarantine zones, the Kansas City uprising, the Jackson commune, and the Fireflies."},{"axis":"Institutional Sweep","code":"Swp","value":4,"confidence":"medium","justification":"FEDRA's martial law and the Fireflies' revolutionary calculus exert real pressure and the finale hinges on the Fireflies' utilitarian logic, but the show's true subject is Joel and Ellie's bond, not how the machine perpetuates itself."},{"axis":"Interiority","code":"Int","value":5,"confidence":"medium","justification":"It dwells on Joel's buried grief over Sarah and Ellie's survivor guilt, but renders them largely through behavior and dialogue rather than staging the story inside a consciousness."},{"axis":"Authorial Signature","code":"Auth","value":5,"confidence":"medium","justification":"Mazin's hand shows in distinctive structural swings like the near-wordless Bill-and-Frank love story, but the overall craft is handsome and prestige-conventional rather than a blind-recognizable visual signature."},{"axis":"Verisimilitude","code":"Ver","value":7,"confidence":"medium","justification":"The cordyceps mycology is researched and the depopulated cities and quarantine-zone economy feel lived-in, though the infected spectacle pushes toward genre heightening."},{"axis":"Density","code":"Den","value":4,"confidence":"medium","justification":"The plot is linear and accessible with clearly signposted flashbacks and few threads to actively track; it trusts the viewer little beyond following one pair's road trip."},{"axis":"Register","code":"Reg","value":6,"confidence":"medium","justification":"Naturalistic in its quiet stretches but reaches operatic emotional pitch with swelling Gustavo Santaolalla score and melodramatic peaks like the Sarah death and the hospital finale."}],"values":[6,7,4,5,5,7,4,6]},"The Leftovers":{"genres":["Drama","Mystery"],"scores":[{"axis":"Propulsion","code":"Prop","value":6,"confidence":"medium","justification":"The Sudden Departure mystery and Kevin's escalating breakdowns create real forward pull, but the show deliberately stalls and circles through grief, with episodes like the mid-season meditations idling on a single character's despair rather than tightening plot."},{"axis":"Scope","code":"Scope","value":5,"confidence":"medium","justification":"Spans Mapleton, Jarden/Miracle Texas, and Australia and grapples with a global event affecting 2% of humanity, but the lens stays tightly on the Garvey and Murphy families rather than rendering the world's many strata."},{"axis":"Institutional Sweep","code":"Swp","value":3,"confidence":"medium","justification":"The Guilty Remnant cult and the government's response to the Departure exert pressure, but the show is about personal grief and faith, not tracing any institution's self-perpetuating machinery."},{"axis":"Interiority","code":"Int","value":9,"confidence":"high","justification":"The show stages itself inside fractured minds — Kevin's possible psychosis and afterlife hotel sequences, Nora's grief, and dream logic — making subjective consciousness the literal text."},{"axis":"Authorial Signature","code":"Auth","value":8,"confidence":"high","justification":"Lindelof's hand is unmistakable: bold structural gambits like single-character bottle episodes, the recurring 'Let the Mystery Be' and shifting opening titles, and ine."},{"axis":"Interiority","code":"Int","value":4,"confidence":"medium","justification":"Midge's stand-up acts and rapid-fire dialogue reveal her thoughts, but the show stays largely external and performative, observing her behavior rather than staging us deep inside her consciousness."},{"axis":"Authorial Signature","code":"Auth","value":7,"confidence":"high","justification":"Amy Sherman-Palladino's signature is unmistakable: walk-and-talk Steadicam long takes, candy-colored production design, screwball overlapping patter, and meticulously choreographed mid-century tableaux."},{"axis":"Verisimilitude","code":"Ver","value":5,"confidence":"medium","justification":"The period costuming and Manhattan recreation are lavishly researched, but the world is idealized and glamorized—everyone is impossibly quick and immaculate—rather than feeling grittily lived-in."},{"axis":"Density","code":"Den","value":3,"confidence":"medium","justification":"Dialogue is fast but the plotting is accessible and self-explaining; little requires the viewer to actively track hidden threads or withheld exposition."},{"axis":"Register","code":"Reg","value":7,"confidence":"high","justification":"Heightened and theatrical—rapid-fire screwball delivery, swelling jazz, vivid color, and broad comic and emotional flourishes pitch the tone well toward the operatic end."}],"values":[5,5,3,4,7,5,3,7]},"The Newsroom":{"genres":["Drama"],"scores":[{"axis":"Propulsion","code":"Prop","value":6,"confidence":"medium","justification":"Each episode builds toward broadcasting a real news event (the BP spill, bin Laden, the debt ceiling), which gives forward drive, but the relationship subplots and reset-button office romances frequently idle and stall momentum."},{"axis":"Scope","code":"Scope","value":4,"confidence":"medium","justification":"Largely confined to ACN's newsroom and Atlantis Cable News studios, though the breaking-news subjects reach across national and global politics, widening the social canvas
