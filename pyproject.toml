[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "showtype"
version = "0.1.0"
description = "Eight-axis TV-show characterization (Show Type)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3"]

[project.scripts]
showtype = "showtype.cli:main"

[tool.setuptools]
packages = ["showtype"]

[tool.setuptools.package-data]
showtype = ["schema.sql", "schema_pg.sql"]
